# NotionHub generated Daily shortcut workflow v1
name: 更新日记位置

on:
  workflow_dispatch:
    inputs:
      content:
        description: 快捷指令 JSON 参数
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: notionhub-daily-location-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  update:
    name: 更新日记位置
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DAILY_CONFIG: ${{ secrets.DAILY_CONFIG }}
    steps:
      - name: 检查日记配置
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$DAILY_CONFIG" ]; then
            echo "Daily 尚未完成配置。" >&2
            exit 1
          fi
          PLAN="$(printf '%s' "$DAILY_CONFIG" | jq -r '.DAILY_ENTITLEMENT_PLAN // empty')"
          if [ "$PLAN" != "lifetime" ]; then
            echo "日记快捷指令仅对永久用户开放。" >&2
            exit 1
          fi

      - name: 获取日记更新脚本
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .notionhub/daily-shortcuts
          sparse-checkout-cone-mode: false

      - name: 设置 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: 安装依赖
        run: python -m pip install --disable-pip-version-check requests

      - name: 更新日记位置
        env:
          SHORTCUT_CONTENT: ${{ inputs.content }}
        run: python .notionhub/daily-shortcuts/location.py "$SHORTCUT_CONTENT"
