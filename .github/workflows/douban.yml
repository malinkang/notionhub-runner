# NotionHub generated workflow v38
name: 豆瓣
run-name: ${{ github.workflow }}

on:
  workflow_dispatch:
    inputs:
      notionhub_run_id:
        description: NotionHub 内部运行标识
        required: false
        default: ''
      reason:
        description: 触发原因
        required: false
        default: manual
      sync_mode:
        description: 同步模式
        required: false
        default: incremental
        type: choice
        options:
          - incremental
          - full
      payload:
        description: 同步参数 JSON
        required: false
        default: '{}'
  schedule:
    - cron: '0 16 * * *'


permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: notionhub-douban-sync-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  movie:
    name: 同步电影

    outputs:
      enabled: ${{ steps.activation.outputs.enabled }}
    runs-on: ubuntu-latest
    env:
      DOUBAN_CONFIG: ${{ secrets.DOUBAN_CONFIG }}
      NOTIONHUB_API_BASE: https://i.notionhub.app/v1
      NOTIONHUB_SERVICE: douban
      NOTIONHUB_CONFIG_VERSION: '51'
      SYNC_POLICY_STATE_PATH: ${{ github.workspace }}/notionhub-state.json
      SYNC_POLICY_CONTINUATION_PATH: ${{ github.workspace }}/notionhub-continuation-id
      SYNC_POLICY_REPORT_PATH: ${{ github.workspace }}/notionhub-service-report.json
      NOTIONHUB_RUN_META_PATH: ${{ github.workspace }}/notionhub-run-meta.json
    steps:
      - name: 验证运行配置
        id: activation
        env:
          SERVICE_CONFIG: ${{ secrets.DOUBAN_CONFIG }}
        run: |
          if [ -z "$SERVICE_CONFIG" ]; then
            echo "::notice title=豆瓣尚未配置::请先在插件中完成配置并保存。"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          PLAN=$(printf '%s' "$SERVICE_CONFIG" | jq -r '.DOUBAN_SYNC_PLAN // "lifetime"')
          REMAINING=$(printf '%s' "$SERVICE_CONFIG" | jq -r '.DOUBAN_TRIAL_RUNS_REMAINING // 1')
          if [ "$PLAN" = "trial" ] && { ! [[ "$REMAINING" =~ ^[0-9]+$ ]] || [ "$REMAINING" -le 0 ]; }; then
            echo "免费体验次数已用完，请购买激活码。"
            echo "获取激活码：https://www.notionhub.app/docs/get-activation-code.html"
            {
              echo "## 免费体验次数已用完"
              echo ""
              echo "请购买激活码并在 NotionHub 插件中完成激活后重新同步。"
              echo ""
              echo "[查看如何获取激活码](https://www.notionhub.app/docs/get-activation-code.html)"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=免费体验次数已用完::免费体验次数已用完，请购买激活码并在 NotionHub 插件中完成激活后重新同步。%0A%0A获取激活码：https://www.notionhub.app/docs/get-activation-code.html"
            exit 1
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: 验证权限并获取运行程序
        id: authorize
        if: steps.activation.outputs.enabled == 'true'
        run: |
          OIDC_TOKEN=$(curl -fsSL -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https%3A%2F%2Fi.notionhub.app" | jq -r '.value // empty')
          if [ -z "$OIDC_TOKEN" ]; then
            echo "::error title=GitHub 身份验证失败::未能获取本次运行的 OIDC token。"
            exit 1
          fi
          echo "::add-mask::$OIDC_TOKEN"
          RUNTIME_PAYLOAD='{"service":"douban","purpose":"sync"}'
          RUNTIME_RESPONSE="$RUNNER_TEMP/notionhub-runtime-bundle.bin"
          RUNTIME_METADATA="$RUNNER_TEMP/notionhub-runtime-metadata.json"
          RUNTIME_ARCHIVE="$RUNNER_TEMP/notionhub-runner.tar.gz"
          cleanup_runtime_files() { rm -f "$RUNTIME_RESPONSE" "$RUNTIME_METADATA" "$RUNTIME_ARCHIVE"; }
          trap cleanup_runtime_files EXIT
          HTTP_STATUS=$(curl -sS -o "$RUNTIME_RESPONSE" -w '%{http_code}' -X POST "$NOTIONHUB_API_BASE/github/runner/runtime-bundle"             -H "Authorization: Bearer $OIDC_TOKEN" -H 'Content-Type: application/json' --data "$RUNTIME_PAYLOAD")
          if [ "$HTTP_STATUS" = "418" ]; then
            echo "免费体验次数已用完，请购买激活码。"
            echo "获取激活码：https://www.notionhub.app/docs/get-activation-code.html"
            {
              echo "## 免费体验次数已用完"
              echo ""
              echo "请购买激活码并在 NotionHub 插件中完成激活后重新同步。"
              echo ""
              echo "[查看如何获取激活码](https://www.notionhub.app/docs/get-activation-code.html)"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=免费体验次数已用完::免费体验次数已用完，请购买激活码并在 NotionHub 插件中完成激活后重新同步。%0A%0A获取激活码：https://www.notionhub.app/docs/get-activation-code.html"
            exit 1
          fi
          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            MESSAGE=$(jq -r '.message // "运行准备失败"' "$RUNTIME_RESPONSE" 2>/dev/null || echo "运行准备失败")
            echo "::error title=运行准备失败::$MESSAGE"
            exit 1
          fi
          chmod 600 "$RUNTIME_RESPONSE"
          python3 - "$RUNTIME_RESPONSE" "$RUNTIME_METADATA" "$RUNTIME_ARCHIVE" "douban" <<'PY'
          import json
          import os
          import re
          import sys

          source, metadata_path, archive_path, expected_service = sys.argv[1:]
          raw = open(source, 'rb').read()
          magic = b'NHRB1\n'
          if not raw.startswith(magic) or len(raw) < len(magic) + 8:
              raise SystemExit('运行程序响应格式无效。')
          length_bytes = raw[len(magic):len(magic) + 8]
          if not re.fullmatch(rb'[0-9a-fA-F]{8}', length_bytes):
              raise SystemExit('运行配置长度无效。')
          metadata_length = int(length_bytes, 16)
          if metadata_length <= 0 or metadata_length > 1024 * 1024:
              raise SystemExit('运行配置超过大小限制。')
          metadata_start = len(magic) + 8
          metadata_end = metadata_start + metadata_length
          if metadata_end >= len(raw):
              raise SystemExit('运行程序响应不完整。')
          try:
              metadata = json.loads(raw[metadata_start:metadata_end].decode('utf-8'))
          except Exception:
              raise SystemExit('运行配置格式无效。')
          archive = raw[metadata_end:]
          if metadata.get('schemaVersion') != 1:
              raise SystemExit('运行配置版本不受支持。')
          if metadata.get('context', {}).get('service') != expected_service:
              raise SystemExit('运行配置与当前服务不匹配。')
          expected_size = metadata.get('bundle', {}).get('size')
          if not isinstance(expected_size, int) or expected_size != len(archive) or not archive or len(archive) > 64 * 1024 * 1024:
              raise SystemExit('运行程序大小校验失败。')
          for path, data in ((metadata_path, json.dumps(metadata, ensure_ascii=False, separators=(',', ':')).encode()), (archive_path, archive)):
              with open(path, 'wb') as handle:
                  handle.write(data)
              os.chmod(path, 0o600)
          PY
          ACCESS_TOKEN=$(jq -r '.accessToken // empty' "$RUNTIME_METADATA")
          REPORT_TOKEN=$(jq -r '.reportToken // empty' "$RUNTIME_METADATA")
          POLICY_ID=$(jq -r '.context.id // empty' "$RUNTIME_METADATA")
          PLAN=$(jq -r '.context.plan // empty' "$RUNTIME_METADATA")
          POLICY_JSON=$(jq -c '.policy // {}' "$RUNTIME_METADATA")
          POLICY_SIGNATURE=$(jq -r '.policySignature // empty' "$RUNTIME_METADATA")
          SERVICE_CONFIG=$(jq -c '.serviceConfig // empty' "$RUNTIME_METADATA")
          EXPECTED_SIZE=$(jq -r '.bundle.size // empty' "$RUNTIME_METADATA")
          EXPECTED_SHA256=$(jq -r '.bundle.sha256 // empty' "$RUNTIME_METADATA")
          if [ -z "$ACCESS_TOKEN" ] || [ -z "$REPORT_TOKEN" ] || [ -z "$POLICY_ID" ] || [ -z "$PLAN" ] || [ -z "$POLICY_SIGNATURE" ] || [ -z "$SERVICE_CONFIG" ] || [ -z "$EXPECTED_SIZE" ] || [ -z "$EXPECTED_SHA256" ]; then
            echo "::error title=运行准备失败::运行配置缺少必要字段。"
            exit 1
          fi
          for VALUE in "$ACCESS_TOKEN" "$REPORT_TOKEN" "$POLICY_SIGNATURE" "$SERVICE_CONFIG"; do echo "::add-mask::$VALUE"; done
          python3 - "$RUNTIME_METADATA" <<'PY'
          import json
          import sys
          metadata = json.load(open(sys.argv[1], encoding='utf-8'))
          for value in metadata.get('serviceConfig', {}).values():
              escaped = str(value).replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              if len(escaped) >= 8:
                  print(f'::add-mask::{escaped}')
          PY
          ACTUAL_SIZE=$(wc -c < "$RUNTIME_ARCHIVE" | tr -d ' ')
          ACTUAL_SHA256=$(sha256sum "$RUNTIME_ARCHIVE" | awk '{print $1}')
          if [ "$ACTUAL_SIZE" != "$EXPECTED_SIZE" ] || [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
            echo "::error title=运行程序校验失败::下载内容的大小或 SHA-256 不匹配。"
            exit 1
          fi
          if tar -tzf "$RUNTIME_ARCHIVE" | grep -Eq '(^/|(^|/)\.\.(/|$))'; then
            echo "::error title=运行程序校验失败::运行程序包含不安全路径。"
            exit 1
          fi
          tar -xzf "$RUNTIME_ARCHIVE"
          test -f runner/requirements.txt
          test -d runner/notionhub_runner
          {
            echo "NOTIONHUB_RUN_ACCESS_TOKEN=$ACCESS_TOKEN"
            echo "NOTIONHUB_REPORT_TOKEN=$REPORT_TOKEN"
            echo "NOTIONHUB_POLICY_ID=$POLICY_ID"
            echo "SYNC_RUN_ID=$POLICY_ID"
            echo "SYNC_PLAN=$PLAN"
            echo "ENTITLEMENT_PLAN=$PLAN"
            echo "SYNC_POLICY_JSON=$POLICY_JSON"
            echo "SYNC_POLICY_SIGNATURE=$POLICY_SIGNATURE"
            echo "SYNC_POLICY_SIGNING_KEY=$ACCESS_TOKEN"
            echo "NOTIONHUB_TARGET_RESULTS_PATH=$GITHUB_WORKSPACE/notionhub-target-results.json"
            echo 'DOUBAN_CONFIG<<NOTIONHUB_CONFIG_EOF'
            echo "$SERVICE_CONFIG"
            echo 'NOTIONHUB_CONFIG_EOF'
          } >> "$GITHUB_ENV"
          echo "plan=$PLAN" >> "$GITHUB_OUTPUT"

      - name: 初始化同步进度
        id: progress
        if: steps.authorize.outcome == 'success'
        env:
          RAW_ACTION_PAYLOAD: ${{ github.event.inputs.payload || '{}' }}
          INPUT_SYNC_MODE: ${{ github.event.inputs.sync_mode || '' }}
        run: |
          REQUESTED_SYNC_MODE=$(jq -nr --arg raw "$RAW_ACTION_PAYLOAD" --arg input "$INPUT_SYNC_MODE" '($raw | fromjson? // {}) as $payload | ($payload.requestedSyncMode // $payload.syncMode // $payload.sync_mode // "") as $payload_mode | (if $payload_mode == "full" or $payload_mode == "incremental" then $payload_mode elif $input == "full" or $input == "incremental" then $input else "incremental" end)')
          CONFIG_INITIAL_FULL_SYNC_REQUIRED=$(printf '%s' "$DOUBAN_CONFIG" | jq -r '(.DOUBAN_INITIAL_FULL_SYNC_REQUIRED // false) | tostring' 2>/dev/null || echo "false")
          PAYLOAD_INITIAL_FULL_SYNC_REQUIRED=$(jq -nr --arg raw "$RAW_ACTION_PAYLOAD" '($raw | fromjson? // {}) | (.initialFullSyncForced // false) | tostring')
          if [ "$CONFIG_INITIAL_FULL_SYNC_REQUIRED" = "true" ] || [ "$PAYLOAD_INITIAL_FULL_SYNC_REQUIRED" = "true" ]; then
            EFFECTIVE_SYNC_MODE=full
            INITIAL_FULL_SYNC_FORCED=true
          else
            EFFECTIVE_SYNC_MODE="$REQUESTED_SYNC_MODE"
            INITIAL_FULL_SYNC_FORCED=false
          fi
          ACTION_PAYLOAD=$(jq -cn --arg raw "$RAW_ACTION_PAYLOAD" --arg requested "$REQUESTED_SYNC_MODE" --arg effective "$EFFECTIVE_SYNC_MODE" --arg forced "$INITIAL_FULL_SYNC_FORCED" '($raw | fromjson? // {}) | del(.repair_after_sync, .run_safe_repair_after_sync) + {requestedSyncMode:$requested,syncMode:$effective,sync_mode:$effective,effectiveSyncMode:$effective,initialFullSyncForced:($forced == "true"),repair:false,runSafeRepairAfterSync:false}')
          {
            echo "NOTIONHUB_ACTION_PAYLOAD=$ACTION_PAYLOAD"
            echo "NOTIONHUB_REQUESTED_SYNC_MODE=$REQUESTED_SYNC_MODE"
            echo "NOTIONHUB_EFFECTIVE_SYNC_MODE=$EFFECTIVE_SYNC_MODE"
            echo "NOTIONHUB_INITIAL_FULL_SYNC_FORCED=$INITIAL_FULL_SYNC_FORCED"
          } >> "$GITHUB_ENV"
          export NOTIONHUB_ACTION_PAYLOAD="$ACTION_PAYLOAD"
          export NOTIONHUB_REQUESTED_SYNC_MODE="$REQUESTED_SYNC_MODE"
          export NOTIONHUB_EFFECTIVE_SYNC_MODE="$EFFECTIVE_SYNC_MODE"
          export NOTIONHUB_INITIAL_FULL_SYNC_FORCED="$INITIAL_FULL_SYNC_FORCED"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          try:
              policy = json.loads(os.environ.get('SYNC_POLICY_JSON', '{}'))
          except Exception:
              policy = {}
          initial = policy.get('initialState') if isinstance(policy, dict) else None
          state = initial if isinstance(initial, dict) else {}
          Path(os.environ['SYNC_POLICY_STATE_PATH']).write_text(json.dumps(state, ensure_ascii=False), encoding='utf-8')
          PY
          printf '%s' "$NOTIONHUB_POLICY_ID" > "$SYNC_POLICY_CONTINUATION_PATH"
          jq -cn             --arg requested "$NOTIONHUB_REQUESTED_SYNC_MODE"             --arg effective "$NOTIONHUB_EFFECTIVE_SYNC_MODE"             --argjson initialFullSyncForced "${NOTIONHUB_INITIAL_FULL_SYNC_FORCED:-false}"             '{requestedMode:$requested,effectiveMode:$effective,initialFullSyncForced:$initialFullSyncForced}'             > "$NOTIONHUB_RUN_META_PATH"

      - name: 检查同步电影配置
        id: job_config
        if: steps.progress.outcome == 'success'
        run: |
          SERVICE_CONFIG="$DOUBAN_CONFIG"
          PLAN=$(printf '%s' "$SERVICE_CONFIG" | jq -r '.DOUBAN_SYNC_PLAN // "lifetime"')
          JOB_ENABLED=true
          SKIP_REASON=""
          SERVICE_OPTIONS=$(printf '%s' "$SERVICE_CONFIG" | jq -c '.DOUBAN_SERVICE_OPTIONS // {}')
          if ! printf '%s' "$SERVICE_OPTIONS" | jq -e --arg key "movie" '(if type == "string" then (try fromjson catch {}) elif type == "object" then . else {} end) | (.enabledStreams // []) as $enabled | ($enabled | length == 0) or ($enabled | index($key) != null)' >/dev/null; then
            JOB_ENABLED=false
            SKIP_REASON="未在同步内容中启用"
          fi
          echo "enabled=$JOB_ENABLED" >> "$GITHUB_OUTPUT"
          echo "plan=$PLAN" >> "$GITHUB_OUTPUT"
          if [ "$JOB_ENABLED" != "true" ]; then
            echo "::notice title=同步电影已跳过::$SKIP_REASON"
          fi

      - name: 配置 Python 环境
        if: steps.job_config.outputs.enabled == 'true' && steps.authorize.outcome == 'success'
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 安装运行依赖
        id: install
        if: steps.job_config.outputs.enabled == 'true' && steps.authorize.outcome == 'success'
        run: |
          python -m pip install --quiet --disable-pip-version-check --upgrade pip
          if [ -f runner/requirements.txt ]; then pip install --quiet --disable-pip-version-check -r runner/requirements.txt; fi
          SERVICE_REQUIREMENTS=$(cd runner && python -m notionhub_runner requirements douban)
          if [ -f "$SERVICE_REQUIREMENTS" ]; then pip install --quiet --disable-pip-version-check -r "$SERVICE_REQUIREMENTS"; fi


      - name: 同步电影
        id: sync
        if: steps.job_config.outputs.enabled == 'true' && steps.install.outcome == 'success'
        continue-on-error: true
        env:
          PYTHONUNBUFFERED: '1'
          TZ: Asia/Shanghai
          RAW_ACTION_PAYLOAD: ${{ github.event.inputs.payload || '{}' }}
          INPUT_SYNC_MODE: ${{ github.event.inputs.sync_mode || '' }}
          SUPPORTS_FULL_SYNC: 'true'
          NOTIONHUB_DEFER_FILES: 'true'
        run: |
          REQUESTED_SYNC_MODE=$(jq -nr --arg raw "$RAW_ACTION_PAYLOAD" --arg input "$INPUT_SYNC_MODE" '($raw | fromjson? // {}) as $payload | ($payload.requestedSyncMode // $payload.syncMode // $payload.sync_mode // "") as $payload_mode | (if $payload_mode == "full" or $payload_mode == "incremental" then $payload_mode elif $input == "full" or $input == "incremental" then $input else "incremental" end)')
          CONFIG_INITIAL_FULL_SYNC_REQUIRED=$(printf '%s' "$DOUBAN_CONFIG" | jq -r '(.DOUBAN_INITIAL_FULL_SYNC_REQUIRED // false) | tostring' 2>/dev/null || echo "false")
          PAYLOAD_INITIAL_FULL_SYNC_REQUIRED=$(jq -nr --arg raw "$RAW_ACTION_PAYLOAD" '($raw | fromjson? // {}) | (.initialFullSyncForced // false) | tostring')
          if [ "$CONFIG_INITIAL_FULL_SYNC_REQUIRED" = "true" ] || [ "$PAYLOAD_INITIAL_FULL_SYNC_REQUIRED" = "true" ]; then
            EFFECTIVE_SYNC_MODE=full
            INITIAL_FULL_SYNC_FORCED=true
          else
            EFFECTIVE_SYNC_MODE="$REQUESTED_SYNC_MODE"
            INITIAL_FULL_SYNC_FORCED=false
          fi
          ACTION_PAYLOAD=$(jq -cn --arg raw "$RAW_ACTION_PAYLOAD" --arg requested "$REQUESTED_SYNC_MODE" --arg effective "$EFFECTIVE_SYNC_MODE" --arg forced "$INITIAL_FULL_SYNC_FORCED" '($raw | fromjson? // {}) | del(.repair_after_sync, .run_safe_repair_after_sync) + {requestedSyncMode:$requested,syncMode:$effective,sync_mode:$effective,effectiveSyncMode:$effective,initialFullSyncForced:($forced == "true"),repair:false,runSafeRepairAfterSync:false}')
          {
            echo "NOTIONHUB_ACTION_PAYLOAD=$ACTION_PAYLOAD"
            echo "NOTIONHUB_REQUESTED_SYNC_MODE=$REQUESTED_SYNC_MODE"
            echo "NOTIONHUB_EFFECTIVE_SYNC_MODE=$EFFECTIVE_SYNC_MODE"
            echo "NOTIONHUB_INITIAL_FULL_SYNC_FORCED=$INITIAL_FULL_SYNC_FORCED"
          } >> "$GITHUB_ENV"
          export NOTIONHUB_ACTION_PAYLOAD="$ACTION_PAYLOAD"
          export NOTIONHUB_REQUESTED_SYNC_MODE="$REQUESTED_SYNC_MODE"
          export NOTIONHUB_EFFECTIVE_SYNC_MODE="$EFFECTIVE_SYNC_MODE"
          export NOTIONHUB_INITIAL_FULL_SYNC_FORCED="$INITIAL_FULL_SYNC_FORCED"
          if [ "$SYNC_PLAN" = "trial" ] && [ "$EFFECTIVE_SYNC_MODE" = "full" ]; then
            echo "::error title=免费体验不支持全量更新::请激活后再执行全量更新。"
            exit 1
          fi
          if [ "$EFFECTIVE_SYNC_MODE" = "full" ] && [ "$SUPPORTS_FULL_SYNC" != "true" ]; then
            echo "::error title=全量更新不可用::豆瓣 暂不支持全量更新，请改用普通同步。"
            exit 1
          fi
          cd runner
          python -m notionhub_runner sync douban --job movie

      - name: 记录同步电影结果
        if: always() && steps.activation.outputs.enabled == 'true'
        run: |
          if [ "${{ steps.progress.outcome }}" != "success" ] || [ "${{ steps.job_config.outcome }}" != "success" ]; then
            if [ "false" = "true" ]; then STATUS=warning; else STATUS=failure; fi
          elif [ "${{ steps.job_config.outputs.enabled }}" != "true" ]; then
            STATUS=skipped
          elif [ "${{ steps.sync.outcome }}" = "success" ]; then
            STATUS=success
          elif [ "false" = "true" ]; then
            STATUS=warning
            echo "::warning title=同步电影未完成::主同步结果不受影响，可稍后重试此辅助阶段。"
          else
            STATUS=failure
          fi
          if [ ! -f "$SYNC_POLICY_STATE_PATH" ]; then printf '{}' > "$SYNC_POLICY_STATE_PATH"; fi
          jq -cn             --arg jobKey "movie"             --arg stageLabel "同步电影"             --arg status "$STATUS"             --arg failureClass "${NOTIONHUB_FAILURE_CLASS:-}"             --argjson stageIndex 1             --argjson required true             '{stageIndex:$stageIndex,jobKey:$jobKey,label:$stageLabel,status:$status,required:$required,failureClass:(if ($failureClass | length) > 0 then $failureClass else null end)}'             > "${{ github.workspace }}/notionhub-stage-01.json"

      - name: 保存同步电影进度
        if: always() && steps.activation.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: notionhub-douban-01-movie-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.SYNC_POLICY_STATE_PATH }}
            ${{ env.SYNC_POLICY_CONTINUATION_PATH }}
            ${{ env.NOTIONHUB_RUN_META_PATH }}
            ${{ env.NOTIONHUB_TARGET_RESULTS_PATH }}
            ${{ github.workspace }}/notionhub-stage-01.json
          if-no-files-found: error
          retention-days: 1

      - name: 确认同步电影成功
        if: always() && steps.activation.outputs.enabled == 'true' && steps.job_config.outputs.enabled == 'true'
        run: |
          if [ "${{ steps.sync.outcome }}" != "success" ]; then exit 1; fi


  book:
    name: 同步图书
    needs: movie
    if: needs.movie.outputs.enabled == 'true' && needs.movie.result == 'success'
    runs-on: ubuntu-latest
    env:
      DOUBAN_CONFIG: ${{ secrets.DOUBAN_CONFIG }}
      NOTIONHUB_API_BASE: https://i.notionhub.app/v1
      NOTIONHUB_SERVICE: douban
      NOTIONHUB_CONFIG_VERSION: '51'
      SYNC_POLICY_STATE_PATH: ${{ github.workspace }}/notionhub-state.json
      SYNC_POLICY_CONTINUATION_PATH: ${{ github.workspace }}/notionhub-continuation-id
      SYNC_POLICY_REPORT_PATH: ${{ github.workspace }}/notionhub-service-report.json
      NOTIONHUB_RUN_META_PATH: ${{ github.workspace }}/notionhub-run-meta.json
    steps:
      - name: 恢复上一阶段进度
        id: restore
        if: needs.movie.outputs.enabled == 'true' && needs.movie.result == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ARTIFACT_SPECS=(
            "required|notionhub-douban-01-movie-${{ github.run_id }}-${{ github.run_attempt }}|notionhub-state.json|notionhub-continuation-id|notionhub-run-meta.json|notionhub-stage-01.json"
          )
          ATTEMPT_DIR=""
          cleanup_artifact_attempt() {
            if [ -n "$ATTEMPT_DIR" ] && [ -d "$ATTEMPT_DIR" ]; then
              rm -rf -- "$ATTEMPT_DIR"
            fi
          }
          trap cleanup_artifact_attempt EXIT

          for ATTEMPT in 1 2 3 4 5 6; do
            cleanup_artifact_attempt
            ATTEMPT_DIR=$(mktemp -d "$RUNNER_TEMP/notionhub-artifacts.XXXXXX")
            DOWNLOAD_OK=true
            for SPEC in "${ARTIFACT_SPECS[@]}"; do
              SPEC_REQUIRED="${SPEC%%|*}"
              SPEC_CONTENT="${SPEC#*|}"
              ARTIFACT_NAME="${SPEC_CONTENT%%|*}"
              EXPECTED_FILES="${SPEC_CONTENT#*|}"
              ARTIFACT_OK=true
              ARTIFACT_DIR=""
              RESOLVED_ARTIFACT_NAME=""
              ARTIFACT_BASE_NAME="${ARTIFACT_NAME%-*}"
              CURRENT_RUN_ATTEMPT="${GITHUB_RUN_ATTEMPT:-1}"
              for ((CANDIDATE_ATTEMPT=CURRENT_RUN_ATTEMPT; CANDIDATE_ATTEMPT>=1; CANDIDATE_ATTEMPT--)); do
                CANDIDATE_ARTIFACT_NAME="$ARTIFACT_BASE_NAME-$CANDIDATE_ATTEMPT"
                CANDIDATE_ARTIFACT_DIR="$ATTEMPT_DIR/$CANDIDATE_ARTIFACT_NAME"
                mkdir -p "$CANDIDATE_ARTIFACT_DIR"
                if gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$CANDIDATE_ARTIFACT_NAME" --dir "$CANDIDATE_ARTIFACT_DIR"; then
                  RESOLVED_ARTIFACT_NAME="$CANDIDATE_ARTIFACT_NAME"
                  ARTIFACT_DIR="$CANDIDATE_ARTIFACT_DIR"
                  if [ "$CANDIDATE_ATTEMPT" -lt "$CURRENT_RUN_ATTEMPT" ]; then
                    echo "::notice title=已恢复前次运行进度::当前重试沿用第 ${CANDIDATE_ATTEMPT} 次尝试的阶段结果。"
                  fi
                  break
                fi
                rm -rf -- "$CANDIDATE_ARTIFACT_DIR"
              done
              if [ -z "$RESOLVED_ARTIFACT_NAME" ]; then
                ARTIFACT_OK=false
              else
                IFS='|' read -r -a EXPECTED_FILE_LIST <<< "$EXPECTED_FILES"
                for EXPECTED_FILE in "${EXPECTED_FILE_LIST[@]}"; do
                  if [ ! -f "$ARTIFACT_DIR/$EXPECTED_FILE" ]; then
                    ARTIFACT_OK=false
                    break
                  fi
                done
              fi
              if [ "$ARTIFACT_OK" != "true" ]; then
                if [ -n "$ARTIFACT_DIR" ]; then
                  rm -rf -- "$ARTIFACT_DIR"
                fi
                if [ "$SPEC_REQUIRED" = "required" ]; then
                  echo "::warning title=同步进度暂不可用::必要阶段结果尚未完整可见，将自动重试。"
                  DOWNLOAD_OK=false
                  break
                fi
                echo "::notice title=辅助阶段结果暂不可用::本次汇总将忽略尚未可见的辅助阶段结果。"
              fi
            done
            if [ "$DOWNLOAD_OK" = "true" ]; then
              cp -R "$ATTEMPT_DIR"/*/. "${{ github.workspace }}"/
              cleanup_artifact_attempt
              ATTEMPT_DIR=""
              exit 0
            fi
            if [ "$ATTEMPT" -lt 6 ]; then
              case "$ATTEMPT" in
                1) DELAY=2 ;;
                2) DELAY=4 ;;
                3) DELAY=8 ;;
                4) DELAY=16 ;;
                *) DELAY=30 ;;
              esac
              echo "::notice title=等待同步进度::GitHub 阶段结果暂不可见，${DELAY} 秒后进行第 $((ATTEMPT + 1)) 次尝试。"
              sleep "$DELAY"
            fi
          done

          echo "::error title=同步进度恢复失败::GitHub 阶段结果在 6 次尝试后仍不可用。"
          exit 1

      - name: 检查同步图书配置
        id: job_config
        if: needs.movie.outputs.enabled == 'true' && needs.movie.result == 'success' && steps.restore.outcome == 'success'
        run: |
          SERVICE_CONFIG="$DOUBAN_CONFIG"
          PLAN=$(printf '%s' "$SERVICE_CONFIG" | jq -r '.DOUBAN_SYNC_PLAN // "lifetime"')
          JOB_ENABLED=true
          SKIP_REASON=""
          SERVICE_OPTIONS=$(printf '%s' "$SERVICE_CONFIG" | jq -c '.DOUBAN_SERVICE_OPTIONS // {}')
          if ! printf '%s' "$SERVICE_OPTIONS" | jq -e --arg key "book" '(if type == "string" then (try fromjson catch {}) elif type == "object" then . else {} end) | (.enabledStreams // []) as $enabled | ($enabled | length == 0) or ($enabled | index($key) != null)' >/dev/null; then
            JOB_ENABLED=false
            SKIP_REASON="未在同步内容中启用"
          fi
          echo "enabled=$JOB_ENABLED" >> "$GITHUB_OUTPUT"
          echo "plan=$PLAN" >> "$GITHUB_OUTPUT"
          if [ "$JOB_ENABLED" != "true" ]; then
            echo "::notice title=同步图书已跳过::$SKIP_REASON"
          fi

      - name: 验证权限并获取运行程序
        id: authorize
        if: steps.job_config.outputs.enabled == 'true'
        run: |
          OIDC_TOKEN=$(curl -fsSL -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https%3A%2F%2Fi.notionhub.app" | jq -r '.value // empty')
          if [ -z "$OIDC_TOKEN" ]; then
            echo "::error title=GitHub 身份验证失败::未能获取本次运行的 OIDC token。"
            exit 1
          fi
          echo "::add-mask::$OIDC_TOKEN"
          CONTINUATION_ID="$(cat "$SYNC_POLICY_CONTINUATION_PATH")"
          if [ -z "$CONTINUATION_ID" ]; then
            echo "::error title=运行授权续接失败::同步进度中缺少续接标识。"
            exit 1
          fi
          RUNTIME_PAYLOAD=$(jq -cn --arg service "douban" --arg continuation "$CONTINUATION_ID" '{service:$service,purpose:"sync",continuationPolicyId:$continuation}')
          RUNTIME_RESPONSE="$RUNNER_TEMP/notionhub-runtime-bundle.bin"
          RUNTIME_METADATA="$RUNNER_TEMP/notionhub-runtime-metadata.json"
          RUNTIME_ARCHIVE="$RUNNER_TEMP/notionhub-runner.tar.gz"
          cleanup_runtime_files() { rm -f "$RUNTIME_RESPONSE" "$RUNTIME_METADATA" "$RUNTIME_ARCHIVE"; }
          trap cleanup_runtime_files EXIT
          HTTP_STATUS=$(curl -sS -o "$RUNTIME_RESPONSE" -w '%{http_code}' -X POST "$NOTIONHUB_API_BASE/github/runner/runtime-bundle"             -H "Authorization: Bearer $OIDC_TOKEN" -H 'Content-Type: application/json' --data "$RUNTIME_PAYLOAD")
          if [ "$HTTP_STATUS" = "418" ]; then
            echo "免费体验次数已用完，请购买激活码。"
            echo "获取激活码：https://www.notionhub.app/docs/get-activation-code.html"
            {
              echo "## 免费体验次数已用完"
              echo ""
              echo "请购买激活码并在 NotionHub 插件中完成激活后重新同步。"
              echo ""
              echo "[查看如何获取激活码](https://www.notionhub.app/docs/get-activation-code.html)"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=免费体验次数已用完::免费体验次数已用完，请购买激活码并在 NotionHub 插件中完成激活后重新同步。%0A%0A获取激活码：https://www.notionhub.app/docs/get-activation-code.html"
            exit 1
          fi
          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            MESSAGE=$(jq -r '.message // "运行准备失败"' "$RUNTIME_RESPONSE" 2>/dev/null || echo "运行准备失败")
            echo "::error title=运行准备失败::$MESSAGE"
            exit 1
          fi
          chmod 600 "$RUNTIME_RESPONSE"
          python3 - "$RUNTIME_RESPONSE" "$RUNTIME_METADATA" "$RUNTIME_ARCHIVE" "douban" <<'PY'
          import json
          import os
          import re
          import sys

          source, metadata_path, archive_path, expected_service = sys.argv[1:]
          raw = open(source, 'rb').read()
          magic = b'NHRB1\n'
          if not raw.startswith(magic) or len(raw) < len(magic) + 8:
              raise SystemExit('运行程序响应格式无效。')
          length_bytes = raw[len(magic):len(magic) + 8]
          if not re.fullmatch(rb'[0-9a-fA-F]{8}', length_bytes):
              raise SystemExit('运行配置长度无效。')
          metadata_length = int(length_bytes, 16)
          if metadata_length <= 0 or metadata_length > 1024 * 1024:
              raise SystemExit('运行配置超过大小限制。')
          metadata_start = len(magic) + 8
          metadata_end = metadata_start + metadata_length
          if metadata_end >= len(raw):
              raise SystemExit('运行程序响应不完整。')
          try:
              metadata = json.loads(raw[metadata_start:metadata_end].decode('utf-8'))
          except Exception:
              raise SystemExit('运行配置格式无效。')
          archive = raw[metadata_end:]
          if metadata.get('schemaVersion') != 1:
              raise SystemExit('运行配置版本不受支持。')
          if metadata.get('context', {}).get('service') != expected_service:
              raise SystemExit('运行配置与当前服务不匹配。')
          expected_size = metadata.get('bundle', {}).get('size')
          if not isinstance(expected_size, int) or expected_size != len(archive) or not archive or len(archive) > 64 * 1024 * 1024:
              raise SystemExit('运行程序大小校验失败。')
          for path, data in ((metadata_path, json.dumps(metadata, ensure_ascii=False, separators=(',', ':')).encode()), (archive_path, archive)):
              with open(path, 'wb') as handle:
                  handle.write(data)
              os.chmod(path, 0o600)
          PY
          ACCESS_TOKEN=$(jq -r '.accessToken // empty' "$RUNTIME_METADATA")
          REPORT_TOKEN=$(jq -r '.reportToken // empty' "$RUNTIME_METADATA")
          POLICY_ID=$(jq -r '.context.id // empty' "$RUNTIME_METADATA")
          PLAN=$(jq -r '.context.plan // empty' "$RUNTIME_METADATA")
          POLICY_JSON=$(jq -c '.policy // {}' "$RUNTIME_METADATA")
          POLICY_SIGNATURE=$(jq -r '.policySignature // empty' "$RUNTIME_METADATA")
          SERVICE_CONFIG=$(jq -c '.serviceConfig // empty' "$RUNTIME_METADATA")
          EXPECTED_SIZE=$(jq -r '.bundle.size // empty' "$RUNTIME_METADATA")
          EXPECTED_SHA256=$(jq -r '.bundle.sha256 // empty' "$RUNTIME_METADATA")
          if [ -z "$ACCESS_TOKEN" ] || [ -z "$REPORT_TOKEN" ] || [ -z "$POLICY_ID" ] || [ -z "$PLAN" ] || [ -z "$POLICY_SIGNATURE" ] || [ -z "$SERVICE_CONFIG" ] || [ -z "$EXPECTED_SIZE" ] || [ -z "$EXPECTED_SHA256" ]; then
            echo "::error title=运行准备失败::运行配置缺少必要字段。"
            exit 1
          fi
          for VALUE in "$ACCESS_TOKEN" "$REPORT_TOKEN" "$POLICY_SIGNATURE" "$SERVICE_CONFIG"; do echo "::add-mask::$VALUE"; done
          python3 - "$RUNTIME_METADATA" <<'PY'
          import json
          import sys
          metadata = json.load(open(sys.argv[1], encoding='utf-8'))
          for value in metadata.get('serviceConfig', {}).values():
              escaped = str(value).replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              if len(escaped) >= 8:
                  print(f'::add-mask::{escaped}')
          PY
          ACTUAL_SIZE=$(wc -c < "$RUNTIME_ARCHIVE" | tr -d ' ')
          ACTUAL_SHA256=$(sha256sum "$RUNTIME_ARCHIVE" | awk '{print $1}')
          if [ "$ACTUAL_SIZE" != "$EXPECTED_SIZE" ] || [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
            echo "::error title=运行程序校验失败::下载内容的大小或 SHA-256 不匹配。"
            exit 1
          fi
          if tar -tzf "$RUNTIME_ARCHIVE" | grep -Eq '(^/|(^|/)\.\.(/|$))'; then
            echo "::error title=运行程序校验失败::运行程序包含不安全路径。"
            exit 1
          fi
          tar -xzf "$RUNTIME_ARCHIVE"
          test -f runner/requirements.txt
          test -d runner/notionhub_runner
          {
            echo "NOTIONHUB_RUN_ACCESS_TOKEN=$ACCESS_TOKEN"
            echo "NOTIONHUB_REPORT_TOKEN=$REPORT_TOKEN"
            echo "NOTIONHUB_POLICY_ID=$POLICY_ID"
            echo "SYNC_RUN_ID=$POLICY_ID"
            echo "SYNC_PLAN=$PLAN"
            echo "ENTITLEMENT_PLAN=$PLAN"
            echo "SYNC_POLICY_JSON=$POLICY_JSON"
            echo "SYNC_POLICY_SIGNATURE=$POLICY_SIGNATURE"
            echo "SYNC_POLICY_SIGNING_KEY=$ACCESS_TOKEN"
            echo "NOTIONHUB_TARGET_RESULTS_PATH=$GITHUB_WORKSPACE/notionhub-target-results.json"
            echo 'DOUBAN_CONFIG<<NOTIONHUB_CONFIG_EOF'
            echo "$SERVICE_CONFIG"
            echo 'NOTIONHUB_CONFIG_EOF'
          } >> "$GITHUB_ENV"
          echo "plan=$PLAN" >> "$GITHUB_OUTPUT"

      - name: 配置 Python 环境
        if: steps.job_config.outputs.enabled == 'true' && steps.authorize.outcome == 'success'
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 安装运行依赖
        id: install
        if: steps.job_config.outputs.enabled == 'true' && steps.authorize.outcome == 'success'
        run: |
          python -m pip install --quiet --disable-pip-version-check --upgrade pip
          if [ -f runner/requirements.txt ]; then pip install --quiet --disable-pip-version-check -r runner/requirements.txt; fi
          SERVICE_REQUIREMENTS=$(cd runner && python -m notionhub_runner requirements douban)
          if [ -f "$SERVICE_REQUIREMENTS" ]; then pip install --quiet --disable-pip-version-check -r "$SERVICE_REQUIREMENTS"; fi


      - name: 同步图书
        id: sync
        if: steps.job_config.outputs.enabled == 'true' && steps.install.outcome == 'success'
        continue-on-error: true
        env:
          PYTHONUNBUFFERED: '1'
          TZ: Asia/Shanghai
          RAW_ACTION_PAYLOAD: ${{ github.event.inputs.payload || '{}' }}
          INPUT_SYNC_MODE: ${{ github.event.inputs.sync_mode || '' }}
          SUPPORTS_FULL_SYNC: 'true'
          NOTIONHUB_DEFER_FILES: 'true'
        run: |
          REQUESTED_SYNC_MODE=$(jq -nr --arg raw "$RAW_ACTION_PAYLOAD" --arg input "$INPUT_SYNC_MODE" '($raw | fromjson? // {}) as $payload | ($payload.requestedSyncMode // $payload.syncMode // $payload.sync_mode // "") as $payload_mode | (if $payload_mode == "full" or $payload_mode == "incremental" then $payload_mode elif $input == "full" or $input == "incremental" then $input else "incremental" end)')
          CONFIG_INITIAL_FULL_SYNC_REQUIRED=$(printf '%s' "$DOUBAN_CONFIG" | jq -r '(.DOUBAN_INITIAL_FULL_SYNC_REQUIRED // false) | tostring' 2>/dev/null || echo "false")
          PAYLOAD_INITIAL_FULL_SYNC_REQUIRED=$(jq -nr --arg raw "$RAW_ACTION_PAYLOAD" '($raw | fromjson? // {}) | (.initialFullSyncForced // false) | tostring')
          if [ "$CONFIG_INITIAL_FULL_SYNC_REQUIRED" = "true" ] || [ "$PAYLOAD_INITIAL_FULL_SYNC_REQUIRED" = "true" ]; then
            EFFECTIVE_SYNC_MODE=full
            INITIAL_FULL_SYNC_FORCED=true
          else
            EFFECTIVE_SYNC_MODE="$REQUESTED_SYNC_MODE"
            INITIAL_FULL_SYNC_FORCED=false
          fi
          ACTION_PAYLOAD=$(jq -cn --arg raw "$RAW_ACTION_PAYLOAD" --arg requested "$REQUESTED_SYNC_MODE" --arg effective "$EFFECTIVE_SYNC_MODE" --arg forced "$INITIAL_FULL_SYNC_FORCED" '($raw | fromjson? // {}) | del(.repair_after_sync, .run_safe_repair_after_sync) + {requestedSyncMode:$requested,syncMode:$effective,sync_mode:$effective,effectiveSyncMode:$effective,initialFullSyncForced:($forced == "true"),repair:false,runSafeRepairAfterSync:false}')
          {
            echo "NOTIONHUB_ACTION_PAYLOAD=$ACTION_PAYLOAD"
            echo "NOTIONHUB_REQUESTED_SYNC_MODE=$REQUESTED_SYNC_MODE"
            echo "NOTIONHUB_EFFECTIVE_SYNC_MODE=$EFFECTIVE_SYNC_MODE"
            echo "NOTIONHUB_INITIAL_FULL_SYNC_FORCED=$INITIAL_FULL_SYNC_FORCED"
          } >> "$GITHUB_ENV"
          export NOTIONHUB_ACTION_PAYLOAD="$ACTION_PAYLOAD"
          export NOTIONHUB_REQUESTED_SYNC_MODE="$REQUESTED_SYNC_MODE"
          export NOTIONHUB_EFFECTIVE_SYNC_MODE="$EFFECTIVE_SYNC_MODE"
          export NOTIONHUB_INITIAL_FULL_SYNC_FORCED="$INITIAL_FULL_SYNC_FORCED"
          if [ "$SYNC_PLAN" = "trial" ] && [ "$EFFECTIVE_SYNC_MODE" = "full" ]; then
            echo "::error title=免费体验不支持全量更新::请激活后再执行全量更新。"
            exit 1
          fi
          if [ "$EFFECTIVE_SYNC_MODE" = "full" ] && [ "$SUPPORTS_FULL_SYNC" != "true" ]; then
            echo "::error title=全量更新不可用::豆瓣 暂不支持全量更新，请改用普通同步。"
            exit 1
          fi
          cd runner
          python -m notionhub_runner sync douban --job book

      - name: 记录同步图书结果
        if: always() && needs.movie.outputs.enabled == 'true' && needs.movie.result == 'success'
        run: |
          if [ "${{ steps.restore.outcome }}" != "success" ] || [ "${{ steps.job_config.outcome }}" != "success" ]; then
            if [ "false" = "true" ]; then STATUS=warning; else STATUS=failure; fi
          elif [ "${{ steps.job_config.outputs.enabled }}" != "true" ]; then
            STATUS=skipped
          elif [ "${{ steps.sync.outcome }}" = "success" ]; then
            STATUS=success
          elif [ "false" = "true" ]; then
            STATUS=warning
            echo "::warning title=同步图书未完成::主同步结果不受影响，可稍后重试此辅助阶段。"
          else
            STATUS=failure
          fi
          if [ ! -f "$SYNC_POLICY_STATE_PATH" ]; then printf '{}' > "$SYNC_POLICY_STATE_PATH"; fi
          jq -cn             --arg jobKey "book"             --arg stageLabel "同步图书"             --arg status "$STATUS"             --arg failureClass "${NOTIONHUB_FAILURE_CLASS:-}"             --argjson stageIndex 2             --argjson required true             '{stageIndex:$stageIndex,jobKey:$jobKey,label:$stageLabel,status:$status,required:$required,failureClass:(if ($failureClass | length) > 0 then $failureClass else null end)}'             > "${{ github.workspace }}/notionhub-stage-02.json"

      - name: 保存同步图书进度
        if: always() && needs.movie.outputs.enabled == 'true' && needs.movie.result == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: notionhub-douban-02-book-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.SYNC_POLICY_STATE_PATH }}
            ${{ env.SYNC_POLICY_CONTINUATION_PATH }}
            ${{ env.NOTIONHUB_RUN_META_PATH }}
            ${{ env.NOTIONHUB_TARGET_RESULTS_PATH }}
            ${{ github.workspace }}/notionhub-stage-02.json
          if-no-files-found: error
          retention-days: 1

      - name: 确认同步图书成功
        if: always() && needs.movie.outputs.enabled == 'true' && needs.movie.result == 'success' && steps.job_config.outputs.enabled == 'true'
        run: |
          if [ "${{ steps.sync.outcome }}" != "success" ]; then exit 1; fi


  music:
    name: 同步音乐
    needs: [movie, book]
    if: needs.movie.outputs.enabled == 'true' && needs.book.result == 'success'
    runs-on: ubuntu-latest
    env:
      DOUBAN_CONFIG: ${{ secrets.DOUBAN_CONFIG }}
      NOTIONHUB_API_BASE: https://i.notionhub.app/v1
      NOTIONHUB_SERVICE: douban
      NOTIONHUB_CONFIG_VERSION: '51'
      SYNC_POLICY_STATE_PATH: ${{ github.workspace }}/notionhub-state.json
      SYNC_POLICY_CONTINUATION_PATH: ${{ github.workspace }}/notionhub-continuation-id
      SYNC_POLICY_REPORT_PATH: ${{ github.workspace }}/notionhub-service-report.json
      NOTIONHUB_RUN_META_PATH: ${{ github.workspace }}/notionhub-run-meta.json
    steps:
      - name: 恢复上一阶段进度
        id: restore
        if: needs.movie.outputs.enabled == 'true' && needs.book.result == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ARTIFACT_SPECS=(
            "required|notionhub-douban-02-book-${{ github.run_id }}-${{ github.run_attempt }}|notionhub-state.json|notionhub-continuation-id|notionhub-run-meta.json|notionhub-stage-02.json"
          )
          ATTEMPT_DIR=""
          cleanup_artifact_attempt() {
            if [ -n "$ATTEMPT_DIR" ] && [ -d "$ATTEMPT_DIR" ]; then
              rm -rf -- "$ATTEMPT_DIR"
            fi
          }
          trap cleanup_artifact_attempt EXIT

          for ATTEMPT in 1 2 3 4 5 6; do
            cleanup_artifact_attempt
            ATTEMPT_DIR=$(mktemp -d "$RUNNER_TEMP/notionhub-artifacts.XXXXXX")
            DOWNLOAD_OK=true
            for SPEC in "${ARTIFACT_SPECS[@]}"; do
              SPEC_REQUIRED="${SPEC%%|*}"
              SPEC_CONTENT="${SPEC#*|}"
              ARTIFACT_NAME="${SPEC_CONTENT%%|*}"
              EXPECTED_FILES="${SPEC_CONTENT#*|}"
              ARTIFACT_OK=true
              ARTIFACT_DIR=""
              RESOLVED_ARTIFACT_NAME=""
              ARTIFACT_BASE_NAME="${ARTIFACT_NAME%-*}"
              CURRENT_RUN_ATTEMPT="${GITHUB_RUN_ATTEMPT:-1}"
              for ((CANDIDATE_ATTEMPT=CURRENT_RUN_ATTEMPT; CANDIDATE_ATTEMPT>=1; CANDIDATE_ATTEMPT--)); do
                CANDIDATE_ARTIFACT_NAME="$ARTIFACT_BASE_NAME-$CANDIDATE_ATTEMPT"
                CANDIDATE_ARTIFACT_DIR="$ATTEMPT_DIR/$CANDIDATE_ARTIFACT_NAME"
                mkdir -p "$CANDIDATE_ARTIFACT_DIR"
                if gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$CANDIDATE_ARTIFACT_NAME" --dir "$CANDIDATE_ARTIFACT_DIR"; then
                  RESOLVED_ARTIFACT_NAME="$CANDIDATE_ARTIFACT_NAME"
                  ARTIFACT_DIR="$CANDIDATE_ARTIFACT_DIR"
                  if [ "$CANDIDATE_ATTEMPT" -lt "$CURRENT_RUN_ATTEMPT" ]; then
                    echo "::notice title=已恢复前次运行进度::当前重试沿用第 ${CANDIDATE_ATTEMPT} 次尝试的阶段结果。"
                  fi
                  break
                fi
                rm -rf -- "$CANDIDATE_ARTIFACT_DIR"
              done
              if [ -z "$RESOLVED_ARTIFACT_NAME" ]; then
                ARTIFACT_OK=false
              else
                IFS='|' read -r -a EXPECTED_FILE_LIST <<< "$EXPECTED_FILES"
                for EXPECTED_FILE in "${EXPECTED_FILE_LIST[@]}"; do
                  if [ ! -f "$ARTIFACT_DIR/$EXPECTED_FILE" ]; then
                    ARTIFACT_OK=false
                    break
                  fi
                done
              fi
              if [ "$ARTIFACT_OK" != "true" ]; then
                if [ -n "$ARTIFACT_DIR" ]; then
                  rm -rf -- "$ARTIFACT_DIR"
                fi
                if [ "$SPEC_REQUIRED" = "required" ]; then
                  echo "::warning title=同步进度暂不可用::必要阶段结果尚未完整可见，将自动重试。"
                  DOWNLOAD_OK=false
                  break
                fi
                echo "::notice title=辅助阶段结果暂不可用::本次汇总将忽略尚未可见的辅助阶段结果。"
              fi
            done
            if [ "$DOWNLOAD_OK" = "true" ]; then
              cp -R "$ATTEMPT_DIR"/*/. "${{ github.workspace }}"/
              cleanup_artifact_attempt
              ATTEMPT_DIR=""
              exit 0
            fi
            if [ "$ATTEMPT" -lt 6 ]; then
              case "$ATTEMPT" in
                1) DELAY=2 ;;
                2) DELAY=4 ;;
                3) DELAY=8 ;;
                4) DELAY=16 ;;
                *) DELAY=30 ;;
              esac
              echo "::notice title=等待同步进度::GitHub 阶段结果暂不可见，${DELAY} 秒后进行第 $((ATTEMPT + 1)) 次尝试。"
              sleep "$DELAY"
            fi
          done

          echo "::error title=同步进度恢复失败::GitHub 阶段结果在 6 次尝试后仍不可用。"
          exit 1

      - name: 检查同步音乐配置
        id: job_config
        if: needs.movie.outputs.enabled == 'true' && needs.book.result == 'success' && steps.restore.outcome == 'success'
        run: |
          SERVICE_CONFIG="$DOUBAN_CONFIG"
          PLAN=$(printf '%s' "$SERVICE_CONFIG" | jq -r '.DOUBAN_SYNC_PLAN // "lifetime"')
          JOB_ENABLED=true
          SKIP_REASON=""
          SERVICE_OPTIONS=$(printf '%s' "$SERVICE_CONFIG" | jq -c '.DOUBAN_SERVICE_OPTIONS // {}')
          if ! printf '%s' "$SERVICE_OPTIONS" | jq -e --arg key "music" '(if type == "string" then (try fromjson catch {}) elif type == "object" then . else {} end) | (.enabledStreams // []) as $enabled | ($enabled | length == 0) or ($enabled | index($key) != null)' >/dev/null; then
            JOB_ENABLED=false
            SKIP_REASON="未在同步内容中启用"
          fi
          echo "enabled=$JOB_ENABLED" >> "$GITHUB_OUTPUT"
          echo "plan=$PLAN" >> "$GITHUB_OUTPUT"
          if [ "$JOB_ENABLED" != "true" ]; then
            echo "::notice title=同步音乐已跳过::$SKIP_REASON"
          fi

      - name: 验证权限并获取运行程序
        id: authorize
        if: steps.job_config.outputs.enabled == 'true'
        run: |
          OIDC_TOKEN=$(curl -fsSL -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https%3A%2F%2Fi.notionhub.app" | jq -r '.value // empty')
          if [ -z "$OIDC_TOKEN" ]; then
            echo "::error title=GitHub 身份验证失败::未能获取本次运行的 OIDC token。"
            exit 1
          fi
          echo "::add-mask::$OIDC_TOKEN"
          CONTINUATION_ID="$(cat "$SYNC_POLICY_CONTINUATION_PATH")"
          if [ -z "$CONTINUATION_ID" ]; then
            echo "::error title=运行授权续接失败::同步进度中缺少续接标识。"
            exit 1
          fi
          RUNTIME_PAYLOAD=$(jq -cn --arg service "douban" --arg continuation "$CONTINUATION_ID" '{service:$service,purpose:"sync",continuationPolicyId:$continuation}')
          RUNTIME_RESPONSE="$RUNNER_TEMP/notionhub-runtime-bundle.bin"
          RUNTIME_METADATA="$RUNNER_TEMP/notionhub-runtime-metadata.json"
          RUNTIME_ARCHIVE="$RUNNER_TEMP/notionhub-runner.tar.gz"
          cleanup_runtime_files() { rm -f "$RUNTIME_RESPONSE" "$RUNTIME_METADATA" "$RUNTIME_ARCHIVE"; }
          trap cleanup_runtime_files EXIT
          HTTP_STATUS=$(curl -sS -o "$RUNTIME_RESPONSE" -w '%{http_code}' -X POST "$NOTIONHUB_API_BASE/github/runner/runtime-bundle"             -H "Authorization: Bearer $OIDC_TOKEN" -H 'Content-Type: application/json' --data "$RUNTIME_PAYLOAD")
          if [ "$HTTP_STATUS" = "418" ]; then
            echo "免费体验次数已用完，请购买激活码。"
            echo "获取激活码：https://www.notionhub.app/docs/get-activation-code.html"
            {
              echo "## 免费体验次数已用完"
              echo ""
              echo "请购买激活码并在 NotionHub 插件中完成激活后重新同步。"
              echo ""
              echo "[查看如何获取激活码](https://www.notionhub.app/docs/get-activation-code.html)"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=免费体验次数已用完::免费体验次数已用完，请购买激活码并在 NotionHub 插件中完成激活后重新同步。%0A%0A获取激活码：https://www.notionhub.app/docs/get-activation-code.html"
            exit 1
          fi
          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            MESSAGE=$(jq -r '.message // "运行准备失败"' "$RUNTIME_RESPONSE" 2>/dev/null || echo "运行准备失败")
            echo "::error title=运行准备失败::$MESSAGE"
            exit 1
          fi
          chmod 600 "$RUNTIME_RESPONSE"
          python3 - "$RUNTIME_RESPONSE" "$RUNTIME_METADATA" "$RUNTIME_ARCHIVE" "douban" <<'PY'
          import json
          import os
          import re
          import sys

          source, metadata_path, archive_path, expected_service = sys.argv[1:]
          raw = open(source, 'rb').read()
          magic = b'NHRB1\n'
          if not raw.startswith(magic) or len(raw) < len(magic) + 8:
              raise SystemExit('运行程序响应格式无效。')
          length_bytes = raw[len(magic):len(magic) + 8]
          if not re.fullmatch(rb'[0-9a-fA-F]{8}', length_bytes):
              raise SystemExit('运行配置长度无效。')
          metadata_length = int(length_bytes, 16)
          if metadata_length <= 0 or metadata_length > 1024 * 1024:
              raise SystemExit('运行配置超过大小限制。')
          metadata_start = len(magic) + 8
          metadata_end = metadata_start + metadata_length
          if metadata_end >= len(raw):
              raise SystemExit('运行程序响应不完整。')
          try:
              metadata = json.loads(raw[metadata_start:metadata_end].decode('utf-8'))
          except Exception:
              raise SystemExit('运行配置格式无效。')
          archive = raw[metadata_end:]
          if metadata.get('schemaVersion') != 1:
              raise SystemExit('运行配置版本不受支持。')
          if metadata.get('context', {}).get('service') != expected_service:
              raise SystemExit('运行配置与当前服务不匹配。')
          expected_size = metadata.get('bundle', {}).get('size')
          if not isinstance(expected_size, int) or expected_size != len(archive) or not archive or len(archive) > 64 * 1024 * 1024:
              raise SystemExit('运行程序大小校验失败。')
          for path, data in ((metadata_path, json.dumps(metadata, ensure_ascii=False, separators=(',', ':')).encode()), (archive_path, archive)):
              with open(path, 'wb') as handle:
                  handle.write(data)
              os.chmod(path, 0o600)
          PY
          ACCESS_TOKEN=$(jq -r '.accessToken // empty' "$RUNTIME_METADATA")
          REPORT_TOKEN=$(jq -r '.reportToken // empty' "$RUNTIME_METADATA")
          POLICY_ID=$(jq -r '.context.id // empty' "$RUNTIME_METADATA")
          PLAN=$(jq -r '.context.plan // empty' "$RUNTIME_METADATA")
          POLICY_JSON=$(jq -c '.policy // {}' "$RUNTIME_METADATA")
          POLICY_SIGNATURE=$(jq -r '.policySignature // empty' "$RUNTIME_METADATA")
          SERVICE_CONFIG=$(jq -c '.serviceConfig // empty' "$RUNTIME_METADATA")
          EXPECTED_SIZE=$(jq -r '.bundle.size // empty' "$RUNTIME_METADATA")
          EXPECTED_SHA256=$(jq -r '.bundle.sha256 // empty' "$RUNTIME_METADATA")
          if [ -z "$ACCESS_TOKEN" ] || [ -z "$REPORT_TOKEN" ] || [ -z "$POLICY_ID" ] || [ -z "$PLAN" ] || [ -z "$POLICY_SIGNATURE" ] || [ -z "$SERVICE_CONFIG" ] || [ -z "$EXPECTED_SIZE" ] || [ -z "$EXPECTED_SHA256" ]; then
            echo "::error title=运行准备失败::运行配置缺少必要字段。"
            exit 1
          fi
          for VALUE in "$ACCESS_TOKEN" "$REPORT_TOKEN" "$POLICY_SIGNATURE" "$SERVICE_CONFIG"; do echo "::add-mask::$VALUE"; done
          python3 - "$RUNTIME_METADATA" <<'PY'
          import json
          import sys
          metadata = json.load(open(sys.argv[1], encoding='utf-8'))
          for value in metadata.get('serviceConfig', {}).values():
              escaped = str(value).replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              if len(escaped) >= 8:
                  print(f'::add-mask::{escaped}')
          PY
          ACTUAL_SIZE=$(wc -c < "$RUNTIME_ARCHIVE" | tr -d ' ')
          ACTUAL_SHA256=$(sha256sum "$RUNTIME_ARCHIVE" | awk '{print $1}')
          if [ "$ACTUAL_SIZE" != "$EXPECTED_SIZE" ] || [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
            echo "::error title=运行程序校验失败::下载内容的大小或 SHA-256 不匹配。"
            exit 1
          fi
          if tar -tzf "$RUNTIME_ARCHIVE" | grep -Eq '(^/|(^|/)\.\.(/|$))'; then
            echo "::error title=运行程序校验失败::运行程序包含不安全路径。"
            exit 1
          fi
          tar -xzf "$RUNTIME_ARCHIVE"
          test -f runner/requirements.txt
          test -d runner/notionhub_runner
          {
            echo "NOTIONHUB_RUN_ACCESS_TOKEN=$ACCESS_TOKEN"
            echo "NOTIONHUB_REPORT_TOKEN=$REPORT_TOKEN"
            echo "NOTIONHUB_POLICY_ID=$POLICY_ID"
            echo "SYNC_RUN_ID=$POLICY_ID"
            echo "SYNC_PLAN=$PLAN"
            echo "ENTITLEMENT_PLAN=$PLAN"
            echo "SYNC_POLICY_JSON=$POLICY_JSON"
            echo "SYNC_POLICY_SIGNATURE=$POLICY_SIGNATURE"
            echo "SYNC_POLICY_SIGNING_KEY=$ACCESS_TOKEN"
            echo "NOTIONHUB_TARGET_RESULTS_PATH=$GITHUB_WORKSPACE/notionhub-target-results.json"
            echo 'DOUBAN_CONFIG<<NOTIONHUB_CONFIG_EOF'
            echo "$SERVICE_CONFIG"
            echo 'NOTIONHUB_CONFIG_EOF'
          } >> "$GITHUB_ENV"
          echo "plan=$PLAN" >> "$GITHUB_OUTPUT"

      - name: 配置 Python 环境
        if: steps.job_config.outputs.enabled == 'true' && steps.authorize.outcome == 'success'
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 安装运行依赖
        id: install
        if: steps.job_config.outputs.enabled == 'true' && steps.authorize.outcome == 'success'
        run: |
          python -m pip install --quiet --disable-pip-version-check --upgrade pip
          if [ -f runner/requirements.txt ]; then pip install --quiet --disable-pip-version-check -r runner/requirements.txt; fi
          SERVICE_REQUIREMENTS=$(cd runner && python -m notionhub_runner requirements douban)
          if [ -f "$SERVICE_REQUIREMENTS" ]; then pip install --quiet --disable-pip-version-check -r "$SERVICE_REQUIREMENTS"; fi


      - name: 同步音乐
        id: sync
        if: steps.job_config.outputs.enabled == 'true' && steps.install.outcome == 'success'
        continue-on-error: true
        env:
          PYTHONUNBUFFERED: '1'
          TZ: Asia/Shanghai
          RAW_ACTION_PAYLOAD: ${{ github.event.inputs.payload || '{}' }}
          INPUT_SYNC_MODE: ${{ github.event.inputs.sync_mode || '' }}
          SUPPORTS_FULL_SYNC: 'true'
          NOTIONHUB_DEFER_FILES: 'true'
        run: |
          REQUESTED_SYNC_MODE=$(jq -nr --arg raw "$RAW_ACTION_PAYLOAD" --arg input "$INPUT_SYNC_MODE" '($raw | fromjson? // {}) as $payload | ($payload.requestedSyncMode // $payload.syncMode // $payload.sync_mode // "") as $payload_mode | (if $payload_mode == "full" or $payload_mode == "incremental" then $payload_mode elif $input == "full" or $input == "incremental" then $input else "incremental" end)')
          CONFIG_INITIAL_FULL_SYNC_REQUIRED=$(printf '%s' "$DOUBAN_CONFIG" | jq -r '(.DOUBAN_INITIAL_FULL_SYNC_REQUIRED // false) | tostring' 2>/dev/null || echo "false")
          PAYLOAD_INITIAL_FULL_SYNC_REQUIRED=$(jq -nr --arg raw "$RAW_ACTION_PAYLOAD" '($raw | fromjson? // {}) | (.initialFullSyncForced // false) | tostring')
          if [ "$CONFIG_INITIAL_FULL_SYNC_REQUIRED" = "true" ] || [ "$PAYLOAD_INITIAL_FULL_SYNC_REQUIRED" = "true" ]; then
            EFFECTIVE_SYNC_MODE=full
            INITIAL_FULL_SYNC_FORCED=true
          else
            EFFECTIVE_SYNC_MODE="$REQUESTED_SYNC_MODE"
            INITIAL_FULL_SYNC_FORCED=false
          fi
          ACTION_PAYLOAD=$(jq -cn --arg raw "$RAW_ACTION_PAYLOAD" --arg requested "$REQUESTED_SYNC_MODE" --arg effective "$EFFECTIVE_SYNC_MODE" --arg forced "$INITIAL_FULL_SYNC_FORCED" '($raw | fromjson? // {}) | del(.repair_after_sync, .run_safe_repair_after_sync) + {requestedSyncMode:$requested,syncMode:$effective,sync_mode:$effective,effectiveSyncMode:$effective,initialFullSyncForced:($forced == "true"),repair:false,runSafeRepairAfterSync:false}')
          {
            echo "NOTIONHUB_ACTION_PAYLOAD=$ACTION_PAYLOAD"
            echo "NOTIONHUB_REQUESTED_SYNC_MODE=$REQUESTED_SYNC_MODE"
            echo "NOTIONHUB_EFFECTIVE_SYNC_MODE=$EFFECTIVE_SYNC_MODE"
            echo "NOTIONHUB_INITIAL_FULL_SYNC_FORCED=$INITIAL_FULL_SYNC_FORCED"
          } >> "$GITHUB_ENV"
          export NOTIONHUB_ACTION_PAYLOAD="$ACTION_PAYLOAD"
          export NOTIONHUB_REQUESTED_SYNC_MODE="$REQUESTED_SYNC_MODE"
          export NOTIONHUB_EFFECTIVE_SYNC_MODE="$EFFECTIVE_SYNC_MODE"
          export NOTIONHUB_INITIAL_FULL_SYNC_FORCED="$INITIAL_FULL_SYNC_FORCED"
          if [ "$SYNC_PLAN" = "trial" ] && [ "$EFFECTIVE_SYNC_MODE" = "full" ]; then
            echo "::error title=免费体验不支持全量更新::请激活后再执行全量更新。"
            exit 1
          fi
          if [ "$EFFECTIVE_SYNC_MODE" = "full" ] && [ "$SUPPORTS_FULL_SYNC" != "true" ]; then
            echo "::error title=全量更新不可用::豆瓣 暂不支持全量更新，请改用普通同步。"
            exit 1
          fi
          cd runner
          python -m notionhub_runner sync douban --job music

      - name: 记录同步音乐结果
        if: always() && needs.movie.outputs.enabled == 'true' && needs.book.result == 'success'
        run: |
          if [ "${{ steps.restore.outcome }}" != "success" ] || [ "${{ steps.job_config.outcome }}" != "success" ]; then
            if [ "false" = "true" ]; then STATUS=warning; else STATUS=failure; fi
          elif [ "${{ steps.job_config.outputs.enabled }}" != "true" ]; then
            STATUS=skipped
          elif [ "${{ steps.sync.outcome }}" = "success" ]; then
            STATUS=success
          elif [ "false" = "true" ]; then
            STATUS=warning
            echo "::warning title=同步音乐未完成::主同步结果不受影响，可稍后重试此辅助阶段。"
          else
            STATUS=failure
          fi
          if [ ! -f "$SYNC_POLICY_STATE_PATH" ]; then printf '{}' > "$SYNC_POLICY_STATE_PATH"; fi
          jq -cn             --arg jobKey "music"             --arg stageLabel "同步音乐"             --arg status "$STATUS"             --arg failureClass "${NOTIONHUB_FAILURE_CLASS:-}"             --argjson stageIndex 3             --argjson required true             '{stageIndex:$stageIndex,jobKey:$jobKey,label:$stageLabel,status:$status,required:$required,failureClass:(if ($failureClass | length) > 0 then $failureClass else null end)}'             > "${{ github.workspace }}/notionhub-stage-03.json"

      - name: 保存同步音乐进度
        if: always() && needs.movie.outputs.enabled == 'true' && needs.book.result == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: notionhub-douban-03-music-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.SYNC_POLICY_STATE_PATH }}
            ${{ env.SYNC_POLICY_CONTINUATION_PATH }}
            ${{ env.NOTIONHUB_RUN_META_PATH }}
            ${{ env.NOTIONHUB_TARGET_RESULTS_PATH }}
            ${{ github.workspace }}/notionhub-stage-03.json
          if-no-files-found: error
          retention-days: 1

      - name: 确认同步音乐成功
        if: always() && needs.movie.outputs.enabled == 'true' && needs.book.result == 'success' && steps.job_config.outputs.enabled == 'true'
        run: |
          if [ "${{ steps.sync.outcome }}" != "success" ]; then exit 1; fi


  game:
    name: 同步游戏
    needs: [movie, music]
    if: needs.movie.outputs.enabled == 'true' && needs.music.result == 'success'
    runs-on: ubuntu-latest
    env:
      DOUBAN_CONFIG: ${{ secrets.DOUBAN_CONFIG }}
      NOTIONHUB_API_BASE: https://i.notionhub.app/v1
      NOTIONHUB_SERVICE: douban
      NOTIONHUB_CONFIG_VERSION: '51'
      SYNC_POLICY_STATE_PATH: ${{ github.workspace }}/notionhub-state.json
      SYNC_POLICY_CONTINUATION_PATH: ${{ github.workspace }}/notionhub-continuation-id
      SYNC_POLICY_REPORT_PATH: ${{ github.workspace }}/notionhub-service-report.json
      NOTIONHUB_RUN_META_PATH: ${{ github.workspace }}/notionhub-run-meta.json
    steps:
      - name: 恢复上一阶段进度
        id: restore
        if: needs.movie.outputs.enabled == 'true' && needs.music.result == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ARTIFACT_SPECS=(
            "required|notionhub-douban-03-music-${{ github.run_id }}-${{ github.run_attempt }}|notionhub-state.json|notionhub-continuation-id|notionhub-run-meta.json|notionhub-stage-03.json"
          )
          ATTEMPT_DIR=""
          cleanup_artifact_attempt() {
            if [ -n "$ATTEMPT_DIR" ] && [ -d "$ATTEMPT_DIR" ]; then
              rm -rf -- "$ATTEMPT_DIR"
            fi
          }
          trap cleanup_artifact_attempt EXIT

          for ATTEMPT in 1 2 3 4 5 6; do
            cleanup_artifact_attempt
            ATTEMPT_DIR=$(mktemp -d "$RUNNER_TEMP/notionhub-artifacts.XXXXXX")
            DOWNLOAD_OK=true
            for SPEC in "${ARTIFACT_SPECS[@]}"; do
              SPEC_REQUIRED="${SPEC%%|*}"
              SPEC_CONTENT="${SPEC#*|}"
              ARTIFACT_NAME="${SPEC_CONTENT%%|*}"
              EXPECTED_FILES="${SPEC_CONTENT#*|}"
              ARTIFACT_OK=true
              ARTIFACT_DIR=""
              RESOLVED_ARTIFACT_NAME=""
              ARTIFACT_BASE_NAME="${ARTIFACT_NAME%-*}"
              CURRENT_RUN_ATTEMPT="${GITHUB_RUN_ATTEMPT:-1}"
              for ((CANDIDATE_ATTEMPT=CURRENT_RUN_ATTEMPT; CANDIDATE_ATTEMPT>=1; CANDIDATE_ATTEMPT--)); do
                CANDIDATE_ARTIFACT_NAME="$ARTIFACT_BASE_NAME-$CANDIDATE_ATTEMPT"
                CANDIDATE_ARTIFACT_DIR="$ATTEMPT_DIR/$CANDIDATE_ARTIFACT_NAME"
                mkdir -p "$CANDIDATE_ARTIFACT_DIR"
                if gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$CANDIDATE_ARTIFACT_NAME" --dir "$CANDIDATE_ARTIFACT_DIR"; then
                  RESOLVED_ARTIFACT_NAME="$CANDIDATE_ARTIFACT_NAME"
                  ARTIFACT_DIR="$CANDIDATE_ARTIFACT_DIR"
                  if [ "$CANDIDATE_ATTEMPT" -lt "$CURRENT_RUN_ATTEMPT" ]; then
                    echo "::notice title=已恢复前次运行进度::当前重试沿用第 ${CANDIDATE_ATTEMPT} 次尝试的阶段结果。"
                  fi
                  break
                fi
                rm -rf -- "$CANDIDATE_ARTIFACT_DIR"
              done
              if [ -z "$RESOLVED_ARTIFACT_NAME" ]; then
                ARTIFACT_OK=false
              else
                IFS='|' read -r -a EXPECTED_FILE_LIST <<< "$EXPECTED_FILES"
                for EXPECTED_FILE in "${EXPECTED_FILE_LIST[@]}"; do
                  if [ ! -f "$ARTIFACT_DIR/$EXPECTED_FILE" ]; then
                    ARTIFACT_OK=false
                    break
                  fi
                done
              fi
              if [ "$ARTIFACT_OK" != "true" ]; then
                if [ -n "$ARTIFACT_DIR" ]; then
                  rm -rf -- "$ARTIFACT_DIR"
                fi
                if [ "$SPEC_REQUIRED" = "required" ]; then
                  echo "::warning title=同步进度暂不可用::必要阶段结果尚未完整可见，将自动重试。"
                  DOWNLOAD_OK=false
                  break
                fi
                echo "::notice title=辅助阶段结果暂不可用::本次汇总将忽略尚未可见的辅助阶段结果。"
              fi
            done
            if [ "$DOWNLOAD_OK" = "true" ]; then
              cp -R "$ATTEMPT_DIR"/*/. "${{ github.workspace }}"/
              cleanup_artifact_attempt
              ATTEMPT_DIR=""
              exit 0
            fi
            if [ "$ATTEMPT" -lt 6 ]; then
              case "$ATTEMPT" in
                1) DELAY=2 ;;
                2) DELAY=4 ;;
                3) DELAY=8 ;;
                4) DELAY=16 ;;
                *) DELAY=30 ;;
              esac
              echo "::notice title=等待同步进度::GitHub 阶段结果暂不可见，${DELAY} 秒后进行第 $((ATTEMPT + 1)) 次尝试。"
              sleep "$DELAY"
            fi
          done

          echo "::error title=同步进度恢复失败::GitHub 阶段结果在 6 次尝试后仍不可用。"
          exit 1

      - name: 检查同步游戏配置
        id: job_config
        if: needs.movie.outputs.enabled == 'true' && needs.music.result == 'success' && steps.restore.outcome == 'success'
        run: |
          SERVICE_CONFIG="$DOUBAN_CONFIG"
          PLAN=$(printf '%s' "$SERVICE_CONFIG" | jq -r '.DOUBAN_SYNC_PLAN // "lifetime"')
          JOB_ENABLED=true
          SKIP_REASON=""
          SERVICE_OPTIONS=$(printf '%s' "$SERVICE_CONFIG" | jq -c '.DOUBAN_SERVICE_OPTIONS // {}')
          if ! printf '%s' "$SERVICE_OPTIONS" | jq -e --arg key "game" '(if type == "string" then (try fromjson catch {}) elif type == "object" then . else {} end) | (.enabledStreams // []) as $enabled | ($enabled | length == 0) or ($enabled | index($key) != null)' >/dev/null; then
            JOB_ENABLED=false
            SKIP_REASON="未在同步内容中启用"
          fi
          echo "enabled=$JOB_ENABLED" >> "$GITHUB_OUTPUT"
          echo "plan=$PLAN" >> "$GITHUB_OUTPUT"
          if [ "$JOB_ENABLED" != "true" ]; then
            echo "::notice title=同步游戏已跳过::$SKIP_REASON"
          fi

      - name: 验证权限并获取运行程序
        id: authorize
        if: steps.job_config.outputs.enabled == 'true'
        run: |
          OIDC_TOKEN=$(curl -fsSL -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https%3A%2F%2Fi.notionhub.app" | jq -r '.value // empty')
          if [ -z "$OIDC_TOKEN" ]; then
            echo "::error title=GitHub 身份验证失败::未能获取本次运行的 OIDC token。"
            exit 1
          fi
          echo "::add-mask::$OIDC_TOKEN"
          CONTINUATION_ID="$(cat "$SYNC_POLICY_CONTINUATION_PATH")"
          if [ -z "$CONTINUATION_ID" ]; then
            echo "::error title=运行授权续接失败::同步进度中缺少续接标识。"
            exit 1
          fi
          RUNTIME_PAYLOAD=$(jq -cn --arg service "douban" --arg continuation "$CONTINUATION_ID" '{service:$service,purpose:"sync",continuationPolicyId:$continuation}')
          RUNTIME_RESPONSE="$RUNNER_TEMP/notionhub-runtime-bundle.bin"
          RUNTIME_METADATA="$RUNNER_TEMP/notionhub-runtime-metadata.json"
          RUNTIME_ARCHIVE="$RUNNER_TEMP/notionhub-runner.tar.gz"
          cleanup_runtime_files() { rm -f "$RUNTIME_RESPONSE" "$RUNTIME_METADATA" "$RUNTIME_ARCHIVE"; }
          trap cleanup_runtime_files EXIT
          HTTP_STATUS=$(curl -sS -o "$RUNTIME_RESPONSE" -w '%{http_code}' -X POST "$NOTIONHUB_API_BASE/github/runner/runtime-bundle"             -H "Authorization: Bearer $OIDC_TOKEN" -H 'Content-Type: application/json' --data "$RUNTIME_PAYLOAD")
          if [ "$HTTP_STATUS" = "418" ]; then
            echo "免费体验次数已用完，请购买激活码。"
            echo "获取激活码：https://www.notionhub.app/docs/get-activation-code.html"
            {
              echo "## 免费体验次数已用完"
              echo ""
              echo "请购买激活码并在 NotionHub 插件中完成激活后重新同步。"
              echo ""
              echo "[查看如何获取激活码](https://www.notionhub.app/docs/get-activation-code.html)"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=免费体验次数已用完::免费体验次数已用完，请购买激活码并在 NotionHub 插件中完成激活后重新同步。%0A%0A获取激活码：https://www.notionhub.app/docs/get-activation-code.html"
            exit 1
          fi
          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            MESSAGE=$(jq -r '.message // "运行准备失败"' "$RUNTIME_RESPONSE" 2>/dev/null || echo "运行准备失败")
            echo "::error title=运行准备失败::$MESSAGE"
            exit 1
          fi
          chmod 600 "$RUNTIME_RESPONSE"
          python3 - "$RUNTIME_RESPONSE" "$RUNTIME_METADATA" "$RUNTIME_ARCHIVE" "douban" <<'PY'
          import json
          import os
          import re
          import sys

          source, metadata_path, archive_path, expected_service = sys.argv[1:]
          raw = open(source, 'rb').read()
          magic = b'NHRB1\n'
          if not raw.startswith(magic) or len(raw) < len(magic) + 8:
              raise SystemExit('运行程序响应格式无效。')
          length_bytes = raw[len(magic):len(magic) + 8]
          if not re.fullmatch(rb'[0-9a-fA-F]{8}', length_bytes):
              raise SystemExit('运行配置长度无效。')
          metadata_length = int(length_bytes, 16)
          if metadata_length <= 0 or metadata_length > 1024 * 1024:
              raise SystemExit('运行配置超过大小限制。')
          metadata_start = len(magic) + 8
          metadata_end = metadata_start + metadata_length
          if metadata_end >= len(raw):
              raise SystemExit('运行程序响应不完整。')
          try:
              metadata = json.loads(raw[metadata_start:metadata_end].decode('utf-8'))
          except Exception:
              raise SystemExit('运行配置格式无效。')
          archive = raw[metadata_end:]
          if metadata.get('schemaVersion') != 1:
              raise SystemExit('运行配置版本不受支持。')
          if metadata.get('context', {}).get('service') != expected_service:
              raise SystemExit('运行配置与当前服务不匹配。')
          expected_size = metadata.get('bundle', {}).get('size')
          if not isinstance(expected_size, int) or expected_size != len(archive) or not archive or len(archive) > 64 * 1024 * 1024:
              raise SystemExit('运行程序大小校验失败。')
          for path, data in ((metadata_path, json.dumps(metadata, ensure_ascii=False, separators=(',', ':')).encode()), (archive_path, archive)):
              with open(path, 'wb') as handle:
                  handle.write(data)
              os.chmod(path, 0o600)
          PY
          ACCESS_TOKEN=$(jq -r '.accessToken // empty' "$RUNTIME_METADATA")
          REPORT_TOKEN=$(jq -r '.reportToken // empty' "$RUNTIME_METADATA")
          POLICY_ID=$(jq -r '.context.id // empty' "$RUNTIME_METADATA")
          PLAN=$(jq -r '.context.plan // empty' "$RUNTIME_METADATA")
          POLICY_JSON=$(jq -c '.policy // {}' "$RUNTIME_METADATA")
          POLICY_SIGNATURE=$(jq -r '.policySignature // empty' "$RUNTIME_METADATA")
          SERVICE_CONFIG=$(jq -c '.serviceConfig // empty' "$RUNTIME_METADATA")
          EXPECTED_SIZE=$(jq -r '.bundle.size // empty' "$RUNTIME_METADATA")
          EXPECTED_SHA256=$(jq -r '.bundle.sha256 // empty' "$RUNTIME_METADATA")
          if [ -z "$ACCESS_TOKEN" ] || [ -z "$REPORT_TOKEN" ] || [ -z "$POLICY_ID" ] || [ -z "$PLAN" ] || [ -z "$POLICY_SIGNATURE" ] || [ -z "$SERVICE_CONFIG" ] || [ -z "$EXPECTED_SIZE" ] || [ -z "$EXPECTED_SHA256" ]; then
            echo "::error title=运行准备失败::运行配置缺少必要字段。"
            exit 1
          fi
          for VALUE in "$ACCESS_TOKEN" "$REPORT_TOKEN" "$POLICY_SIGNATURE" "$SERVICE_CONFIG"; do echo "::add-mask::$VALUE"; done
          python3 - "$RUNTIME_METADATA" <<'PY'
          import json
          import sys
          metadata = json.load(open(sys.argv[1], encoding='utf-8'))
          for value in metadata.get('serviceConfig', {}).values():
              escaped = str(value).replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              if len(escaped) >= 8:
                  print(f'::add-mask::{escaped}')
          PY
          ACTUAL_SIZE=$(wc -c < "$RUNTIME_ARCHIVE" | tr -d ' ')
          ACTUAL_SHA256=$(sha256sum "$RUNTIME_ARCHIVE" | awk '{print $1}')
          if [ "$ACTUAL_SIZE" != "$EXPECTED_SIZE" ] || [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
            echo "::error title=运行程序校验失败::下载内容的大小或 SHA-256 不匹配。"
            exit 1
          fi
          if tar -tzf "$RUNTIME_ARCHIVE" | grep -Eq '(^/|(^|/)\.\.(/|$))'; then
            echo "::error title=运行程序校验失败::运行程序包含不安全路径。"
            exit 1
          fi
          tar -xzf "$RUNTIME_ARCHIVE"
          test -f runner/requirements.txt
          test -d runner/notionhub_runner
          {
            echo "NOTIONHUB_RUN_ACCESS_TOKEN=$ACCESS_TOKEN"
            echo "NOTIONHUB_REPORT_TOKEN=$REPORT_TOKEN"
            echo "NOTIONHUB_POLICY_ID=$POLICY_ID"
            echo "SYNC_RUN_ID=$POLICY_ID"
            echo "SYNC_PLAN=$PLAN"
            echo "ENTITLEMENT_PLAN=$PLAN"
            echo "SYNC_POLICY_JSON=$POLICY_JSON"
            echo "SYNC_POLICY_SIGNATURE=$POLICY_SIGNATURE"
            echo "SYNC_POLICY_SIGNING_KEY=$ACCESS_TOKEN"
            echo "NOTIONHUB_TARGET_RESULTS_PATH=$GITHUB_WORKSPACE/notionhub-target-results.json"
            echo 'DOUBAN_CONFIG<<NOTIONHUB_CONFIG_EOF'
            echo "$SERVICE_CONFIG"
            echo 'NOTIONHUB_CONFIG_EOF'
          } >> "$GITHUB_ENV"
          echo "plan=$PLAN" >> "$GITHUB_OUTPUT"

      - name: 配置 Python 环境
        if: steps.job_config.outputs.enabled == 'true' && steps.authorize.outcome == 'success'
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 安装运行依赖
        id: install
        if: steps.job_config.outputs.enabled == 'true' && steps.authorize.outcome == 'success'
        run: |
          python -m pip install --quiet --disable-pip-version-check --upgrade pip
          if [ -f runner/requirements.txt ]; then pip install --quiet --disable-pip-version-check -r runner/requirements.txt; fi
          SERVICE_REQUIREMENTS=$(cd runner && python -m notionhub_runner requirements douban)
          if [ -f "$SERVICE_REQUIREMENTS" ]; then pip install --quiet --disable-pip-version-check -r "$SERVICE_REQUIREMENTS"; fi


      - name: 同步游戏
        id: sync
        if: steps.job_config.outputs.enabled == 'true' && steps.install.outcome == 'success'
        continue-on-error: true
        env:
          PYTHONUNBUFFERED: '1'
          TZ: Asia/Shanghai
          RAW_ACTION_PAYLOAD: ${{ github.event.inputs.payload || '{}' }}
          INPUT_SYNC_MODE: ${{ github.event.inputs.sync_mode || '' }}
          SUPPORTS_FULL_SYNC: 'true'
          NOTIONHUB_DEFER_FILES: 'true'
        run: |
          REQUESTED_SYNC_MODE=$(jq -nr --arg raw "$RAW_ACTION_PAYLOAD" --arg input "$INPUT_SYNC_MODE" '($raw | fromjson? // {}) as $payload | ($payload.requestedSyncMode // $payload.syncMode // $payload.sync_mode // "") as $payload_mode | (if $payload_mode == "full" or $payload_mode == "incremental" then $payload_mode elif $input == "full" or $input == "incremental" then $input else "incremental" end)')
          CONFIG_INITIAL_FULL_SYNC_REQUIRED=$(printf '%s' "$DOUBAN_CONFIG" | jq -r '(.DOUBAN_INITIAL_FULL_SYNC_REQUIRED // false) | tostring' 2>/dev/null || echo "false")
          PAYLOAD_INITIAL_FULL_SYNC_REQUIRED=$(jq -nr --arg raw "$RAW_ACTION_PAYLOAD" '($raw | fromjson? // {}) | (.initialFullSyncForced // false) | tostring')
          if [ "$CONFIG_INITIAL_FULL_SYNC_REQUIRED" = "true" ] || [ "$PAYLOAD_INITIAL_FULL_SYNC_REQUIRED" = "true" ]; then
            EFFECTIVE_SYNC_MODE=full
            INITIAL_FULL_SYNC_FORCED=true
          else
            EFFECTIVE_SYNC_MODE="$REQUESTED_SYNC_MODE"
            INITIAL_FULL_SYNC_FORCED=false
          fi
          ACTION_PAYLOAD=$(jq -cn --arg raw "$RAW_ACTION_PAYLOAD" --arg requested "$REQUESTED_SYNC_MODE" --arg effective "$EFFECTIVE_SYNC_MODE" --arg forced "$INITIAL_FULL_SYNC_FORCED" '($raw | fromjson? // {}) | del(.repair_after_sync, .run_safe_repair_after_sync) + {requestedSyncMode:$requested,syncMode:$effective,sync_mode:$effective,effectiveSyncMode:$effective,initialFullSyncForced:($forced == "true"),repair:false,runSafeRepairAfterSync:false}')
          {
            echo "NOTIONHUB_ACTION_PAYLOAD=$ACTION_PAYLOAD"
            echo "NOTIONHUB_REQUESTED_SYNC_MODE=$REQUESTED_SYNC_MODE"
            echo "NOTIONHUB_EFFECTIVE_SYNC_MODE=$EFFECTIVE_SYNC_MODE"
            echo "NOTIONHUB_INITIAL_FULL_SYNC_FORCED=$INITIAL_FULL_SYNC_FORCED"
          } >> "$GITHUB_ENV"
          export NOTIONHUB_ACTION_PAYLOAD="$ACTION_PAYLOAD"
          export NOTIONHUB_REQUESTED_SYNC_MODE="$REQUESTED_SYNC_MODE"
          export NOTIONHUB_EFFECTIVE_SYNC_MODE="$EFFECTIVE_SYNC_MODE"
          export NOTIONHUB_INITIAL_FULL_SYNC_FORCED="$INITIAL_FULL_SYNC_FORCED"
          if [ "$SYNC_PLAN" = "trial" ] && [ "$EFFECTIVE_SYNC_MODE" = "full" ]; then
            echo "::error title=免费体验不支持全量更新::请激活后再执行全量更新。"
            exit 1
          fi
          if [ "$EFFECTIVE_SYNC_MODE" = "full" ] && [ "$SUPPORTS_FULL_SYNC" != "true" ]; then
            echo "::error title=全量更新不可用::豆瓣 暂不支持全量更新，请改用普通同步。"
            exit 1
          fi
          cd runner
          python -m notionhub_runner sync douban --job game

      - name: 记录同步游戏结果
        if: always() && needs.movie.outputs.enabled == 'true' && needs.music.result == 'success'
        run: |
          if [ "${{ steps.restore.outcome }}" != "success" ] || [ "${{ steps.job_config.outcome }}" != "success" ]; then
            if [ "false" = "true" ]; then STATUS=warning; else STATUS=failure; fi
          elif [ "${{ steps.job_config.outputs.enabled }}" != "true" ]; then
            STATUS=skipped
          elif [ "${{ steps.sync.outcome }}" = "success" ]; then
            STATUS=success
          elif [ "false" = "true" ]; then
            STATUS=warning
            echo "::warning title=同步游戏未完成::主同步结果不受影响，可稍后重试此辅助阶段。"
          else
            STATUS=failure
          fi
          if [ ! -f "$SYNC_POLICY_STATE_PATH" ]; then printf '{}' > "$SYNC_POLICY_STATE_PATH"; fi
          jq -cn             --arg jobKey "game"             --arg stageLabel "同步游戏"             --arg status "$STATUS"             --arg failureClass "${NOTIONHUB_FAILURE_CLASS:-}"             --argjson stageIndex 4             --argjson required true             '{stageIndex:$stageIndex,jobKey:$jobKey,label:$stageLabel,status:$status,required:$required,failureClass:(if ($failureClass | length) > 0 then $failureClass else null end)}'             > "${{ github.workspace }}/notionhub-stage-04.json"

      - name: 保存同步游戏进度
        if: always() && needs.movie.outputs.enabled == 'true' && needs.music.result == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: notionhub-douban-04-game-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.SYNC_POLICY_STATE_PATH }}
            ${{ env.SYNC_POLICY_CONTINUATION_PATH }}
            ${{ env.NOTIONHUB_RUN_META_PATH }}
            ${{ env.NOTIONHUB_TARGET_RESULTS_PATH }}
            ${{ github.workspace }}/notionhub-stage-04.json
          if-no-files-found: error
          retention-days: 1

      - name: 确认同步游戏成功
        if: always() && needs.movie.outputs.enabled == 'true' && needs.music.result == 'success' && steps.job_config.outputs.enabled == 'true'
        run: |
          if [ "${{ steps.sync.outcome }}" != "success" ]; then exit 1; fi


  podcast:
    name: 同步播客
    needs: [movie, game]
    if: needs.movie.outputs.enabled == 'true' && needs.game.result == 'success'
    runs-on: ubuntu-latest
    env:
      DOUBAN_CONFIG: ${{ secrets.DOUBAN_CONFIG }}
      NOTIONHUB_API_BASE: https://i.notionhub.app/v1
      NOTIONHUB_SERVICE: douban
      NOTIONHUB_CONFIG_VERSION: '51'
      SYNC_POLICY_STATE_PATH: ${{ github.workspace }}/notionhub-state.json
      SYNC_POLICY_CONTINUATION_PATH: ${{ github.workspace }}/notionhub-continuation-id
      SYNC_POLICY_REPORT_PATH: ${{ github.workspace }}/notionhub-service-report.json
      NOTIONHUB_RUN_META_PATH: ${{ github.workspace }}/notionhub-run-meta.json
    steps:
      - name: 恢复上一阶段进度
        id: restore
        if: needs.movie.outputs.enabled == 'true' && needs.game.result == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ARTIFACT_SPECS=(
            "required|notionhub-douban-04-game-${{ github.run_id }}-${{ github.run_attempt }}|notionhub-state.json|notionhub-continuation-id|notionhub-run-meta.json|notionhub-stage-04.json"
          )
          ATTEMPT_DIR=""
          cleanup_artifact_attempt() {
            if [ -n "$ATTEMPT_DIR" ] && [ -d "$ATTEMPT_DIR" ]; then
              rm -rf -- "$ATTEMPT_DIR"
            fi
          }
          trap cleanup_artifact_attempt EXIT

          for ATTEMPT in 1 2 3 4 5 6; do
            cleanup_artifact_attempt
            ATTEMPT_DIR=$(mktemp -d "$RUNNER_TEMP/notionhub-artifacts.XXXXXX")
            DOWNLOAD_OK=true
            for SPEC in "${ARTIFACT_SPECS[@]}"; do
              SPEC_REQUIRED="${SPEC%%|*}"
              SPEC_CONTENT="${SPEC#*|}"
              ARTIFACT_NAME="${SPEC_CONTENT%%|*}"
              EXPECTED_FILES="${SPEC_CONTENT#*|}"
              ARTIFACT_OK=true
              ARTIFACT_DIR=""
              RESOLVED_ARTIFACT_NAME=""
              ARTIFACT_BASE_NAME="${ARTIFACT_NAME%-*}"
              CURRENT_RUN_ATTEMPT="${GITHUB_RUN_ATTEMPT:-1}"
              for ((CANDIDATE_ATTEMPT=CURRENT_RUN_ATTEMPT; CANDIDATE_ATTEMPT>=1; CANDIDATE_ATTEMPT--)); do
                CANDIDATE_ARTIFACT_NAME="$ARTIFACT_BASE_NAME-$CANDIDATE_ATTEMPT"
                CANDIDATE_ARTIFACT_DIR="$ATTEMPT_DIR/$CANDIDATE_ARTIFACT_NAME"
                mkdir -p "$CANDIDATE_ARTIFACT_DIR"
                if gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$CANDIDATE_ARTIFACT_NAME" --dir "$CANDIDATE_ARTIFACT_DIR"; then
                  RESOLVED_ARTIFACT_NAME="$CANDIDATE_ARTIFACT_NAME"
                  ARTIFACT_DIR="$CANDIDATE_ARTIFACT_DIR"
                  if [ "$CANDIDATE_ATTEMPT" -lt "$CURRENT_RUN_ATTEMPT" ]; then
                    echo "::notice title=已恢复前次运行进度::当前重试沿用第 ${CANDIDATE_ATTEMPT} 次尝试的阶段结果。"
                  fi
                  break
                fi
                rm -rf -- "$CANDIDATE_ARTIFACT_DIR"
              done
              if [ -z "$RESOLVED_ARTIFACT_NAME" ]; then
                ARTIFACT_OK=false
              else
                IFS='|' read -r -a EXPECTED_FILE_LIST <<< "$EXPECTED_FILES"
                for EXPECTED_FILE in "${EXPECTED_FILE_LIST[@]}"; do
                  if [ ! -f "$ARTIFACT_DIR/$EXPECTED_FILE" ]; then
                    ARTIFACT_OK=false
                    break
                  fi
                done
              fi
              if [ "$ARTIFACT_OK" != "true" ]; then
                if [ -n "$ARTIFACT_DIR" ]; then
                  rm -rf -- "$ARTIFACT_DIR"
                fi
                if [ "$SPEC_REQUIRED" = "required" ]; then
                  echo "::warning title=同步进度暂不可用::必要阶段结果尚未完整可见，将自动重试。"
                  DOWNLOAD_OK=false
                  break
                fi
                echo "::notice title=辅助阶段结果暂不可用::本次汇总将忽略尚未可见的辅助阶段结果。"
              fi
            done
            if [ "$DOWNLOAD_OK" = "true" ]; then
              cp -R "$ATTEMPT_DIR"/*/. "${{ github.workspace }}"/
              cleanup_artifact_attempt
              ATTEMPT_DIR=""
              exit 0
            fi
            if [ "$ATTEMPT" -lt 6 ]; then
              case "$ATTEMPT" in
                1) DELAY=2 ;;
                2) DELAY=4 ;;
                3) DELAY=8 ;;
                4) DELAY=16 ;;
                *) DELAY=30 ;;
              esac
              echo "::notice title=等待同步进度::GitHub 阶段结果暂不可见，${DELAY} 秒后进行第 $((ATTEMPT + 1)) 次尝试。"
              sleep "$DELAY"
            fi
          done

          echo "::error title=同步进度恢复失败::GitHub 阶段结果在 6 次尝试后仍不可用。"
          exit 1

      - name: 检查同步播客配置
        id: job_config
        if: needs.movie.outputs.enabled == 'true' && needs.game.result == 'success' && steps.restore.outcome == 'success'
        run: |
          SERVICE_CONFIG="$DOUBAN_CONFIG"
          PLAN=$(printf '%s' "$SERVICE_CONFIG" | jq -r '.DOUBAN_SYNC_PLAN // "lifetime"')
          JOB_ENABLED=true
          SKIP_REASON=""
          SERVICE_OPTIONS=$(printf '%s' "$SERVICE_CONFIG" | jq -c '.DOUBAN_SERVICE_OPTIONS // {}')
          if ! printf '%s' "$SERVICE_OPTIONS" | jq -e --arg key "podcast" '(if type == "string" then (try fromjson catch {}) elif type == "object" then . else {} end) | (.enabledStreams // []) as $enabled | ($enabled | length == 0) or ($enabled | index($key) != null)' >/dev/null; then
            JOB_ENABLED=false
            SKIP_REASON="未在同步内容中启用"
          fi
          echo "enabled=$JOB_ENABLED" >> "$GITHUB_OUTPUT"
          echo "plan=$PLAN" >> "$GITHUB_OUTPUT"
          if [ "$JOB_ENABLED" != "true" ]; then
            echo "::notice title=同步播客已跳过::$SKIP_REASON"
          fi

      - name: 验证权限并获取运行程序
        id: authorize
        if: steps.job_config.outputs.enabled == 'true'
        run: |
          OIDC_TOKEN=$(curl -fsSL -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https%3A%2F%2Fi.notionhub.app" | jq -r '.value // empty')
          if [ -z "$OIDC_TOKEN" ]; then
            echo "::error title=GitHub 身份验证失败::未能获取本次运行的 OIDC token。"
            exit 1
          fi
          echo "::add-mask::$OIDC_TOKEN"
          CONTINUATION_ID="$(cat "$SYNC_POLICY_CONTINUATION_PATH")"
          if [ -z "$CONTINUATION_ID" ]; then
            echo "::error title=运行授权续接失败::同步进度中缺少续接标识。"
            exit 1
          fi
          RUNTIME_PAYLOAD=$(jq -cn --arg service "douban" --arg continuation "$CONTINUATION_ID" '{service:$service,purpose:"sync",continuationPolicyId:$continuation}')
          RUNTIME_RESPONSE="$RUNNER_TEMP/notionhub-runtime-bundle.bin"
          RUNTIME_METADATA="$RUNNER_TEMP/notionhub-runtime-metadata.json"
          RUNTIME_ARCHIVE="$RUNNER_TEMP/notionhub-runner.tar.gz"
          cleanup_runtime_files() { rm -f "$RUNTIME_RESPONSE" "$RUNTIME_METADATA" "$RUNTIME_ARCHIVE"; }
          trap cleanup_runtime_files EXIT
          HTTP_STATUS=$(curl -sS -o "$RUNTIME_RESPONSE" -w '%{http_code}' -X POST "$NOTIONHUB_API_BASE/github/runner/runtime-bundle"             -H "Authorization: Bearer $OIDC_TOKEN" -H 'Content-Type: application/json' --data "$RUNTIME_PAYLOAD")
          if [ "$HTTP_STATUS" = "418" ]; then
            echo "免费体验次数已用完，请购买激活码。"
            echo "获取激活码：https://www.notionhub.app/docs/get-activation-code.html"
            {
              echo "## 免费体验次数已用完"
              echo ""
              echo "请购买激活码并在 NotionHub 插件中完成激活后重新同步。"
              echo ""
              echo "[查看如何获取激活码](https://www.notionhub.app/docs/get-activation-code.html)"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=免费体验次数已用完::免费体验次数已用完，请购买激活码并在 NotionHub 插件中完成激活后重新同步。%0A%0A获取激活码：https://www.notionhub.app/docs/get-activation-code.html"
            exit 1
          fi
          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            MESSAGE=$(jq -r '.message // "运行准备失败"' "$RUNTIME_RESPONSE" 2>/dev/null || echo "运行准备失败")
            echo "::error title=运行准备失败::$MESSAGE"
            exit 1
          fi
          chmod 600 "$RUNTIME_RESPONSE"
          python3 - "$RUNTIME_RESPONSE" "$RUNTIME_METADATA" "$RUNTIME_ARCHIVE" "douban" <<'PY'
          import json
          import os
          import re
          import sys

          source, metadata_path, archive_path, expected_service = sys.argv[1:]
          raw = open(source, 'rb').read()
          magic = b'NHRB1\n'
          if not raw.startswith(magic) or len(raw) < len(magic) + 8:
              raise SystemExit('运行程序响应格式无效。')
          length_bytes = raw[len(magic):len(magic) + 8]
          if not re.fullmatch(rb'[0-9a-fA-F]{8}', length_bytes):
              raise SystemExit('运行配置长度无效。')
          metadata_length = int(length_bytes, 16)
          if metadata_length <= 0 or metadata_length > 1024 * 1024:
              raise SystemExit('运行配置超过大小限制。')
          metadata_start = len(magic) + 8
          metadata_end = metadata_start + metadata_length
          if metadata_end >= len(raw):
              raise SystemExit('运行程序响应不完整。')
          try:
              metadata = json.loads(raw[metadata_start:metadata_end].decode('utf-8'))
          except Exception:
              raise SystemExit('运行配置格式无效。')
          archive = raw[metadata_end:]
          if metadata.get('schemaVersion') != 1:
              raise SystemExit('运行配置版本不受支持。')
          if metadata.get('context', {}).get('service') != expected_service:
              raise SystemExit('运行配置与当前服务不匹配。')
          expected_size = metadata.get('bundle', {}).get('size')
          if not isinstance(expected_size, int) or expected_size != len(archive) or not archive or len(archive) > 64 * 1024 * 1024:
              raise SystemExit('运行程序大小校验失败。')
          for path, data in ((metadata_path, json.dumps(metadata, ensure_ascii=False, separators=(',', ':')).encode()), (archive_path, archive)):
              with open(path, 'wb') as handle:
                  handle.write(data)
              os.chmod(path, 0o600)
          PY
          ACCESS_TOKEN=$(jq -r '.accessToken // empty' "$RUNTIME_METADATA")
          REPORT_TOKEN=$(jq -r '.reportToken // empty' "$RUNTIME_METADATA")
          POLICY_ID=$(jq -r '.context.id // empty' "$RUNTIME_METADATA")
          PLAN=$(jq -r '.context.plan // empty' "$RUNTIME_METADATA")
          POLICY_JSON=$(jq -c '.policy // {}' "$RUNTIME_METADATA")
          POLICY_SIGNATURE=$(jq -r '.policySignature // empty' "$RUNTIME_METADATA")
          SERVICE_CONFIG=$(jq -c '.serviceConfig // empty' "$RUNTIME_METADATA")
          EXPECTED_SIZE=$(jq -r '.bundle.size // empty' "$RUNTIME_METADATA")
          EXPECTED_SHA256=$(jq -r '.bundle.sha256 // empty' "$RUNTIME_METADATA")
          if [ -z "$ACCESS_TOKEN" ] || [ -z "$REPORT_TOKEN" ] || [ -z "$POLICY_ID" ] || [ -z "$PLAN" ] || [ -z "$POLICY_SIGNATURE" ] || [ -z "$SERVICE_CONFIG" ] || [ -z "$EXPECTED_SIZE" ] || [ -z "$EXPECTED_SHA256" ]; then
            echo "::error title=运行准备失败::运行配置缺少必要字段。"
            exit 1
          fi
          for VALUE in "$ACCESS_TOKEN" "$REPORT_TOKEN" "$POLICY_SIGNATURE" "$SERVICE_CONFIG"; do echo "::add-mask::$VALUE"; done
          python3 - "$RUNTIME_METADATA" <<'PY'
          import json
          import sys
          metadata = json.load(open(sys.argv[1], encoding='utf-8'))
          for value in metadata.get('serviceConfig', {}).values():
              escaped = str(value).replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              if len(escaped) >= 8:
                  print(f'::add-mask::{escaped}')
          PY
          ACTUAL_SIZE=$(wc -c < "$RUNTIME_ARCHIVE" | tr -d ' ')
          ACTUAL_SHA256=$(sha256sum "$RUNTIME_ARCHIVE" | awk '{print $1}')
          if [ "$ACTUAL_SIZE" != "$EXPECTED_SIZE" ] || [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
            echo "::error title=运行程序校验失败::下载内容的大小或 SHA-256 不匹配。"
            exit 1
          fi
          if tar -tzf "$RUNTIME_ARCHIVE" | grep -Eq '(^/|(^|/)\.\.(/|$))'; then
            echo "::error title=运行程序校验失败::运行程序包含不安全路径。"
            exit 1
          fi
          tar -xzf "$RUNTIME_ARCHIVE"
          test -f runner/requirements.txt
          test -d runner/notionhub_runner
          {
            echo "NOTIONHUB_RUN_ACCESS_TOKEN=$ACCESS_TOKEN"
            echo "NOTIONHUB_REPORT_TOKEN=$REPORT_TOKEN"
            echo "NOTIONHUB_POLICY_ID=$POLICY_ID"
            echo "SYNC_RUN_ID=$POLICY_ID"
            echo "SYNC_PLAN=$PLAN"
            echo "ENTITLEMENT_PLAN=$PLAN"
            echo "SYNC_POLICY_JSON=$POLICY_JSON"
            echo "SYNC_POLICY_SIGNATURE=$POLICY_SIGNATURE"
            echo "SYNC_POLICY_SIGNING_KEY=$ACCESS_TOKEN"
            echo "NOTIONHUB_TARGET_RESULTS_PATH=$GITHUB_WORKSPACE/notionhub-target-results.json"
            echo 'DOUBAN_CONFIG<<NOTIONHUB_CONFIG_EOF'
            echo "$SERVICE_CONFIG"
            echo 'NOTIONHUB_CONFIG_EOF'
          } >> "$GITHUB_ENV"
          echo "plan=$PLAN" >> "$GITHUB_OUTPUT"

      - name: 配置 Python 环境
        if: steps.job_config.outputs.enabled == 'true' && steps.authorize.outcome == 'success'
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 安装运行依赖
        id: install
        if: steps.job_config.outputs.enabled == 'true' && steps.authorize.outcome == 'success'
        run: |
          python -m pip install --quiet --disable-pip-version-check --upgrade pip
          if [ -f runner/requirements.txt ]; then pip install --quiet --disable-pip-version-check -r runner/requirements.txt; fi
          SERVICE_REQUIREMENTS=$(cd runner && python -m notionhub_runner requirements douban)
          if [ -f "$SERVICE_REQUIREMENTS" ]; then pip install --quiet --disable-pip-version-check -r "$SERVICE_REQUIREMENTS"; fi


      - name: 同步播客
        id: sync
        if: steps.job_config.outputs.enabled == 'true' && steps.install.outcome == 'success'
        continue-on-error: true
        env:
          PYTHONUNBUFFERED: '1'
          TZ: Asia/Shanghai
          RAW_ACTION_PAYLOAD: ${{ github.event.inputs.payload || '{}' }}
          INPUT_SYNC_MODE: ${{ github.event.inputs.sync_mode || '' }}
          SUPPORTS_FULL_SYNC: 'true'
          NOTIONHUB_DEFER_FILES: 'true'
        run: |
          REQUESTED_SYNC_MODE=$(jq -nr --arg raw "$RAW_ACTION_PAYLOAD" --arg input "$INPUT_SYNC_MODE" '($raw | fromjson? // {}) as $payload | ($payload.requestedSyncMode // $payload.syncMode // $payload.sync_mode // "") as $payload_mode | (if $payload_mode == "full" or $payload_mode == "incremental" then $payload_mode elif $input == "full" or $input == "incremental" then $input else "incremental" end)')
          CONFIG_INITIAL_FULL_SYNC_REQUIRED=$(printf '%s' "$DOUBAN_CONFIG" | jq -r '(.DOUBAN_INITIAL_FULL_SYNC_REQUIRED // false) | tostring' 2>/dev/null || echo "false")
          PAYLOAD_INITIAL_FULL_SYNC_REQUIRED=$(jq -nr --arg raw "$RAW_ACTION_PAYLOAD" '($raw | fromjson? // {}) | (.initialFullSyncForced // false) | tostring')
          if [ "$CONFIG_INITIAL_FULL_SYNC_REQUIRED" = "true" ] || [ "$PAYLOAD_INITIAL_FULL_SYNC_REQUIRED" = "true" ]; then
            EFFECTIVE_SYNC_MODE=full
            INITIAL_FULL_SYNC_FORCED=true
          else
            EFFECTIVE_SYNC_MODE="$REQUESTED_SYNC_MODE"
            INITIAL_FULL_SYNC_FORCED=false
          fi
          ACTION_PAYLOAD=$(jq -cn --arg raw "$RAW_ACTION_PAYLOAD" --arg requested "$REQUESTED_SYNC_MODE" --arg effective "$EFFECTIVE_SYNC_MODE" --arg forced "$INITIAL_FULL_SYNC_FORCED" '($raw | fromjson? // {}) | del(.repair_after_sync, .run_safe_repair_after_sync) + {requestedSyncMode:$requested,syncMode:$effective,sync_mode:$effective,effectiveSyncMode:$effective,initialFullSyncForced:($forced == "true"),repair:false,runSafeRepairAfterSync:false}')
          {
            echo "NOTIONHUB_ACTION_PAYLOAD=$ACTION_PAYLOAD"
            echo "NOTIONHUB_REQUESTED_SYNC_MODE=$REQUESTED_SYNC_MODE"
            echo "NOTIONHUB_EFFECTIVE_SYNC_MODE=$EFFECTIVE_SYNC_MODE"
            echo "NOTIONHUB_INITIAL_FULL_SYNC_FORCED=$INITIAL_FULL_SYNC_FORCED"
          } >> "$GITHUB_ENV"
          export NOTIONHUB_ACTION_PAYLOAD="$ACTION_PAYLOAD"
          export NOTIONHUB_REQUESTED_SYNC_MODE="$REQUESTED_SYNC_MODE"
          export NOTIONHUB_EFFECTIVE_SYNC_MODE="$EFFECTIVE_SYNC_MODE"
          export NOTIONHUB_INITIAL_FULL_SYNC_FORCED="$INITIAL_FULL_SYNC_FORCED"
          if [ "$SYNC_PLAN" = "trial" ] && [ "$EFFECTIVE_SYNC_MODE" = "full" ]; then
            echo "::error title=免费体验不支持全量更新::请激活后再执行全量更新。"
            exit 1
          fi
          if [ "$EFFECTIVE_SYNC_MODE" = "full" ] && [ "$SUPPORTS_FULL_SYNC" != "true" ]; then
            echo "::error title=全量更新不可用::豆瓣 暂不支持全量更新，请改用普通同步。"
            exit 1
          fi
          cd runner
          python -m notionhub_runner sync douban --job podcast

      - name: 记录同步播客结果
        if: always() && needs.movie.outputs.enabled == 'true' && needs.game.result == 'success'
        run: |
          if [ "${{ steps.restore.outcome }}" != "success" ] || [ "${{ steps.job_config.outcome }}" != "success" ]; then
            if [ "false" = "true" ]; then STATUS=warning; else STATUS=failure; fi
          elif [ "${{ steps.job_config.outputs.enabled }}" != "true" ]; then
            STATUS=skipped
          elif [ "${{ steps.sync.outcome }}" = "success" ]; then
            STATUS=success
          elif [ "false" = "true" ]; then
            STATUS=warning
            echo "::warning title=同步播客未完成::主同步结果不受影响，可稍后重试此辅助阶段。"
          else
            STATUS=failure
          fi
          if [ ! -f "$SYNC_POLICY_STATE_PATH" ]; then printf '{}' > "$SYNC_POLICY_STATE_PATH"; fi
          jq -cn             --arg jobKey "podcast"             --arg stageLabel "同步播客"             --arg status "$STATUS"             --arg failureClass "${NOTIONHUB_FAILURE_CLASS:-}"             --argjson stageIndex 5             --argjson required true             '{stageIndex:$stageIndex,jobKey:$jobKey,label:$stageLabel,status:$status,required:$required,failureClass:(if ($failureClass | length) > 0 then $failureClass else null end)}'             > "${{ github.workspace }}/notionhub-stage-05.json"

      - name: 保存同步播客进度
        if: always() && needs.movie.outputs.enabled == 'true' && needs.game.result == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: notionhub-douban-05-podcast-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.SYNC_POLICY_STATE_PATH }}
            ${{ env.SYNC_POLICY_CONTINUATION_PATH }}
            ${{ env.NOTIONHUB_RUN_META_PATH }}
            ${{ env.NOTIONHUB_TARGET_RESULTS_PATH }}
            ${{ github.workspace }}/notionhub-stage-05.json
          if-no-files-found: error
          retention-days: 1

      - name: 确认同步播客成功
        if: always() && needs.movie.outputs.enabled == 'true' && needs.game.result == 'success' && steps.job_config.outputs.enabled == 'true'
        run: |
          if [ "${{ steps.sync.outcome }}" != "success" ]; then exit 1; fi


  podcast_transcription:
    name: 播客语音转文字
    needs: [movie, podcast]
    if: needs.movie.outputs.enabled == 'true' && needs.podcast.result == 'success'
    runs-on: ubuntu-latest
    env:
      DOUBAN_CONFIG: ${{ secrets.DOUBAN_CONFIG }}
      NOTIONHUB_API_BASE: https://i.notionhub.app/v1
      NOTIONHUB_SERVICE: douban
      NOTIONHUB_CONFIG_VERSION: '51'
      SYNC_POLICY_STATE_PATH: ${{ github.workspace }}/notionhub-state.json
      SYNC_POLICY_CONTINUATION_PATH: ${{ github.workspace }}/notionhub-continuation-id
      SYNC_POLICY_REPORT_PATH: ${{ github.workspace }}/notionhub-service-report.json
      NOTIONHUB_RUN_META_PATH: ${{ github.workspace }}/notionhub-run-meta.json
    steps:
      - name: 恢复上一阶段进度
        id: restore
        if: needs.movie.outputs.enabled == 'true' && needs.podcast.result == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ARTIFACT_SPECS=(
            "required|notionhub-douban-05-podcast-${{ github.run_id }}-${{ github.run_attempt }}|notionhub-state.json|notionhub-continuation-id|notionhub-run-meta.json|notionhub-stage-05.json"
          )
          ATTEMPT_DIR=""
          cleanup_artifact_attempt() {
            if [ -n "$ATTEMPT_DIR" ] && [ -d "$ATTEMPT_DIR" ]; then
              rm -rf -- "$ATTEMPT_DIR"
            fi
          }
          trap cleanup_artifact_attempt EXIT

          for ATTEMPT in 1 2 3 4 5 6; do
            cleanup_artifact_attempt
            ATTEMPT_DIR=$(mktemp -d "$RUNNER_TEMP/notionhub-artifacts.XXXXXX")
            DOWNLOAD_OK=true
            for SPEC in "${ARTIFACT_SPECS[@]}"; do
              SPEC_REQUIRED="${SPEC%%|*}"
              SPEC_CONTENT="${SPEC#*|}"
              ARTIFACT_NAME="${SPEC_CONTENT%%|*}"
              EXPECTED_FILES="${SPEC_CONTENT#*|}"
              ARTIFACT_OK=true
              ARTIFACT_DIR=""
              RESOLVED_ARTIFACT_NAME=""
              ARTIFACT_BASE_NAME="${ARTIFACT_NAME%-*}"
              CURRENT_RUN_ATTEMPT="${GITHUB_RUN_ATTEMPT:-1}"
              for ((CANDIDATE_ATTEMPT=CURRENT_RUN_ATTEMPT; CANDIDATE_ATTEMPT>=1; CANDIDATE_ATTEMPT--)); do
                CANDIDATE_ARTIFACT_NAME="$ARTIFACT_BASE_NAME-$CANDIDATE_ATTEMPT"
                CANDIDATE_ARTIFACT_DIR="$ATTEMPT_DIR/$CANDIDATE_ARTIFACT_NAME"
                mkdir -p "$CANDIDATE_ARTIFACT_DIR"
                if gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$CANDIDATE_ARTIFACT_NAME" --dir "$CANDIDATE_ARTIFACT_DIR"; then
                  RESOLVED_ARTIFACT_NAME="$CANDIDATE_ARTIFACT_NAME"
                  ARTIFACT_DIR="$CANDIDATE_ARTIFACT_DIR"
                  if [ "$CANDIDATE_ATTEMPT" -lt "$CURRENT_RUN_ATTEMPT" ]; then
                    echo "::notice title=已恢复前次运行进度::当前重试沿用第 ${CANDIDATE_ATTEMPT} 次尝试的阶段结果。"
                  fi
                  break
                fi
                rm -rf -- "$CANDIDATE_ARTIFACT_DIR"
              done
              if [ -z "$RESOLVED_ARTIFACT_NAME" ]; then
                ARTIFACT_OK=false
              else
                IFS='|' read -r -a EXPECTED_FILE_LIST <<< "$EXPECTED_FILES"
                for EXPECTED_FILE in "${EXPECTED_FILE_LIST[@]}"; do
                  if [ ! -f "$ARTIFACT_DIR/$EXPECTED_FILE" ]; then
                    ARTIFACT_OK=false
                    break
                  fi
                done
              fi
              if [ "$ARTIFACT_OK" != "true" ]; then
                if [ -n "$ARTIFACT_DIR" ]; then
                  rm -rf -- "$ARTIFACT_DIR"
                fi
                if [ "$SPEC_REQUIRED" = "required" ]; then
                  echo "::warning title=同步进度暂不可用::必要阶段结果尚未完整可见，将自动重试。"
                  DOWNLOAD_OK=false
                  break
                fi
                echo "::notice title=辅助阶段结果暂不可用::本次汇总将忽略尚未可见的辅助阶段结果。"
              fi
            done
            if [ "$DOWNLOAD_OK" = "true" ]; then
              cp -R "$ATTEMPT_DIR"/*/. "${{ github.workspace }}"/
              cleanup_artifact_attempt
              ATTEMPT_DIR=""
              exit 0
            fi
            if [ "$ATTEMPT" -lt 6 ]; then
              case "$ATTEMPT" in
                1) DELAY=2 ;;
                2) DELAY=4 ;;
                3) DELAY=8 ;;
                4) DELAY=16 ;;
                *) DELAY=30 ;;
              esac
              echo "::notice title=等待同步进度::GitHub 阶段结果暂不可见，${DELAY} 秒后进行第 $((ATTEMPT + 1)) 次尝试。"
              sleep "$DELAY"
            fi
          done

          echo "::error title=同步进度恢复失败::GitHub 阶段结果在 6 次尝试后仍不可用。"
          exit 1

      - name: 检查播客语音转文字配置
        id: job_config
        if: needs.movie.outputs.enabled == 'true' && needs.podcast.result == 'success' && steps.restore.outcome == 'success'
        continue-on-error: true
        run: |
          SERVICE_CONFIG="$DOUBAN_CONFIG"
          PLAN=$(printf '%s' "$SERVICE_CONFIG" | jq -r '.DOUBAN_SYNC_PLAN // "lifetime"')
          JOB_ENABLED=true
          SKIP_REASON=""
          SERVICE_OPTIONS=$(printf '%s' "$SERVICE_CONFIG" | jq -c '.DOUBAN_SERVICE_OPTIONS // {}')
          if ! printf '%s' "$SERVICE_OPTIONS" | jq -e --arg key "podcast" '(if type == "string" then (try fromjson catch {}) elif type == "object" then . else {} end) | (.enabledStreams // []) as $enabled | ($enabled | length == 0) or ($enabled | index($key) != null)' >/dev/null; then
            JOB_ENABLED=false
            SKIP_REASON="未在同步内容中启用"
          fi
          echo "enabled=$JOB_ENABLED" >> "$GITHUB_OUTPUT"
          echo "plan=$PLAN" >> "$GITHUB_OUTPUT"
          if [ "$JOB_ENABLED" != "true" ]; then
            echo "::notice title=播客语音转文字已跳过::$SKIP_REASON"
          fi

      - name: 验证权限并获取运行程序
        id: authorize
        continue-on-error: true
        if: steps.job_config.outputs.enabled == 'true'
        run: |
          OIDC_TOKEN=$(curl -fsSL -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https%3A%2F%2Fi.notionhub.app" | jq -r '.value // empty')
          if [ -z "$OIDC_TOKEN" ]; then
            echo "::error title=GitHub 身份验证失败::未能获取本次运行的 OIDC token。"
            exit 1
          fi
          echo "::add-mask::$OIDC_TOKEN"
          CONTINUATION_ID="$(cat "$SYNC_POLICY_CONTINUATION_PATH")"
          if [ -z "$CONTINUATION_ID" ]; then
            echo "::error title=运行授权续接失败::同步进度中缺少续接标识。"
            exit 1
          fi
          RUNTIME_PAYLOAD=$(jq -cn --arg service "douban" --arg continuation "$CONTINUATION_ID" '{service:$service,purpose:"sync",continuationPolicyId:$continuation}')
          RUNTIME_RESPONSE="$RUNNER_TEMP/notionhub-runtime-bundle.bin"
          RUNTIME_METADATA="$RUNNER_TEMP/notionhub-runtime-metadata.json"
          RUNTIME_ARCHIVE="$RUNNER_TEMP/notionhub-runner.tar.gz"
          cleanup_runtime_files() { rm -f "$RUNTIME_RESPONSE" "$RUNTIME_METADATA" "$RUNTIME_ARCHIVE"; }
          trap cleanup_runtime_files EXIT
          HTTP_STATUS=$(curl -sS -o "$RUNTIME_RESPONSE" -w '%{http_code}' -X POST "$NOTIONHUB_API_BASE/github/runner/runtime-bundle"             -H "Authorization: Bearer $OIDC_TOKEN" -H 'Content-Type: application/json' --data "$RUNTIME_PAYLOAD")
          if [ "$HTTP_STATUS" = "418" ]; then
            echo "免费体验次数已用完，请购买激活码。"
            echo "获取激活码：https://www.notionhub.app/docs/get-activation-code.html"
            {
              echo "## 免费体验次数已用完"
              echo ""
              echo "请购买激活码并在 NotionHub 插件中完成激活后重新同步。"
              echo ""
              echo "[查看如何获取激活码](https://www.notionhub.app/docs/get-activation-code.html)"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=免费体验次数已用完::免费体验次数已用完，请购买激活码并在 NotionHub 插件中完成激活后重新同步。%0A%0A获取激活码：https://www.notionhub.app/docs/get-activation-code.html"
            exit 1
          fi
          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            MESSAGE=$(jq -r '.message // "运行准备失败"' "$RUNTIME_RESPONSE" 2>/dev/null || echo "运行准备失败")
            echo "::error title=运行准备失败::$MESSAGE"
            exit 1
          fi
          chmod 600 "$RUNTIME_RESPONSE"
          python3 - "$RUNTIME_RESPONSE" "$RUNTIME_METADATA" "$RUNTIME_ARCHIVE" "douban" <<'PY'
          import json
          import os
          import re
          import sys

          source, metadata_path, archive_path, expected_service = sys.argv[1:]
          raw = open(source, 'rb').read()
          magic = b'NHRB1\n'
          if not raw.startswith(magic) or len(raw) < len(magic) + 8:
              raise SystemExit('运行程序响应格式无效。')
          length_bytes = raw[len(magic):len(magic) + 8]
          if not re.fullmatch(rb'[0-9a-fA-F]{8}', length_bytes):
              raise SystemExit('运行配置长度无效。')
          metadata_length = int(length_bytes, 16)
          if metadata_length <= 0 or metadata_length > 1024 * 1024:
              raise SystemExit('运行配置超过大小限制。')
          metadata_start = len(magic) + 8
          metadata_end = metadata_start + metadata_length
          if metadata_end >= len(raw):
              raise SystemExit('运行程序响应不完整。')
          try:
              metadata = json.loads(raw[metadata_start:metadata_end].decode('utf-8'))
          except Exception:
              raise SystemExit('运行配置格式无效。')
          archive = raw[metadata_end:]
          if metadata.get('schemaVersion') != 1:
              raise SystemExit('运行配置版本不受支持。')
          if metadata.get('context', {}).get('service') != expected_service:
              raise SystemExit('运行配置与当前服务不匹配。')
          expected_size = metadata.get('bundle', {}).get('size')
          if not isinstance(expected_size, int) or expected_size != len(archive) or not archive or len(archive) > 64 * 1024 * 1024:
              raise SystemExit('运行程序大小校验失败。')
          for path, data in ((metadata_path, json.dumps(metadata, ensure_ascii=False, separators=(',', ':')).encode()), (archive_path, archive)):
              with open(path, 'wb') as handle:
                  handle.write(data)
              os.chmod(path, 0o600)
          PY
          ACCESS_TOKEN=$(jq -r '.accessToken // empty' "$RUNTIME_METADATA")
          REPORT_TOKEN=$(jq -r '.reportToken // empty' "$RUNTIME_METADATA")
          POLICY_ID=$(jq -r '.context.id // empty' "$RUNTIME_METADATA")
          PLAN=$(jq -r '.context.plan // empty' "$RUNTIME_METADATA")
          POLICY_JSON=$(jq -c '.policy // {}' "$RUNTIME_METADATA")
          POLICY_SIGNATURE=$(jq -r '.policySignature // empty' "$RUNTIME_METADATA")
          SERVICE_CONFIG=$(jq -c '.serviceConfig // empty' "$RUNTIME_METADATA")
          EXPECTED_SIZE=$(jq -r '.bundle.size // empty' "$RUNTIME_METADATA")
          EXPECTED_SHA256=$(jq -r '.bundle.sha256 // empty' "$RUNTIME_METADATA")
          if [ -z "$ACCESS_TOKEN" ] || [ -z "$REPORT_TOKEN" ] || [ -z "$POLICY_ID" ] || [ -z "$PLAN" ] || [ -z "$POLICY_SIGNATURE" ] || [ -z "$SERVICE_CONFIG" ] || [ -z "$EXPECTED_SIZE" ] || [ -z "$EXPECTED_SHA256" ]; then
            echo "::error title=运行准备失败::运行配置缺少必要字段。"
            exit 1
          fi
          for VALUE in "$ACCESS_TOKEN" "$REPORT_TOKEN" "$POLICY_SIGNATURE" "$SERVICE_CONFIG"; do echo "::add-mask::$VALUE"; done
          python3 - "$RUNTIME_METADATA" <<'PY'
          import json
          import sys
          metadata = json.load(open(sys.argv[1], encoding='utf-8'))
          for value in metadata.get('serviceConfig', {}).values():
              escaped = str(value).replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              if len(escaped) >= 8:
                  print(f'::add-mask::{escaped}')
          PY
          ACTUAL_SIZE=$(wc -c < "$RUNTIME_ARCHIVE" | tr -d ' ')
          ACTUAL_SHA256=$(sha256sum "$RUNTIME_ARCHIVE" | awk '{print $1}')
          if [ "$ACTUAL_SIZE" != "$EXPECTED_SIZE" ] || [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
            echo "::error title=运行程序校验失败::下载内容的大小或 SHA-256 不匹配。"
            exit 1
          fi
          if tar -tzf "$RUNTIME_ARCHIVE" | grep -Eq '(^/|(^|/)\.\.(/|$))'; then
            echo "::error title=运行程序校验失败::运行程序包含不安全路径。"
            exit 1
          fi
          tar -xzf "$RUNTIME_ARCHIVE"
          test -f runner/requirements.txt
          test -d runner/notionhub_runner
          {
            echo "NOTIONHUB_RUN_ACCESS_TOKEN=$ACCESS_TOKEN"
            echo "NOTIONHUB_REPORT_TOKEN=$REPORT_TOKEN"
            echo "NOTIONHUB_POLICY_ID=$POLICY_ID"
            echo "SYNC_RUN_ID=$POLICY_ID"
            echo "SYNC_PLAN=$PLAN"
            echo "ENTITLEMENT_PLAN=$PLAN"
            echo "SYNC_POLICY_JSON=$POLICY_JSON"
            echo "SYNC_POLICY_SIGNATURE=$POLICY_SIGNATURE"
            echo "SYNC_POLICY_SIGNING_KEY=$ACCESS_TOKEN"
            echo "NOTIONHUB_TARGET_RESULTS_PATH=$GITHUB_WORKSPACE/notionhub-target-results.json"
            echo 'DOUBAN_CONFIG<<NOTIONHUB_CONFIG_EOF'
            echo "$SERVICE_CONFIG"
            echo 'NOTIONHUB_CONFIG_EOF'
          } >> "$GITHUB_ENV"
          echo "plan=$PLAN" >> "$GITHUB_OUTPUT"

      - name: 配置 Python 环境
        if: steps.job_config.outputs.enabled == 'true' && steps.authorize.outcome == 'success'
        continue-on-error: true
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 安装运行依赖
        id: install
        if: steps.job_config.outputs.enabled == 'true' && steps.authorize.outcome == 'success'
        continue-on-error: true
        run: |
          python -m pip install --quiet --disable-pip-version-check --upgrade pip
          if [ -f runner/requirements.txt ]; then pip install --quiet --disable-pip-version-check -r runner/requirements.txt; fi
          SERVICE_REQUIREMENTS=$(cd runner && python -m notionhub_runner requirements douban)
          if [ -f "$SERVICE_REQUIREMENTS" ]; then pip install --quiet --disable-pip-version-check -r "$SERVICE_REQUIREMENTS"; fi


      - name: 播客语音转文字
        id: sync
        if: steps.job_config.outputs.enabled == 'true' && steps.install.outcome == 'success'
        continue-on-error: true
        env:
          PYTHONUNBUFFERED: '1'
          TZ: Asia/Shanghai
          RAW_ACTION_PAYLOAD: ${{ github.event.inputs.payload || '{}' }}
          INPUT_SYNC_MODE: ${{ github.event.inputs.sync_mode || '' }}
          SUPPORTS_FULL_SYNC: 'true'
          NOTIONHUB_DEFER_FILES: 'true'
        run: |
          REQUESTED_SYNC_MODE=$(jq -nr --arg raw "$RAW_ACTION_PAYLOAD" --arg input "$INPUT_SYNC_MODE" '($raw | fromjson? // {}) as $payload | ($payload.requestedSyncMode // $payload.syncMode // $payload.sync_mode // "") as $payload_mode | (if $payload_mode == "full" or $payload_mode == "incremental" then $payload_mode elif $input == "full" or $input == "incremental" then $input else "incremental" end)')
          CONFIG_INITIAL_FULL_SYNC_REQUIRED=$(printf '%s' "$DOUBAN_CONFIG" | jq -r '(.DOUBAN_INITIAL_FULL_SYNC_REQUIRED // false) | tostring' 2>/dev/null || echo "false")
          PAYLOAD_INITIAL_FULL_SYNC_REQUIRED=$(jq -nr --arg raw "$RAW_ACTION_PAYLOAD" '($raw | fromjson? // {}) | (.initialFullSyncForced // false) | tostring')
          if [ "$CONFIG_INITIAL_FULL_SYNC_REQUIRED" = "true" ] || [ "$PAYLOAD_INITIAL_FULL_SYNC_REQUIRED" = "true" ]; then
            EFFECTIVE_SYNC_MODE=full
            INITIAL_FULL_SYNC_FORCED=true
          else
            EFFECTIVE_SYNC_MODE="$REQUESTED_SYNC_MODE"
            INITIAL_FULL_SYNC_FORCED=false
          fi
          ACTION_PAYLOAD=$(jq -cn --arg raw "$RAW_ACTION_PAYLOAD" --arg requested "$REQUESTED_SYNC_MODE" --arg effective "$EFFECTIVE_SYNC_MODE" --arg forced "$INITIAL_FULL_SYNC_FORCED" '($raw | fromjson? // {}) | del(.repair_after_sync, .run_safe_repair_after_sync) + {requestedSyncMode:$requested,syncMode:$effective,sync_mode:$effective,effectiveSyncMode:$effective,initialFullSyncForced:($forced == "true"),repair:false,runSafeRepairAfterSync:false}')
          {
            echo "NOTIONHUB_ACTION_PAYLOAD=$ACTION_PAYLOAD"
            echo "NOTIONHUB_REQUESTED_SYNC_MODE=$REQUESTED_SYNC_MODE"
            echo "NOTIONHUB_EFFECTIVE_SYNC_MODE=$EFFECTIVE_SYNC_MODE"
            echo "NOTIONHUB_INITIAL_FULL_SYNC_FORCED=$INITIAL_FULL_SYNC_FORCED"
          } >> "$GITHUB_ENV"
          export NOTIONHUB_ACTION_PAYLOAD="$ACTION_PAYLOAD"
          export NOTIONHUB_REQUESTED_SYNC_MODE="$REQUESTED_SYNC_MODE"
          export NOTIONHUB_EFFECTIVE_SYNC_MODE="$EFFECTIVE_SYNC_MODE"
          export NOTIONHUB_INITIAL_FULL_SYNC_FORCED="$INITIAL_FULL_SYNC_FORCED"
          if [ "$SYNC_PLAN" = "trial" ] && [ "$EFFECTIVE_SYNC_MODE" = "full" ]; then
            echo "::error title=免费体验不支持全量更新::请激活后再执行全量更新。"
            exit 1
          fi
          if [ "$EFFECTIVE_SYNC_MODE" = "full" ] && [ "$SUPPORTS_FULL_SYNC" != "true" ]; then
            echo "::error title=全量更新不可用::豆瓣 暂不支持全量更新，请改用普通同步。"
            exit 1
          fi
          cd runner
          python -m notionhub_runner sync douban --job podcast_transcription

      - name: 记录播客语音转文字结果
        if: always() && needs.movie.outputs.enabled == 'true' && needs.podcast.result == 'success'
        continue-on-error: true
        run: |
          if [ "${{ steps.restore.outcome }}" != "success" ] || [ "${{ steps.job_config.outcome }}" != "success" ]; then
            if [ "true" = "true" ]; then STATUS=warning; else STATUS=failure; fi
          elif [ "${{ steps.job_config.outputs.enabled }}" != "true" ]; then
            STATUS=skipped
          elif [ "${{ steps.sync.outcome }}" = "success" ]; then
            STATUS=success
          elif [ "true" = "true" ]; then
            STATUS=warning
            echo "::warning title=播客语音转文字未完成::主同步结果不受影响，可稍后重试此辅助阶段。"
          else
            STATUS=failure
          fi
          if [ ! -f "$SYNC_POLICY_STATE_PATH" ]; then printf '{}' > "$SYNC_POLICY_STATE_PATH"; fi
          jq -cn             --arg jobKey "podcast_transcription"             --arg stageLabel "播客语音转文字"             --arg status "$STATUS"             --arg failureClass "${NOTIONHUB_FAILURE_CLASS:-}"             --argjson stageIndex 6             --argjson required false             '{stageIndex:$stageIndex,jobKey:$jobKey,label:$stageLabel,status:$status,required:$required,failureClass:(if ($failureClass | length) > 0 then $failureClass else null end)}'             > "${{ github.workspace }}/notionhub-stage-06.json"

      - name: 保存播客语音转文字进度
        if: always() && needs.movie.outputs.enabled == 'true' && needs.podcast.result == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: notionhub-douban-06-podcast_transcription-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.SYNC_POLICY_STATE_PATH }}
            ${{ env.SYNC_POLICY_CONTINUATION_PATH }}
            ${{ env.NOTIONHUB_RUN_META_PATH }}
            ${{ env.NOTIONHUB_TARGET_RESULTS_PATH }}
            ${{ github.workspace }}/notionhub-stage-06.json
          if-no-files-found: error
          retention-days: 1


  drama:
    name: 同步舞台剧
    needs: [movie, podcast_transcription]
    if: always()
    runs-on: ubuntu-latest
    env:
      DOUBAN_CONFIG: ${{ secrets.DOUBAN_CONFIG }}
      NOTIONHUB_API_BASE: https://i.notionhub.app/v1
      NOTIONHUB_SERVICE: douban
      NOTIONHUB_CONFIG_VERSION: '51'
      SYNC_POLICY_STATE_PATH: ${{ github.workspace }}/notionhub-state.json
      SYNC_POLICY_CONTINUATION_PATH: ${{ github.workspace }}/notionhub-continuation-id
      SYNC_POLICY_REPORT_PATH: ${{ github.workspace }}/notionhub-service-report.json
      NOTIONHUB_RUN_META_PATH: ${{ github.workspace }}/notionhub-run-meta.json
    steps:
      - name: 恢复上一阶段进度
        id: restore
        if: needs.movie.outputs.enabled == 'true' && needs.podcast_transcription.result == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ARTIFACT_SPECS=(
            "required|notionhub-douban-06-podcast_transcription-${{ github.run_id }}-${{ github.run_attempt }}|notionhub-state.json|notionhub-continuation-id|notionhub-run-meta.json|notionhub-stage-06.json"
          )
          ATTEMPT_DIR=""
          cleanup_artifact_attempt() {
            if [ -n "$ATTEMPT_DIR" ] && [ -d "$ATTEMPT_DIR" ]; then
              rm -rf -- "$ATTEMPT_DIR"
            fi
          }
          trap cleanup_artifact_attempt EXIT

          for ATTEMPT in 1 2 3 4 5 6; do
            cleanup_artifact_attempt
            ATTEMPT_DIR=$(mktemp -d "$RUNNER_TEMP/notionhub-artifacts.XXXXXX")
            DOWNLOAD_OK=true
            for SPEC in "${ARTIFACT_SPECS[@]}"; do
              SPEC_REQUIRED="${SPEC%%|*}"
              SPEC_CONTENT="${SPEC#*|}"
              ARTIFACT_NAME="${SPEC_CONTENT%%|*}"
              EXPECTED_FILES="${SPEC_CONTENT#*|}"
              ARTIFACT_OK=true
              ARTIFACT_DIR=""
              RESOLVED_ARTIFACT_NAME=""
              ARTIFACT_BASE_NAME="${ARTIFACT_NAME%-*}"
              CURRENT_RUN_ATTEMPT="${GITHUB_RUN_ATTEMPT:-1}"
              for ((CANDIDATE_ATTEMPT=CURRENT_RUN_ATTEMPT; CANDIDATE_ATTEMPT>=1; CANDIDATE_ATTEMPT--)); do
                CANDIDATE_ARTIFACT_NAME="$ARTIFACT_BASE_NAME-$CANDIDATE_ATTEMPT"
                CANDIDATE_ARTIFACT_DIR="$ATTEMPT_DIR/$CANDIDATE_ARTIFACT_NAME"
                mkdir -p "$CANDIDATE_ARTIFACT_DIR"
                if gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$CANDIDATE_ARTIFACT_NAME" --dir "$CANDIDATE_ARTIFACT_DIR"; then
                  RESOLVED_ARTIFACT_NAME="$CANDIDATE_ARTIFACT_NAME"
                  ARTIFACT_DIR="$CANDIDATE_ARTIFACT_DIR"
                  if [ "$CANDIDATE_ATTEMPT" -lt "$CURRENT_RUN_ATTEMPT" ]; then
                    echo "::notice title=已恢复前次运行进度::当前重试沿用第 ${CANDIDATE_ATTEMPT} 次尝试的阶段结果。"
                  fi
                  break
                fi
                rm -rf -- "$CANDIDATE_ARTIFACT_DIR"
              done
              if [ -z "$RESOLVED_ARTIFACT_NAME" ]; then
                ARTIFACT_OK=false
              else
                IFS='|' read -r -a EXPECTED_FILE_LIST <<< "$EXPECTED_FILES"
                for EXPECTED_FILE in "${EXPECTED_FILE_LIST[@]}"; do
                  if [ ! -f "$ARTIFACT_DIR/$EXPECTED_FILE" ]; then
                    ARTIFACT_OK=false
                    break
                  fi
                done
              fi
              if [ "$ARTIFACT_OK" != "true" ]; then
                if [ -n "$ARTIFACT_DIR" ]; then
                  rm -rf -- "$ARTIFACT_DIR"
                fi
                if [ "$SPEC_REQUIRED" = "required" ]; then
                  echo "::warning title=同步进度暂不可用::必要阶段结果尚未完整可见，将自动重试。"
                  DOWNLOAD_OK=false
                  break
                fi
                echo "::notice title=辅助阶段结果暂不可用::本次汇总将忽略尚未可见的辅助阶段结果。"
              fi
            done
            if [ "$DOWNLOAD_OK" = "true" ]; then
              cp -R "$ATTEMPT_DIR"/*/. "${{ github.workspace }}"/
              cleanup_artifact_attempt
              ATTEMPT_DIR=""
              exit 0
            fi
            if [ "$ATTEMPT" -lt 6 ]; then
              case "$ATTEMPT" in
                1) DELAY=2 ;;
                2) DELAY=4 ;;
                3) DELAY=8 ;;
                4) DELAY=16 ;;
                *) DELAY=30 ;;
              esac
              echo "::notice title=等待同步进度::GitHub 阶段结果暂不可见，${DELAY} 秒后进行第 $((ATTEMPT + 1)) 次尝试。"
              sleep "$DELAY"
            fi
          done

          echo "::error title=同步进度恢复失败::GitHub 阶段结果在 6 次尝试后仍不可用。"
          exit 1

      - name: 检查同步舞台剧配置
        id: job_config
        if: needs.movie.outputs.enabled == 'true' && needs.podcast_transcription.result == 'success' && steps.restore.outcome == 'success'
        run: |
          SERVICE_CONFIG="$DOUBAN_CONFIG"
          PLAN=$(printf '%s' "$SERVICE_CONFIG" | jq -r '.DOUBAN_SYNC_PLAN // "lifetime"')
          JOB_ENABLED=true
          SKIP_REASON=""
          SERVICE_OPTIONS=$(printf '%s' "$SERVICE_CONFIG" | jq -c '.DOUBAN_SERVICE_OPTIONS // {}')
          if ! printf '%s' "$SERVICE_OPTIONS" | jq -e --arg key "drama" '(if type == "string" then (try fromjson catch {}) elif type == "object" then . else {} end) | (.enabledStreams // []) as $enabled | ($enabled | length == 0) or ($enabled | index($key) != null)' >/dev/null; then
            JOB_ENABLED=false
            SKIP_REASON="未在同步内容中启用"
          fi
          echo "enabled=$JOB_ENABLED" >> "$GITHUB_OUTPUT"
          echo "plan=$PLAN" >> "$GITHUB_OUTPUT"
          if [ "$JOB_ENABLED" != "true" ]; then
            echo "::notice title=同步舞台剧已跳过::$SKIP_REASON"
          fi

      - name: 验证权限并获取运行程序
        id: stage_authorize
        if: steps.job_config.outputs.enabled == 'true'
        run: |
          OIDC_TOKEN=$(curl -fsSL -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https%3A%2F%2Fi.notionhub.app" | jq -r '.value // empty')
          if [ -z "$OIDC_TOKEN" ]; then
            echo "::error title=GitHub 身份验证失败::未能获取本次运行的 OIDC token。"
            exit 1
          fi
          echo "::add-mask::$OIDC_TOKEN"
          CONTINUATION_ID="$(cat "$SYNC_POLICY_CONTINUATION_PATH")"
          if [ -z "$CONTINUATION_ID" ]; then
            echo "::error title=运行授权续接失败::同步进度中缺少续接标识。"
            exit 1
          fi
          RUNTIME_PAYLOAD=$(jq -cn --arg service "douban" --arg continuation "$CONTINUATION_ID" '{service:$service,purpose:"sync",continuationPolicyId:$continuation}')
          RUNTIME_RESPONSE="$RUNNER_TEMP/notionhub-runtime-bundle.bin"
          RUNTIME_METADATA="$RUNNER_TEMP/notionhub-runtime-metadata.json"
          RUNTIME_ARCHIVE="$RUNNER_TEMP/notionhub-runner.tar.gz"
          cleanup_runtime_files() { rm -f "$RUNTIME_RESPONSE" "$RUNTIME_METADATA" "$RUNTIME_ARCHIVE"; }
          trap cleanup_runtime_files EXIT
          HTTP_STATUS=$(curl -sS -o "$RUNTIME_RESPONSE" -w '%{http_code}' -X POST "$NOTIONHUB_API_BASE/github/runner/runtime-bundle"             -H "Authorization: Bearer $OIDC_TOKEN" -H 'Content-Type: application/json' --data "$RUNTIME_PAYLOAD")
          if [ "$HTTP_STATUS" = "418" ]; then
            echo "免费体验次数已用完，请购买激活码。"
            echo "获取激活码：https://www.notionhub.app/docs/get-activation-code.html"
            {
              echo "## 免费体验次数已用完"
              echo ""
              echo "请购买激活码并在 NotionHub 插件中完成激活后重新同步。"
              echo ""
              echo "[查看如何获取激活码](https://www.notionhub.app/docs/get-activation-code.html)"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=免费体验次数已用完::免费体验次数已用完，请购买激活码并在 NotionHub 插件中完成激活后重新同步。%0A%0A获取激活码：https://www.notionhub.app/docs/get-activation-code.html"
            exit 1
          fi
          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            MESSAGE=$(jq -r '.message // "运行准备失败"' "$RUNTIME_RESPONSE" 2>/dev/null || echo "运行准备失败")
            echo "::error title=运行准备失败::$MESSAGE"
            exit 1
          fi
          chmod 600 "$RUNTIME_RESPONSE"
          python3 - "$RUNTIME_RESPONSE" "$RUNTIME_METADATA" "$RUNTIME_ARCHIVE" "douban" <<'PY'
          import json
          import os
          import re
          import sys

          source, metadata_path, archive_path, expected_service = sys.argv[1:]
          raw = open(source, 'rb').read()
          magic = b'NHRB1\n'
          if not raw.startswith(magic) or len(raw) < len(magic) + 8:
              raise SystemExit('运行程序响应格式无效。')
          length_bytes = raw[len(magic):len(magic) + 8]
          if not re.fullmatch(rb'[0-9a-fA-F]{8}', length_bytes):
              raise SystemExit('运行配置长度无效。')
          metadata_length = int(length_bytes, 16)
          if metadata_length <= 0 or metadata_length > 1024 * 1024:
              raise SystemExit('运行配置超过大小限制。')
          metadata_start = len(magic) + 8
          metadata_end = metadata_start + metadata_length
          if metadata_end >= len(raw):
              raise SystemExit('运行程序响应不完整。')
          try:
              metadata = json.loads(raw[metadata_start:metadata_end].decode('utf-8'))
          except Exception:
              raise SystemExit('运行配置格式无效。')
          archive = raw[metadata_end:]
          if metadata.get('schemaVersion') != 1:
              raise SystemExit('运行配置版本不受支持。')
          if metadata.get('context', {}).get('service') != expected_service:
              raise SystemExit('运行配置与当前服务不匹配。')
          expected_size = metadata.get('bundle', {}).get('size')
          if not isinstance(expected_size, int) or expected_size != len(archive) or not archive or len(archive) > 64 * 1024 * 1024:
              raise SystemExit('运行程序大小校验失败。')
          for path, data in ((metadata_path, json.dumps(metadata, ensure_ascii=False, separators=(',', ':')).encode()), (archive_path, archive)):
              with open(path, 'wb') as handle:
                  handle.write(data)
              os.chmod(path, 0o600)
          PY
          ACCESS_TOKEN=$(jq -r '.accessToken // empty' "$RUNTIME_METADATA")
          REPORT_TOKEN=$(jq -r '.reportToken // empty' "$RUNTIME_METADATA")
          POLICY_ID=$(jq -r '.context.id // empty' "$RUNTIME_METADATA")
          PLAN=$(jq -r '.context.plan // empty' "$RUNTIME_METADATA")
          POLICY_JSON=$(jq -c '.policy // {}' "$RUNTIME_METADATA")
          POLICY_SIGNATURE=$(jq -r '.policySignature // empty' "$RUNTIME_METADATA")
          SERVICE_CONFIG=$(jq -c '.serviceConfig // empty' "$RUNTIME_METADATA")
          EXPECTED_SIZE=$(jq -r '.bundle.size // empty' "$RUNTIME_METADATA")
          EXPECTED_SHA256=$(jq -r '.bundle.sha256 // empty' "$RUNTIME_METADATA")
          if [ -z "$ACCESS_TOKEN" ] || [ -z "$REPORT_TOKEN" ] || [ -z "$POLICY_ID" ] || [ -z "$PLAN" ] || [ -z "$POLICY_SIGNATURE" ] || [ -z "$SERVICE_CONFIG" ] || [ -z "$EXPECTED_SIZE" ] || [ -z "$EXPECTED_SHA256" ]; then
            echo "::error title=运行准备失败::运行配置缺少必要字段。"
            exit 1
          fi
          for VALUE in "$ACCESS_TOKEN" "$REPORT_TOKEN" "$POLICY_SIGNATURE" "$SERVICE_CONFIG"; do echo "::add-mask::$VALUE"; done
          python3 - "$RUNTIME_METADATA" <<'PY'
          import json
          import sys
          metadata = json.load(open(sys.argv[1], encoding='utf-8'))
          for value in metadata.get('serviceConfig', {}).values():
              escaped = str(value).replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              if len(escaped) >= 8:
                  print(f'::add-mask::{escaped}')
          PY
          ACTUAL_SIZE=$(wc -c < "$RUNTIME_ARCHIVE" | tr -d ' ')
          ACTUAL_SHA256=$(sha256sum "$RUNTIME_ARCHIVE" | awk '{print $1}')
          if [ "$ACTUAL_SIZE" != "$EXPECTED_SIZE" ] || [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
            echo "::error title=运行程序校验失败::下载内容的大小或 SHA-256 不匹配。"
            exit 1
          fi
          if tar -tzf "$RUNTIME_ARCHIVE" | grep -Eq '(^/|(^|/)\.\.(/|$))'; then
            echo "::error title=运行程序校验失败::运行程序包含不安全路径。"
            exit 1
          fi
          tar -xzf "$RUNTIME_ARCHIVE"
          test -f runner/requirements.txt
          test -d runner/notionhub_runner
          {
            echo "NOTIONHUB_RUN_ACCESS_TOKEN=$ACCESS_TOKEN"
            echo "NOTIONHUB_REPORT_TOKEN=$REPORT_TOKEN"
            echo "NOTIONHUB_POLICY_ID=$POLICY_ID"
            echo "SYNC_RUN_ID=$POLICY_ID"
            echo "SYNC_PLAN=$PLAN"
            echo "ENTITLEMENT_PLAN=$PLAN"
            echo "SYNC_POLICY_JSON=$POLICY_JSON"
            echo "SYNC_POLICY_SIGNATURE=$POLICY_SIGNATURE"
            echo "SYNC_POLICY_SIGNING_KEY=$ACCESS_TOKEN"
            echo "NOTIONHUB_TARGET_RESULTS_PATH=$GITHUB_WORKSPACE/notionhub-target-results.json"
            echo 'DOUBAN_CONFIG<<NOTIONHUB_CONFIG_EOF'
            echo "$SERVICE_CONFIG"
            echo 'NOTIONHUB_CONFIG_EOF'
          } >> "$GITHUB_ENV"
          echo "plan=$PLAN" >> "$GITHUB_OUTPUT"

      - name: 配置 Python 环境
        if: steps.job_config.outputs.enabled == 'true' && steps.stage_authorize.outcome == 'success'
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 安装运行依赖
        id: install
        if: steps.job_config.outputs.enabled == 'true' && steps.stage_authorize.outcome == 'success'
        run: |
          python -m pip install --quiet --disable-pip-version-check --upgrade pip
          if [ -f runner/requirements.txt ]; then pip install --quiet --disable-pip-version-check -r runner/requirements.txt; fi
          SERVICE_REQUIREMENTS=$(cd runner && python -m notionhub_runner requirements douban)
          if [ -f "$SERVICE_REQUIREMENTS" ]; then pip install --quiet --disable-pip-version-check -r "$SERVICE_REQUIREMENTS"; fi


      - name: 同步舞台剧
        id: sync
        if: steps.job_config.outputs.enabled == 'true' && steps.install.outcome == 'success'
        continue-on-error: true
        env:
          PYTHONUNBUFFERED: '1'
          TZ: Asia/Shanghai
          RAW_ACTION_PAYLOAD: ${{ github.event.inputs.payload || '{}' }}
          INPUT_SYNC_MODE: ${{ github.event.inputs.sync_mode || '' }}
          SUPPORTS_FULL_SYNC: 'true'
          NOTIONHUB_DEFER_FILES: 'true'
        run: |
          REQUESTED_SYNC_MODE=$(jq -nr --arg raw "$RAW_ACTION_PAYLOAD" --arg input "$INPUT_SYNC_MODE" '($raw | fromjson? // {}) as $payload | ($payload.requestedSyncMode // $payload.syncMode // $payload.sync_mode // "") as $payload_mode | (if $payload_mode == "full" or $payload_mode == "incremental" then $payload_mode elif $input == "full" or $input == "incremental" then $input else "incremental" end)')
          CONFIG_INITIAL_FULL_SYNC_REQUIRED=$(printf '%s' "$DOUBAN_CONFIG" | jq -r '(.DOUBAN_INITIAL_FULL_SYNC_REQUIRED // false) | tostring' 2>/dev/null || echo "false")
          PAYLOAD_INITIAL_FULL_SYNC_REQUIRED=$(jq -nr --arg raw "$RAW_ACTION_PAYLOAD" '($raw | fromjson? // {}) | (.initialFullSyncForced // false) | tostring')
          if [ "$CONFIG_INITIAL_FULL_SYNC_REQUIRED" = "true" ] || [ "$PAYLOAD_INITIAL_FULL_SYNC_REQUIRED" = "true" ]; then
            EFFECTIVE_SYNC_MODE=full
            INITIAL_FULL_SYNC_FORCED=true
          else
            EFFECTIVE_SYNC_MODE="$REQUESTED_SYNC_MODE"
            INITIAL_FULL_SYNC_FORCED=false
          fi
          ACTION_PAYLOAD=$(jq -cn --arg raw "$RAW_ACTION_PAYLOAD" --arg requested "$REQUESTED_SYNC_MODE" --arg effective "$EFFECTIVE_SYNC_MODE" --arg forced "$INITIAL_FULL_SYNC_FORCED" '($raw | fromjson? // {}) | del(.repair_after_sync, .run_safe_repair_after_sync) + {requestedSyncMode:$requested,syncMode:$effective,sync_mode:$effective,effectiveSyncMode:$effective,initialFullSyncForced:($forced == "true"),repair:false,runSafeRepairAfterSync:false}')
          {
            echo "NOTIONHUB_ACTION_PAYLOAD=$ACTION_PAYLOAD"
            echo "NOTIONHUB_REQUESTED_SYNC_MODE=$REQUESTED_SYNC_MODE"
            echo "NOTIONHUB_EFFECTIVE_SYNC_MODE=$EFFECTIVE_SYNC_MODE"
            echo "NOTIONHUB_INITIAL_FULL_SYNC_FORCED=$INITIAL_FULL_SYNC_FORCED"
          } >> "$GITHUB_ENV"
          export NOTIONHUB_ACTION_PAYLOAD="$ACTION_PAYLOAD"
          export NOTIONHUB_REQUESTED_SYNC_MODE="$REQUESTED_SYNC_MODE"
          export NOTIONHUB_EFFECTIVE_SYNC_MODE="$EFFECTIVE_SYNC_MODE"
          export NOTIONHUB_INITIAL_FULL_SYNC_FORCED="$INITIAL_FULL_SYNC_FORCED"
          if [ "$SYNC_PLAN" = "trial" ] && [ "$EFFECTIVE_SYNC_MODE" = "full" ]; then
            echo "::error title=免费体验不支持全量更新::请激活后再执行全量更新。"
            exit 1
          fi
          if [ "$EFFECTIVE_SYNC_MODE" = "full" ] && [ "$SUPPORTS_FULL_SYNC" != "true" ]; then
            echo "::error title=全量更新不可用::豆瓣 暂不支持全量更新，请改用普通同步。"
            exit 1
          fi
          cd runner
          python -m notionhub_runner sync douban --job drama

      - name: 记录同步舞台剧结果
        if: always() && needs.movie.outputs.enabled == 'true' && needs.podcast_transcription.result == 'success'
        run: |
          if [ "${{ steps.restore.outcome }}" != "success" ] || [ "${{ steps.job_config.outcome }}" != "success" ]; then
            if [ "false" = "true" ]; then STATUS=warning; else STATUS=failure; fi
          elif [ "${{ steps.job_config.outputs.enabled }}" != "true" ]; then
            STATUS=skipped
          elif [ "${{ steps.sync.outcome }}" = "success" ]; then
            STATUS=success
          elif [ "false" = "true" ]; then
            STATUS=warning
            echo "::warning title=同步舞台剧未完成::主同步结果不受影响，可稍后重试此辅助阶段。"
          else
            STATUS=failure
          fi
          if [ ! -f "$SYNC_POLICY_STATE_PATH" ]; then printf '{}' > "$SYNC_POLICY_STATE_PATH"; fi
          jq -cn             --arg jobKey "drama"             --arg stageLabel "同步舞台剧"             --arg status "$STATUS"             --arg failureClass "${NOTIONHUB_FAILURE_CLASS:-}"             --argjson stageIndex 7             --argjson required true             '{stageIndex:$stageIndex,jobKey:$jobKey,label:$stageLabel,status:$status,required:$required,failureClass:(if ($failureClass | length) > 0 then $failureClass else null end)}'             > "${{ github.workspace }}/notionhub-stage-07.json"

      - name: 保存同步舞台剧进度
        if: always() && needs.movie.outputs.enabled == 'true' && needs.podcast_transcription.result == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: notionhub-douban-07-drama-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.SYNC_POLICY_STATE_PATH }}
            ${{ env.SYNC_POLICY_CONTINUATION_PATH }}
            ${{ env.NOTIONHUB_RUN_META_PATH }}
            ${{ env.NOTIONHUB_TARGET_RESULTS_PATH }}
            ${{ github.workspace }}/notionhub-stage-07.json
          if-no-files-found: error
          retention-days: 1

      - name: 下载全部阶段结果
        if: always() && needs.movie.outputs.enabled == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ARTIFACT_SPECS=(
            "required|notionhub-douban-01-movie-${{ github.run_id }}-${{ github.run_attempt }}|notionhub-stage-01.json"
            "required|notionhub-douban-02-book-${{ github.run_id }}-${{ github.run_attempt }}|notionhub-stage-02.json"
            "required|notionhub-douban-03-music-${{ github.run_id }}-${{ github.run_attempt }}|notionhub-stage-03.json"
            "required|notionhub-douban-04-game-${{ github.run_id }}-${{ github.run_attempt }}|notionhub-stage-04.json"
            "required|notionhub-douban-05-podcast-${{ github.run_id }}-${{ github.run_attempt }}|notionhub-stage-05.json"
            "optional|notionhub-douban-06-podcast_transcription-${{ github.run_id }}-${{ github.run_attempt }}|notionhub-stage-06.json"
            "required|notionhub-douban-07-drama-${{ github.run_id }}-${{ github.run_attempt }}|notionhub-stage-07.json"
          )
          ATTEMPT_DIR=""
          cleanup_artifact_attempt() {
            if [ -n "$ATTEMPT_DIR" ] && [ -d "$ATTEMPT_DIR" ]; then
              rm -rf -- "$ATTEMPT_DIR"
            fi
          }
          trap cleanup_artifact_attempt EXIT

          for ATTEMPT in 1 2 3 4 5 6; do
            cleanup_artifact_attempt
            ATTEMPT_DIR=$(mktemp -d "$RUNNER_TEMP/notionhub-artifacts.XXXXXX")
            DOWNLOAD_OK=true
            for SPEC in "${ARTIFACT_SPECS[@]}"; do
              SPEC_REQUIRED="${SPEC%%|*}"
              SPEC_CONTENT="${SPEC#*|}"
              ARTIFACT_NAME="${SPEC_CONTENT%%|*}"
              EXPECTED_FILES="${SPEC_CONTENT#*|}"
              ARTIFACT_OK=true
              ARTIFACT_DIR=""
              RESOLVED_ARTIFACT_NAME=""
              ARTIFACT_BASE_NAME="${ARTIFACT_NAME%-*}"
              CURRENT_RUN_ATTEMPT="${GITHUB_RUN_ATTEMPT:-1}"
              for ((CANDIDATE_ATTEMPT=CURRENT_RUN_ATTEMPT; CANDIDATE_ATTEMPT>=1; CANDIDATE_ATTEMPT--)); do
                CANDIDATE_ARTIFACT_NAME="$ARTIFACT_BASE_NAME-$CANDIDATE_ATTEMPT"
                CANDIDATE_ARTIFACT_DIR="$ATTEMPT_DIR/$CANDIDATE_ARTIFACT_NAME"
                mkdir -p "$CANDIDATE_ARTIFACT_DIR"
                if gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$CANDIDATE_ARTIFACT_NAME" --dir "$CANDIDATE_ARTIFACT_DIR"; then
                  RESOLVED_ARTIFACT_NAME="$CANDIDATE_ARTIFACT_NAME"
                  ARTIFACT_DIR="$CANDIDATE_ARTIFACT_DIR"
                  if [ "$CANDIDATE_ATTEMPT" -lt "$CURRENT_RUN_ATTEMPT" ]; then
                    echo "::notice title=已恢复前次运行进度::当前重试沿用第 ${CANDIDATE_ATTEMPT} 次尝试的阶段结果。"
                  fi
                  break
                fi
                rm -rf -- "$CANDIDATE_ARTIFACT_DIR"
              done
              if [ -z "$RESOLVED_ARTIFACT_NAME" ]; then
                ARTIFACT_OK=false
              else
                IFS='|' read -r -a EXPECTED_FILE_LIST <<< "$EXPECTED_FILES"
                for EXPECTED_FILE in "${EXPECTED_FILE_LIST[@]}"; do
                  if [ ! -f "$ARTIFACT_DIR/$EXPECTED_FILE" ]; then
                    ARTIFACT_OK=false
                    break
                  fi
                done
              fi
              if [ "$ARTIFACT_OK" != "true" ]; then
                if [ -n "$ARTIFACT_DIR" ]; then
                  rm -rf -- "$ARTIFACT_DIR"
                fi
                if [ "$SPEC_REQUIRED" = "required" ]; then
                  echo "::warning title=同步进度暂不可用::必要阶段结果尚未完整可见，将自动重试。"
                  DOWNLOAD_OK=false
                  break
                fi
                echo "::notice title=辅助阶段结果暂不可用::本次汇总将忽略尚未可见的辅助阶段结果。"
              fi
            done
            if [ "$DOWNLOAD_OK" = "true" ]; then
              rm -rf "${{ github.workspace }}/notionhub-artifacts"
              mkdir -p "${{ github.workspace }}/notionhub-artifacts"
              cp -R "$ATTEMPT_DIR"/. "${{ github.workspace }}/notionhub-artifacts"/
              cleanup_artifact_attempt
              ATTEMPT_DIR=""
              exit 0
            fi
            if [ "$ATTEMPT" -lt 6 ]; then
              case "$ATTEMPT" in
                1) DELAY=2 ;;
                2) DELAY=4 ;;
                3) DELAY=8 ;;
                4) DELAY=16 ;;
                *) DELAY=30 ;;
              esac
              echo "::notice title=等待同步进度::GitHub 阶段结果暂不可见，${DELAY} 秒后进行第 $((ATTEMPT + 1)) 次尝试。"
              sleep "$DELAY"
            fi
          done

          rm -rf "${{ github.workspace }}/notionhub-artifacts"
              mkdir -p "${{ github.workspace }}/notionhub-artifacts"
              cp -R "$ATTEMPT_DIR"/. "${{ github.workspace }}/notionhub-artifacts"/
          cleanup_artifact_attempt
          ATTEMPT_DIR=""
          echo "::warning title=同步阶段未全部运行::将使用已完成阶段生成最终失败报告。"
          exit 0

      - name: 汇总同步结果
        id: aggregate
        if: always()
        env:
          WORKFLOW_ENABLED: ${{ needs.movie.outputs.enabled }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import shutil
          from pathlib import Path

          root = Path('notionhub-artifacts')
          paths = list(root.rglob('notionhub-stage-*.json')) if root.exists() else []
          current = Path('notionhub-stage-07.json')
          if current.exists():
              paths.append(current)
          manifest_by_key = {}
          for path in paths:
              try:
                  value = json.loads(path.read_text(encoding='utf-8'))
              except Exception:
                  continue
              if isinstance(value, dict) and isinstance(value.get('stageIndex'), int):
                  manifest_by_key[(value['stageIndex'], str(value.get('jobKey')))] = (value, path)
          manifests = list(manifest_by_key.values())
          required = ["movie","book","music","game","podcast","drama"]
          enabled = os.environ.get('WORKFLOW_ENABLED') == 'true'
          status_by_key = {str(item.get('jobKey')): str(item.get('status')) for item, _ in manifests}
          required_failures = [key for key in required if status_by_key.get(key) == 'failure']
          missing_required = [key for key in required if key not in status_by_key]
          if not enabled:
              status = 'skipped'
          elif required_failures or missing_required:
              status = 'failure'
          else:
              status = 'success'
          warnings = [str(item.get('jobKey')) for item, _ in manifests if item.get('status') == 'warning']
          failure_priority = {
              'platform': 0,
              'upstream': 1,
              'configuration': 2,
              'notion': 3,
              'platform_authentication': 4,
              'notion_authentication': 5,
          }
          failure_classes = [str(item.get('failureClass')) for item, _ in manifests if item.get('failureClass')]
          failure_class = max(failure_classes, key=lambda value: failure_priority.get(value, 0), default='platform')
          stages = [item for item, _ in sorted(manifests, key=lambda pair: pair[0]['stageIndex'])]
          latest = max(manifests, key=lambda pair: pair[0]['stageIndex']) if manifests else None
          if latest:
              parent = latest[1].parent
              for name in ('notionhub-state.json', 'notionhub-continuation-id'):
                  source = parent / name
                  target = Path(name)
                  if source.exists() and source.resolve() != target.resolve():
                      shutil.copy2(source, target)
          run_meta = Path('notionhub-run-meta.json')
          if not run_meta.exists() and root.exists():
              run_meta = next(iter(root.rglob('notionhub-run-meta.json')), run_meta)
          meta = {}
          if run_meta.exists():
              try:
                  meta = json.loads(run_meta.read_text(encoding='utf-8'))
              except Exception:
                  meta = {}
          result = {
              'status': status,
              'warnings': warnings,
              'missingRequired': missing_required,
              'failureClass': failure_class,
              'stages': stages,
              'requestedMode': str(meta.get('requestedMode') or 'incremental'),
              'effectiveMode': str(meta.get('effectiveMode') or 'incremental'),
              'initialFullSyncForced': meta.get('initialFullSyncForced') is True,
          }
          Path('notionhub-final.json').write_text(json.dumps(result, ensure_ascii=False), encoding='utf-8')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f"status={status}\n")
              output.write(f"warning_count={len(warnings)}\n")
              output.write(f"requested_mode={result['requestedMode']}\n")
              output.write(f"effective_mode={result['effectiveMode']}\n")
              output.write(f"initial_forced={str(result['initialFullSyncForced']).lower()}\n")
              output.write(f"failure_class={failure_class}\n")
              output.write(f"continuation_ready={str(Path('notionhub-continuation-id').exists()).lower()}\n")
          PY

      - name: 判断是否需要结算
        id: finish_auth
        if: always()
        run: |
          SERVICE_PLAN=$(printf '%s' "$DOUBAN_CONFIG" | jq -r '.DOUBAN_SYNC_PLAN // "lifetime"')
          NEED_AUTH=false
          REPORT_RUN=false
          COMPLETE_INITIAL=false
          if [ "${{ steps.aggregate.outputs.status }}" != "skipped" ] && [ "${{ steps.aggregate.outputs.continuation_ready }}" = "true" ]; then
            NEED_AUTH=true
            REPORT_RUN=true
          fi
          if [ "$SERVICE_PLAN" = "lifetime" ] && [ "${{ steps.aggregate.outputs.status }}" = "success" ] && [ "${{ steps.aggregate.outputs.initial_forced }}" = "true" ]; then
            NEED_AUTH=true
            COMPLETE_INITIAL=true
          fi
          echo "enabled=$NEED_AUTH" >> "$GITHUB_OUTPUT"
          echo "report_run=$REPORT_RUN" >> "$GITHUB_OUTPUT"
          echo "complete_initial=$COMPLETE_INITIAL" >> "$GITHUB_OUTPUT"

      - name: 验证权限并获取运行程序
        id: finish_authorize
        if: always() && steps.finish_auth.outputs.enabled == 'true'
        run: |
          OIDC_TOKEN=$(curl -fsSL -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https%3A%2F%2Fi.notionhub.app" | jq -r '.value // empty')
          if [ -z "$OIDC_TOKEN" ]; then
            echo "::error title=GitHub 身份验证失败::未能获取本次运行的 OIDC token。"
            exit 1
          fi
          echo "::add-mask::$OIDC_TOKEN"
          CONTINUATION_ID="$(cat "$SYNC_POLICY_CONTINUATION_PATH")"
          if [ -z "$CONTINUATION_ID" ]; then
            echo "::error title=运行授权续接失败::同步进度中缺少续接标识。"
            exit 1
          fi
          RUNTIME_PAYLOAD=$(jq -cn --arg service "douban" --arg continuation "$CONTINUATION_ID" '{service:$service,purpose:"sync",continuationPolicyId:$continuation}')
          RUNTIME_RESPONSE="$RUNNER_TEMP/notionhub-runtime-bundle.bin"
          RUNTIME_METADATA="$RUNNER_TEMP/notionhub-runtime-metadata.json"
          RUNTIME_ARCHIVE="$RUNNER_TEMP/notionhub-runner.tar.gz"
          cleanup_runtime_files() { rm -f "$RUNTIME_RESPONSE" "$RUNTIME_METADATA" "$RUNTIME_ARCHIVE"; }
          trap cleanup_runtime_files EXIT
          HTTP_STATUS=$(curl -sS -o "$RUNTIME_RESPONSE" -w '%{http_code}' -X POST "$NOTIONHUB_API_BASE/github/runner/runtime-bundle"             -H "Authorization: Bearer $OIDC_TOKEN" -H 'Content-Type: application/json' --data "$RUNTIME_PAYLOAD")
          if [ "$HTTP_STATUS" = "418" ]; then
            echo "免费体验次数已用完，请购买激活码。"
            echo "获取激活码：https://www.notionhub.app/docs/get-activation-code.html"
            {
              echo "## 免费体验次数已用完"
              echo ""
              echo "请购买激活码并在 NotionHub 插件中完成激活后重新同步。"
              echo ""
              echo "[查看如何获取激活码](https://www.notionhub.app/docs/get-activation-code.html)"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=免费体验次数已用完::免费体验次数已用完，请购买激活码并在 NotionHub 插件中完成激活后重新同步。%0A%0A获取激活码：https://www.notionhub.app/docs/get-activation-code.html"
            exit 1
          fi
          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            MESSAGE=$(jq -r '.message // "运行准备失败"' "$RUNTIME_RESPONSE" 2>/dev/null || echo "运行准备失败")
            echo "::error title=运行准备失败::$MESSAGE"
            exit 1
          fi
          chmod 600 "$RUNTIME_RESPONSE"
          python3 - "$RUNTIME_RESPONSE" "$RUNTIME_METADATA" "$RUNTIME_ARCHIVE" "douban" <<'PY'
          import json
          import os
          import re
          import sys

          source, metadata_path, archive_path, expected_service = sys.argv[1:]
          raw = open(source, 'rb').read()
          magic = b'NHRB1\n'
          if not raw.startswith(magic) or len(raw) < len(magic) + 8:
              raise SystemExit('运行程序响应格式无效。')
          length_bytes = raw[len(magic):len(magic) + 8]
          if not re.fullmatch(rb'[0-9a-fA-F]{8}', length_bytes):
              raise SystemExit('运行配置长度无效。')
          metadata_length = int(length_bytes, 16)
          if metadata_length <= 0 or metadata_length > 1024 * 1024:
              raise SystemExit('运行配置超过大小限制。')
          metadata_start = len(magic) + 8
          metadata_end = metadata_start + metadata_length
          if metadata_end >= len(raw):
              raise SystemExit('运行程序响应不完整。')
          try:
              metadata = json.loads(raw[metadata_start:metadata_end].decode('utf-8'))
          except Exception:
              raise SystemExit('运行配置格式无效。')
          archive = raw[metadata_end:]
          if metadata.get('schemaVersion') != 1:
              raise SystemExit('运行配置版本不受支持。')
          if metadata.get('context', {}).get('service') != expected_service:
              raise SystemExit('运行配置与当前服务不匹配。')
          expected_size = metadata.get('bundle', {}).get('size')
          if not isinstance(expected_size, int) or expected_size != len(archive) or not archive or len(archive) > 64 * 1024 * 1024:
              raise SystemExit('运行程序大小校验失败。')
          for path, data in ((metadata_path, json.dumps(metadata, ensure_ascii=False, separators=(',', ':')).encode()), (archive_path, archive)):
              with open(path, 'wb') as handle:
                  handle.write(data)
              os.chmod(path, 0o600)
          PY
          ACCESS_TOKEN=$(jq -r '.accessToken // empty' "$RUNTIME_METADATA")
          REPORT_TOKEN=$(jq -r '.reportToken // empty' "$RUNTIME_METADATA")
          POLICY_ID=$(jq -r '.context.id // empty' "$RUNTIME_METADATA")
          PLAN=$(jq -r '.context.plan // empty' "$RUNTIME_METADATA")
          POLICY_JSON=$(jq -c '.policy // {}' "$RUNTIME_METADATA")
          POLICY_SIGNATURE=$(jq -r '.policySignature // empty' "$RUNTIME_METADATA")
          SERVICE_CONFIG=$(jq -c '.serviceConfig // empty' "$RUNTIME_METADATA")
          EXPECTED_SIZE=$(jq -r '.bundle.size // empty' "$RUNTIME_METADATA")
          EXPECTED_SHA256=$(jq -r '.bundle.sha256 // empty' "$RUNTIME_METADATA")
          if [ -z "$ACCESS_TOKEN" ] || [ -z "$REPORT_TOKEN" ] || [ -z "$POLICY_ID" ] || [ -z "$PLAN" ] || [ -z "$POLICY_SIGNATURE" ] || [ -z "$SERVICE_CONFIG" ] || [ -z "$EXPECTED_SIZE" ] || [ -z "$EXPECTED_SHA256" ]; then
            echo "::error title=运行准备失败::运行配置缺少必要字段。"
            exit 1
          fi
          for VALUE in "$ACCESS_TOKEN" "$REPORT_TOKEN" "$POLICY_SIGNATURE" "$SERVICE_CONFIG"; do echo "::add-mask::$VALUE"; done
          python3 - "$RUNTIME_METADATA" <<'PY'
          import json
          import sys
          metadata = json.load(open(sys.argv[1], encoding='utf-8'))
          for value in metadata.get('serviceConfig', {}).values():
              escaped = str(value).replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              if len(escaped) >= 8:
                  print(f'::add-mask::{escaped}')
          PY
          ACTUAL_SIZE=$(wc -c < "$RUNTIME_ARCHIVE" | tr -d ' ')
          ACTUAL_SHA256=$(sha256sum "$RUNTIME_ARCHIVE" | awk '{print $1}')
          if [ "$ACTUAL_SIZE" != "$EXPECTED_SIZE" ] || [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
            echo "::error title=运行程序校验失败::下载内容的大小或 SHA-256 不匹配。"
            exit 1
          fi
          if tar -tzf "$RUNTIME_ARCHIVE" | grep -Eq '(^/|(^|/)\.\.(/|$))'; then
            echo "::error title=运行程序校验失败::运行程序包含不安全路径。"
            exit 1
          fi
          tar -xzf "$RUNTIME_ARCHIVE"
          test -f runner/requirements.txt
          test -d runner/notionhub_runner
          {
            echo "NOTIONHUB_RUN_ACCESS_TOKEN=$ACCESS_TOKEN"
            echo "NOTIONHUB_REPORT_TOKEN=$REPORT_TOKEN"
            echo "NOTIONHUB_POLICY_ID=$POLICY_ID"
            echo "SYNC_RUN_ID=$POLICY_ID"
            echo "SYNC_PLAN=$PLAN"
            echo "ENTITLEMENT_PLAN=$PLAN"
            echo "SYNC_POLICY_JSON=$POLICY_JSON"
            echo "SYNC_POLICY_SIGNATURE=$POLICY_SIGNATURE"
            echo "SYNC_POLICY_SIGNING_KEY=$ACCESS_TOKEN"
            echo "NOTIONHUB_TARGET_RESULTS_PATH=$GITHUB_WORKSPACE/notionhub-target-results.json"
            echo 'DOUBAN_CONFIG<<NOTIONHUB_CONFIG_EOF'
            echo "$SERVICE_CONFIG"
            echo 'NOTIONHUB_CONFIG_EOF'
          } >> "$GITHUB_ENV"
          echo "plan=$PLAN" >> "$GITHUB_OUTPUT"

      - name: 提交运行结果
        if: always() && steps.finish_auth.outputs.report_run == 'true' && steps.finish_authorize.outcome == 'success'
        run: |
          if [ "${{ steps.aggregate.outputs.status }}" = "success" ]; then STATUS=success; else STATUS=failure; fi
          cd runner
          python -m notionhub_runner report douban --status "$STATUS" --state "${{ github.workspace }}/notionhub-state.json" --output "$RUNNER_TEMP/notionhub-settlement.json" --failure-class "${{ steps.aggregate.outputs.failure_class || 'platform' }}"
          curl --retry 3 --retry-all-errors -fsSL -X POST "$NOTIONHUB_API_BASE/internal/trial-runs/$NOTIONHUB_POLICY_ID/report"             -H "Authorization: Bearer $NOTIONHUB_REPORT_TOKEN" -H 'Content-Type: application/json' --data-binary "@$RUNNER_TEMP/notionhub-settlement.json" >/dev/null

      - name: 确认首次全量同步完成
        if: always() && steps.finish_auth.outputs.complete_initial == 'true' && steps.finish_authorize.outcome == 'success'
        run: |
          PAYLOAD=$(jq -cn --arg service "douban" --arg repository "${{ github.repository }}" --arg run_id "${{ github.run_id }}" --arg requested "${{ steps.aggregate.outputs.requested_mode }}" --arg effective "${{ steps.aggregate.outputs.effective_mode }}" '{service:$service,repository:$repository,githubRunId:$run_id,status:"success",requestedMode:$requested,effectiveMode:$effective,initialFullSyncForced:true}')
          curl -fsSL -X POST "$NOTIONHUB_API_BASE/internal/initial-full-sync/complete"             -H "Authorization: Bearer $NOTIONHUB_RUN_ACCESS_TOKEN" -H 'Content-Type: application/json' --data "$PAYLOAD" >/dev/null

      - name: 生成运行摘要
        if: always()
        run: |
          case "${{ steps.aggregate.outputs.status }}" in
            success) RESULT="同步成功" ;;
            failure) RESULT="同步失败" ;;
            skipped) RESULT="未配置，已跳过" ;;
            *) RESULT="同步状态未知" ;;
          esac
          if [ "${{ github.event_name }}" = "schedule" ]; then TRIGGER="定时运行"; else TRIGGER="手动运行"; fi
          if [ "${{ steps.aggregate.outputs.effective_mode }}" = "full" ]; then MODE_LABEL="全量更新"; else MODE_LABEL="增量同步"; fi
          {
            echo "## 豆瓣同步"
            echo ""
            echo "| 项目 | 内容 |"
            echo "| --- | --- |"
            echo "| 结果 | $RESULT |"
            echo "| 模式 | $MODE_LABEL |"
            echo "| 辅助阶段警告 | ${{ steps.aggregate.outputs.warning_count || '0' }} |"
            if [ -f notionhub-final.json ]; then
              jq -r '.stages[] | [(.label // .jobKey), .status] | @tsv' notionhub-final.json | while IFS=$'	' read -r STAGE_LABEL STAGE_STATUS; do
                case "$STAGE_STATUS" in
                  success) STAGE_RESULT="成功" ;;
                  skipped) STAGE_RESULT="已跳过" ;;
                  warning) STAGE_RESULT="有警告" ;;
                  failure) STAGE_RESULT="失败" ;;
                  *) STAGE_RESULT="未知" ;;
                esac
                echo "| 阶段：$STAGE_LABEL | $STAGE_RESULT |"
              done
            fi
            echo "| 触发方式 | $TRIGGER |"
            echo "| 运行记录 | [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 确认同步成功
        if: always()
        run: |
          if [ "${{ steps.aggregate.outputs.status }}" = "failure" ]; then exit 1; fi

