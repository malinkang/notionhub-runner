# NotionHub generated Keep single-job workflow v39
name: Keep
run-name: ${{ github.workflow }}

on:
  workflow_dispatch:
    inputs:
      notionhub_run_id:
        description: NotionHub 内部运行标识
        required: false
        default: ''
      reason:
        description: 触发原因
        required: false
        default: manual
      sync_mode:
        description: 同步模式
        required: false
        default: incremental
        type: choice
        options:
          - incremental\n          - full
      payload:
        description: 同步参数 JSON
        required: false
        default: '{}'
  schedule:
    - cron: '0 2 * * *'


permissions:
  contents: read
  id-token: write

concurrency:
  group: notionhub-keep-sync-${{ github.ref_name }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  sync:
    name: Keep串行同步
    runs-on: ubuntu-latest
    env:
      KEEP_CONFIG: ${{ secrets.KEEP_CONFIG }}
      NOTIONHUB_API_BASE: https://i.notionhub.app/v1
      NOTIONHUB_SERVICE: keep
      NOTIONHUB_CONFIG_VERSION: '69'
      SYNC_POLICY_STATE_PATH: ${{ github.workspace }}/notionhub-state.json
      SYNC_POLICY_CONTINUATION_PATH: ${{ github.workspace }}/notionhub-continuation-id
      SYNC_POLICY_REPORT_PATH: ${{ github.workspace }}/notionhub-service-report.json
      NOTIONHUB_RUN_META_PATH: ${{ github.workspace }}/notionhub-run-meta.json
      NOTIONHUB_TARGET_RESULTS_PATH: ${{ github.workspace }}/notionhub-target-results.json
    steps:
      - name: 清理历史同步临时文件
        shell: bash
        run: |
          set -euo pipefail
          rm -f -- \
            "$GITHUB_WORKSPACE/notionhub-state.json" \
            "$GITHUB_WORKSPACE/notionhub-continuation-id" \
            "$GITHUB_WORKSPACE/notionhub-run-meta.json" \
            "$GITHUB_WORKSPACE/notionhub-target-results.json" \
            "$GITHUB_WORKSPACE/notionhub-service-report.json" \
            "$GITHUB_WORKSPACE/notionhub-final.json"
          shopt -s nullglob
          for STAGE_FILE in "$GITHUB_WORKSPACE"/notionhub-stage-*.json; do rm -f -- "$STAGE_FILE"; done

      - name: 验证运行配置
        id: activation
        env:
          SERVICE_CONFIG: ${{ secrets.KEEP_CONFIG }}
        run: |
          if [ -z "$SERVICE_CONFIG" ]; then
            echo "::notice title=Keep尚未配置::请先在插件中完成配置并保存。"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Keep daily-health continuation is authorized from current D1 state by OIDC.
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: 验证权限并获取运行程序
        id: authorize
        if: steps.activation.outputs.enabled == 'true'
        run: |
          RUNTIME_PAYLOAD='{"service":"keep","purpose":"sync"}'
          RUNTIME_RESPONSE="$RUNNER_TEMP/notionhub-runtime-bundle.bin"
          RUNTIME_METADATA="$RUNNER_TEMP/notionhub-runtime-metadata.json"
          RUNTIME_ARCHIVE="$RUNNER_TEMP/notionhub-runner.tar.gz"
          cleanup_runtime_files() { rm -f "$RUNTIME_RESPONSE" "$RUNTIME_METADATA" "$RUNTIME_ARCHIVE"; }
          trap cleanup_runtime_files EXIT
          # GitHub OIDC tokens are single-use at the Worker. Never let a
          # transport retry reuse a token that may already have been consumed
          # by a request whose response was lost after the server accepted it.
          HTTP_STATUS=000
          for ATTEMPT in 1 2 3 4; do
            OIDC_TOKEN=$(curl -fsSL --max-time 30 -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN"               "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https%3A%2F%2Fi.notionhub.app" | jq -r '.value // empty') || OIDC_TOKEN=""
            if [ -n "$OIDC_TOKEN" ]; then
              echo "::add-mask::$OIDC_TOKEN"
              HTTP_STATUS=$(curl -sS --max-time 120 -o "$RUNTIME_RESPONSE" -w '%{http_code}' -X POST "$NOTIONHUB_API_BASE/github/runner/runtime-bundle"                 -H "Authorization: Bearer $OIDC_TOKEN" -H 'Content-Type: application/json' --data "$RUNTIME_PAYLOAD") || HTTP_STATUS=000
              unset OIDC_TOKEN
            else
              HTTP_STATUS=000
            fi
            case "$HTTP_STATUS" in
              2??) break ;;
              408|429|5??|000)
                if [ "$ATTEMPT" -lt 4 ]; then sleep $((ATTEMPT * 2)); fi
                ;;
              4??|*) break ;;
            esac
          done
          if [ "$HTTP_STATUS" = "000" ]; then
            echo "::error title=运行准备失败::无法获取 GitHub OIDC token 或连接运行服务。"
            exit 1
          fi
          if [ "$HTTP_STATUS" = "418" ]; then
            echo "免费体验次数已用完，请购买激活码。"
            echo "获取激活码：https://www.notionhub.app/docs/get-activation-code.html"
            {
              echo "## 免费体验次数已用完"
              echo ""
              echo "请购买激活码并在 NotionHub 插件中完成激活后重新同步。"
              echo ""
              echo "[查看如何获取激活码](https://www.notionhub.app/docs/get-activation-code.html)"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=免费体验次数已用完::免费体验次数已用完，请购买激活码并在 NotionHub 插件中完成激活后重新同步。%0A%0A获取激活码：https://www.notionhub.app/docs/get-activation-code.html"
            exit 1
          fi
          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            MESSAGE=$(jq -r '.message // "运行准备失败"' "$RUNTIME_RESPONSE" 2>/dev/null || echo "运行准备失败")
            echo "::error title=运行准备失败::$MESSAGE"
            exit 1
          fi
          chmod 600 "$RUNTIME_RESPONSE"
          python3 - "$RUNTIME_RESPONSE" "$RUNTIME_METADATA" "$RUNTIME_ARCHIVE" "keep" <<'PY'
          import json
          import os
          import re
          import sys

          source, metadata_path, archive_path, expected_service = sys.argv[1:]
          raw = open(source, 'rb').read()
          magic = b'NHRB1\n'
          if not raw.startswith(magic) or len(raw) < len(magic) + 8:
              raise SystemExit('运行程序响应格式无效。')
          length_bytes = raw[len(magic):len(magic) + 8]
          if not re.fullmatch(rb'[0-9a-fA-F]{8}', length_bytes):
              raise SystemExit('运行配置长度无效。')
          metadata_length = int(length_bytes, 16)
          if metadata_length <= 0 or metadata_length > 1024 * 1024:
              raise SystemExit('运行配置超过大小限制。')
          metadata_start = len(magic) + 8
          metadata_end = metadata_start + metadata_length
          if metadata_end >= len(raw):
              raise SystemExit('运行程序响应不完整。')
          try:
              metadata = json.loads(raw[metadata_start:metadata_end].decode('utf-8'))
          except Exception:
              raise SystemExit('运行配置格式无效。')
          archive = raw[metadata_end:]
          if metadata.get('schemaVersion') != 1:
              raise SystemExit('运行配置版本不受支持。')
          if metadata.get('context', {}).get('service') != expected_service:
              raise SystemExit('运行配置与当前服务不匹配。')
          expected_size = metadata.get('bundle', {}).get('size')
          if not isinstance(expected_size, int) or expected_size != len(archive) or not archive or len(archive) > 64 * 1024 * 1024:
              raise SystemExit('运行程序大小校验失败。')
          for path, data in ((metadata_path, json.dumps(metadata, ensure_ascii=False, separators=(',', ':')).encode()), (archive_path, archive)):
              with open(path, 'wb') as handle:
                  handle.write(data)
              os.chmod(path, 0o600)
          PY
          ACCESS_TOKEN=$(jq -r '.accessToken // empty' "$RUNTIME_METADATA")
          REPORT_TOKEN=$(jq -r '.reportToken // empty' "$RUNTIME_METADATA")
          CONTINUATION_TOKEN=$(jq -r '.continuationToken // empty' "$RUNTIME_METADATA")
          POLICY_ID=$(jq -r '.context.id // empty' "$RUNTIME_METADATA")
          PLAN=$(jq -r '.context.plan // empty' "$RUNTIME_METADATA")
          POLICY_JSON=$(jq -c '.policy // {}' "$RUNTIME_METADATA")
          POLICY_SIGNATURE=$(jq -r '.policySignature // empty' "$RUNTIME_METADATA")
          SERVICE_CONFIG=$(jq -c '.serviceConfig // empty' "$RUNTIME_METADATA")
          EXPECTED_SIZE=$(jq -r '.bundle.size // empty' "$RUNTIME_METADATA")
          EXPECTED_SHA256=$(jq -r '.bundle.sha256 // empty' "$RUNTIME_METADATA")
          if [ -z "$ACCESS_TOKEN" ] || [ -z "$REPORT_TOKEN" ] || [ -z "$CONTINUATION_TOKEN" ] || [ -z "$POLICY_ID" ] || [ -z "$PLAN" ] || [ -z "$POLICY_SIGNATURE" ] || [ -z "$SERVICE_CONFIG" ] || [ -z "$EXPECTED_SIZE" ] || [ -z "$EXPECTED_SHA256" ]; then
            echo "::error title=运行准备失败::运行配置缺少必要字段。"
            exit 1
          fi
          for VALUE in "$ACCESS_TOKEN" "$REPORT_TOKEN" "$CONTINUATION_TOKEN" "$POLICY_SIGNATURE" "$SERVICE_CONFIG"; do echo "::add-mask::$VALUE"; done
          printf '%s' "$CONTINUATION_TOKEN" > "$SYNC_POLICY_CONTINUATION_PATH"
          chmod 600 "$SYNC_POLICY_CONTINUATION_PATH"
          python3 - "$RUNTIME_METADATA" <<'PY'
          import json
          import sys
          metadata = json.load(open(sys.argv[1], encoding='utf-8'))
          for value in metadata.get('serviceConfig', {}).values():
              escaped = str(value).replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              if len(escaped) >= 8:
                  print(f'::add-mask::{escaped}')
          PY
          ACTUAL_SIZE=$(wc -c < "$RUNTIME_ARCHIVE" | tr -d ' ')
          ACTUAL_SHA256=$(sha256sum "$RUNTIME_ARCHIVE" | awk '{print $1}')
          if [ "$ACTUAL_SIZE" != "$EXPECTED_SIZE" ] || [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
            echo "::error title=运行程序校验失败::下载内容的大小或 SHA-256 不匹配。"
            exit 1
          fi
          if tar -tzf "$RUNTIME_ARCHIVE" | grep -Eq '(^/|(^|/)\.\.(/|$))'; then
            echo "::error title=运行程序校验失败::运行程序包含不安全路径。"
            exit 1
          fi
          tar -xzf "$RUNTIME_ARCHIVE"
          test -f runner/requirements.txt
          test -d runner/notionhub_runner
          {
            echo "NOTIONHUB_RUN_ACCESS_TOKEN=$ACCESS_TOKEN"
            echo "NOTIONHUB_REPORT_TOKEN=$REPORT_TOKEN"
            echo "NOTIONHUB_POLICY_ID=$POLICY_ID"
            echo "SYNC_RUN_ID=$POLICY_ID"
            echo "SYNC_PLAN=$PLAN"
            echo "ENTITLEMENT_PLAN=$PLAN"
            echo "SYNC_POLICY_JSON=$POLICY_JSON"
            echo "SYNC_POLICY_SIGNATURE=$POLICY_SIGNATURE"
            echo "SYNC_POLICY_SIGNING_KEY=$ACCESS_TOKEN"
            echo "NOTIONHUB_TARGET_RESULTS_PATH=$GITHUB_WORKSPACE/notionhub-target-results.json"
            echo 'KEEP_CONFIG<<NOTIONHUB_CONFIG_EOF'
            echo "$SERVICE_CONFIG"
            echo 'NOTIONHUB_CONFIG_EOF'
          } >> "$GITHUB_ENV"
          echo "plan=$PLAN" >> "$GITHUB_OUTPUT"

      - name: 初始化同步进度
        id: progress
        if: steps.authorize.outcome == 'success'
        env:
          RAW_ACTION_PAYLOAD: ${{ github.event.inputs.payload || '{}' }}
          INPUT_SYNC_MODE: ${{ github.event.inputs.sync_mode || '' }}
        run: |
          REQUESTED_SYNC_MODE=$(jq -nr --arg raw "$RAW_ACTION_PAYLOAD" --arg input "$INPUT_SYNC_MODE" --arg server "${NOTIONHUB_CAPTURE_SYNC_MODE:-}" '($raw | fromjson? // {}) as $payload | ($payload.requestedSyncMode // $payload.syncMode // $payload.sync_mode // "") as $payload_mode | (if $server == "full" or $server == "incremental" then $server elif $payload_mode == "full" or $payload_mode == "incremental" then $payload_mode elif $input == "full" or $input == "incremental" then $input else "incremental" end)')
          CONFIG_INITIAL_FULL_SYNC_REQUIRED=$(printf '%s' "$KEEP_CONFIG" | jq -r '(.KEEP_INITIAL_FULL_SYNC_REQUIRED // false) | tostring' 2>/dev/null || echo "false")
          PAYLOAD_INITIAL_FULL_SYNC_REQUIRED=$(jq -nr --arg raw "$RAW_ACTION_PAYLOAD" '($raw | fromjson? // {}) | (.initialFullSyncForced // false) | tostring')
          if [ "$CONFIG_INITIAL_FULL_SYNC_REQUIRED" = "true" ] || [ "$PAYLOAD_INITIAL_FULL_SYNC_REQUIRED" = "true" ]; then
            EFFECTIVE_SYNC_MODE=full
            INITIAL_FULL_SYNC_FORCED=true
          else
            EFFECTIVE_SYNC_MODE="$REQUESTED_SYNC_MODE"
            INITIAL_FULL_SYNC_FORCED=false
          fi
          ACTION_PAYLOAD=$(jq -cn --arg raw "$RAW_ACTION_PAYLOAD" --arg requested "$REQUESTED_SYNC_MODE" --arg effective "$EFFECTIVE_SYNC_MODE" --arg forced "$INITIAL_FULL_SYNC_FORCED" '($raw | fromjson? // {}) | del(.repair_after_sync, .run_safe_repair_after_sync) + {requestedSyncMode:$requested,syncMode:$effective,sync_mode:$effective,effectiveSyncMode:$effective,initialFullSyncForced:($forced == "true"),repair:false,runSafeRepairAfterSync:false}')
          {
            echo "NOTIONHUB_ACTION_PAYLOAD=$ACTION_PAYLOAD"
            echo "NOTIONHUB_REQUESTED_SYNC_MODE=$REQUESTED_SYNC_MODE"
            echo "NOTIONHUB_EFFECTIVE_SYNC_MODE=$EFFECTIVE_SYNC_MODE"
            echo "NOTIONHUB_INITIAL_FULL_SYNC_FORCED=$INITIAL_FULL_SYNC_FORCED"
          } >> "$GITHUB_ENV"
          export NOTIONHUB_ACTION_PAYLOAD="$ACTION_PAYLOAD"
          export NOTIONHUB_REQUESTED_SYNC_MODE="$REQUESTED_SYNC_MODE"
          export NOTIONHUB_EFFECTIVE_SYNC_MODE="$EFFECTIVE_SYNC_MODE"
          export NOTIONHUB_INITIAL_FULL_SYNC_FORCED="$INITIAL_FULL_SYNC_FORCED"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          try:
              policy = json.loads(os.environ.get('SYNC_POLICY_JSON', '{}'))
          except Exception:
              policy = {}
          initial = policy.get('initialState') if isinstance(policy, dict) else None
          state = initial if isinstance(initial, dict) else {}
          Path(os.environ['SYNC_POLICY_STATE_PATH']).write_text(json.dumps(state, ensure_ascii=False), encoding='utf-8')
          PY
          RAW_CONFIG="${KEEP_CONFIG:-$SERVICE_CONFIG}"
          SAFE_CONFIG=$(printf '%s' "$RAW_CONFIG" | jq -c '{
            ("KEEP_SYNC_PLAN"): (."KEEP_SYNC_PLAN" // null),
            ("KEEP_SERVICE_OPTIONS"): (."KEEP_SERVICE_OPTIONS" // null),
            ("KEEP_INITIAL_FULL_SYNC_REQUIRED"): (."KEEP_INITIAL_FULL_SYNC_REQUIRED" // null),
            ("KEEP_UPLOAD_FILES"): (."KEEP_UPLOAD_FILES" // null)
          } | with_entries(select(.value != null))' 2>/dev/null || echo '{}')
          jq -cn \
            --arg requested "$NOTIONHUB_REQUESTED_SYNC_MODE" \
            --arg effective "$NOTIONHUB_EFFECTIVE_SYNC_MODE" \
            --argjson initialFullSyncForced "${NOTIONHUB_INITIAL_FULL_SYNC_FORCED:-false}" \
            --argjson serviceConfig "$SAFE_CONFIG" \
            '{requestedMode:$requested,effectiveMode:$effective,initialFullSyncForced:$initialFullSyncForced,serviceConfig:$serviceConfig}' \
            > "$NOTIONHUB_RUN_META_PATH"

      - name: 配置 Python 环境
        id: python
        if: steps.authorize.outcome == 'success'
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 安装运行依赖
        id: install
        if: steps.authorize.outcome == 'success'
        run: |
          python -m pip install --quiet --disable-pip-version-check --upgrade pip
          if [ -f runner/requirements.txt ]; then pip install --quiet --disable-pip-version-check -r runner/requirements.txt; fi
          SERVICE_REQUIREMENTS=$(cd runner && python -m notionhub_runner requirements keep)
          if [ -f "$SERVICE_REQUIREMENTS" ]; then
            SERVICE_REQUIREMENTS_DIR=$(dirname "$SERVICE_REQUIREMENTS")
            SERVICE_REQUIREMENTS_FILE=$(basename "$SERVICE_REQUIREMENTS")
            (cd "$SERVICE_REQUIREMENTS_DIR" && pip install --quiet --disable-pip-version-check -r "$SERVICE_REQUIREMENTS_FILE")
          fi

      - name: 检查同步运动配置
        id: stage_config_workout
        if: always() && steps.activation.outputs.enabled == 'true'
        continue-on-error: true
        env:
          RAW_ACTION_PAYLOAD: ${{ github.event.inputs.payload || '{}' }}
          PREVIOUS_STAGE_STATUS: ''
          PROGRESS_OUTCOME: ${{ steps.progress.outcome }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
        run: |
          if [ "$PROGRESS_OUTCOME" != "success" ] || [ "$INSTALL_OUTCOME" != "success" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "plan=lifetime" >> "$GITHUB_OUTPUT"
            echo "::notice title=同步运动已跳过::运行环境初始化失败"
          else
          SERVICE_CONFIG="$KEEP_CONFIG"
          PLAN=$(printf '%s' "$SERVICE_CONFIG" | jq -r '.KEEP_SYNC_PLAN // "lifetime"')
          JOB_ENABLED=true
          SKIP_REASON=""
          CONFIG_SERVICE_OPTIONS=$(printf '%s' "$SERVICE_CONFIG" | jq -c '.KEEP_SERVICE_OPTIONS // {}')
          PAYLOAD_SERVICE_OPTIONS=$(jq -cn --arg raw "$RAW_ACTION_PAYLOAD" '($raw | fromjson? // {}) | if (.serviceOptions | type) == "object" then .serviceOptions else null end')
          META_SERVICE_OPTIONS=$(if [ -n "${NOTIONHUB_RUN_META_PATH:-}" ] && [ -f "${NOTIONHUB_RUN_META_PATH:-}" ]; then jq -c '.serviceConfig.KEEP_SERVICE_OPTIONS // empty' "$NOTIONHUB_RUN_META_PATH" 2>/dev/null || echo ""; fi)
          if [ "$PAYLOAD_SERVICE_OPTIONS" != "null" ]; then
            SERVICE_OPTIONS="$PAYLOAD_SERVICE_OPTIONS"
          elif [ -n "$META_SERVICE_OPTIONS" ] && [ "$META_SERVICE_OPTIONS" != "null" ]; then
            SERVICE_OPTIONS="$META_SERVICE_OPTIONS"
          else
            SERVICE_OPTIONS="$CONFIG_SERVICE_OPTIONS"
          fi
          if ! printf '%s' "$SERVICE_OPTIONS" | jq -e --arg key "workout" '(if type == "string" then (try fromjson catch {}) elif type == "object" then . else {} end) | (.enabledStreams // []) as $enabled | ($enabled | length == 0) or ($enabled | index($key) != null)' >/dev/null; then
            JOB_ENABLED=false
            SKIP_REASON="未在同步内容中启用"
          fi
          echo "enabled=$JOB_ENABLED" >> "$GITHUB_OUTPUT"
          echo "plan=$PLAN" >> "$GITHUB_OUTPUT"
          if [ "$JOB_ENABLED" != "true" ]; then
            echo "::notice title=同步运动已跳过::$SKIP_REASON"
          fi
          fi

      - name: 同步运动
        id: stage_sync_workout
        if: steps.stage_config_workout.outputs.enabled == 'true'
        continue-on-error: true
        env:
          PYTHONUNBUFFERED: '1'
          TZ: Asia/Shanghai
          RAW_ACTION_PAYLOAD: ${{ github.event.inputs.payload || '{}' }}
          INPUT_SYNC_MODE: ${{ github.event.inputs.sync_mode || '' }}
          SUPPORTS_FULL_SYNC: 'true'
          NOTIONHUB_DEFER_FILES: 'true'
        run: |
          echo "NOTIONHUB_FAILURE_CLASS=" >> "$GITHUB_ENV"
          REQUESTED_SYNC_MODE=$(jq -nr --arg raw "$RAW_ACTION_PAYLOAD" --arg input "$INPUT_SYNC_MODE" --arg server "${NOTIONHUB_CAPTURE_SYNC_MODE:-}" '($raw | fromjson? // {}) as $payload | ($payload.requestedSyncMode // $payload.syncMode // $payload.sync_mode // "") as $payload_mode | (if $server == "full" or $server == "incremental" then $server elif $payload_mode == "full" or $payload_mode == "incremental" then $payload_mode elif $input == "full" or $input == "incremental" then $input else "incremental" end)')
          CONFIG_INITIAL_FULL_SYNC_REQUIRED=$(printf '%s' "$KEEP_CONFIG" | jq -r '(.KEEP_INITIAL_FULL_SYNC_REQUIRED // false) | tostring' 2>/dev/null || echo "false")
          PAYLOAD_INITIAL_FULL_SYNC_REQUIRED=$(jq -nr --arg raw "$RAW_ACTION_PAYLOAD" '($raw | fromjson? // {}) | (.initialFullSyncForced // false) | tostring')
          if [ "$CONFIG_INITIAL_FULL_SYNC_REQUIRED" = "true" ] || [ "$PAYLOAD_INITIAL_FULL_SYNC_REQUIRED" = "true" ]; then
            EFFECTIVE_SYNC_MODE=full
            INITIAL_FULL_SYNC_FORCED=true
          else
            EFFECTIVE_SYNC_MODE="$REQUESTED_SYNC_MODE"
            INITIAL_FULL_SYNC_FORCED=false
          fi
          ACTION_PAYLOAD=$(jq -cn --arg raw "$RAW_ACTION_PAYLOAD" --arg requested "$REQUESTED_SYNC_MODE" --arg effective "$EFFECTIVE_SYNC_MODE" --arg forced "$INITIAL_FULL_SYNC_FORCED" '($raw | fromjson? // {}) | del(.repair_after_sync, .run_safe_repair_after_sync) + {requestedSyncMode:$requested,syncMode:$effective,sync_mode:$effective,effectiveSyncMode:$effective,initialFullSyncForced:($forced == "true"),repair:false,runSafeRepairAfterSync:false}')
          {
            echo "NOTIONHUB_ACTION_PAYLOAD=$ACTION_PAYLOAD"
            echo "NOTIONHUB_REQUESTED_SYNC_MODE=$REQUESTED_SYNC_MODE"
            echo "NOTIONHUB_EFFECTIVE_SYNC_MODE=$EFFECTIVE_SYNC_MODE"
            echo "NOTIONHUB_INITIAL_FULL_SYNC_FORCED=$INITIAL_FULL_SYNC_FORCED"
          } >> "$GITHUB_ENV"
          export NOTIONHUB_ACTION_PAYLOAD="$ACTION_PAYLOAD"
          export NOTIONHUB_REQUESTED_SYNC_MODE="$REQUESTED_SYNC_MODE"
          export NOTIONHUB_EFFECTIVE_SYNC_MODE="$EFFECTIVE_SYNC_MODE"
          export NOTIONHUB_INITIAL_FULL_SYNC_FORCED="$INITIAL_FULL_SYNC_FORCED"
          if [ "$SYNC_PLAN" = "trial" ] && [ "$EFFECTIVE_SYNC_MODE" = "full" ]; then
            echo "::error title=免费体验不支持全量更新::请激活后再执行全量更新。"
            exit 1
          fi
          if [ "$EFFECTIVE_SYNC_MODE" = "full" ] && [ "$SUPPORTS_FULL_SYNC" != "true" ]; then
            echo "::error title=全量更新不可用::Keep 暂不支持全量更新，请改用普通同步。"
            exit 1
          fi
          cd runner
          python -m notionhub_runner sync keep --job workout

      - name: 记录同步运动结果
        id: stage_record_workout
        if: always() && steps.activation.outputs.enabled == 'true'
        run: |
          STATUS=skipped
          if [ "${{ steps.stage_config_workout.outcome }}" != "success" ]; then
            if [ "false" = "true" ]; then STATUS=warning; else STATUS=failure; fi
          elif [ "${{ steps.stage_config_workout.outputs.enabled }}" = "true" ] && [ "${{ steps.stage_sync_workout.outcome }}" = "success" ]; then
            STATUS=success
          elif [ "false" = "true" ]; then
            STATUS=warning
            echo "::warning title=同步运动未完成::主同步结果不受影响，可稍后重试此阶段。"
          elif [ "${{ steps.stage_config_workout.outputs.enabled }}" = "true" ]; then
            STATUS=failure
          fi
          FAILURE_CLASS=""
          if [ "$STATUS" = "failure" ] || [ "$STATUS" = "warning" ]; then
            FAILURE_CLASS="${NOTIONHUB_FAILURE_CLASS:-}"
          fi
          if [ ! -f "$SYNC_POLICY_STATE_PATH" ]; then printf '{}' > "$SYNC_POLICY_STATE_PATH"; fi
          jq -cn             --arg jobKey "workout"             --arg stageLabel "同步运动"             --arg status "$STATUS"             --arg failureClass "$FAILURE_CLASS"             --argjson stageIndex 1             --argjson required true             '{stageIndex:$stageIndex,jobKey:$jobKey,label:$stageLabel,status:$status,required:$required,failureClass:(if ($failureClass | length) > 0 then $failureClass else null end)}'             > "$GITHUB_WORKSPACE/notionhub-stage-01.json"
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"


