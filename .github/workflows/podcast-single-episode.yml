# NotionHub generated Podcast single episode workflow v2
name: 单集同步
run-name: 单集同步

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: 'NotionHub 随机请求标识'
        required: false
        default: ''
        type: string
      eid:
        description: '小宇宙单集 ID (eid)'
        required: false
        default: ''
        type: string
      sync_env_b64:
        description: 'Base64 编码的同步配置'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: notionhub-podcast-single-${{ inputs.request_id || inputs.eid || github.run_id }}
  cancel-in-progress: false

jobs:
  single-episode-sync:
    name: 单集同步
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装运行依赖
        env:
          SYNC_ENV_B64: ${{ github.event.inputs.sync_env_b64 }}
        run: |
          set -euo pipefail
          python -m pip install --quiet --disable-pip-version-check --upgrade pip

          BUNDLE_URL="https://images.notionhub.app/runner-bundles/v120-podcast-single-episode-caa4fb7/podcast.tar.gz"
          BUNDLE_ARCHIVE="$RUNNER_TEMP/podcast-bundle.tar.gz"
          BUNDLE_DIR="$RUNNER_TEMP/podcast-runner"

          INSTALLED_FROM_BUNDLE=false
          echo "正在从 R2 下载 Podcast 运行程序包..."
          if curl -fsSL --retry 3 --retry-all-errors --retry-delay 2 "$BUNDLE_URL" -o "$BUNDLE_ARCHIVE" 2>/dev/null; then
            mkdir -p "$BUNDLE_DIR"
            if tar -xzf "$BUNDLE_ARCHIVE" -C "$BUNDLE_DIR" 2>/dev/null; then
              if [ -f "$BUNDLE_DIR/runner/scripts/podcast2notion/requirements.txt" ]; then
                grep -v '^podcast2notion' "$BUNDLE_DIR/runner/scripts/podcast2notion/requirements.txt" | pip install --quiet --disable-pip-version-check -r /dev/stdin
              fi
              echo "PYTHONPATH=$BUNDLE_DIR/runner/scripts/podcast2notion:$BUNDLE_DIR/runner/scripts/notionhub-core:${PYTHONPATH:-}" >> "$GITHUB_ENV"
              export PYTHONPATH="$BUNDLE_DIR/runner/scripts/podcast2notion:$BUNDLE_DIR/runner/scripts/notionhub-core:${PYTHONPATH:-}"
              INSTALLED_FROM_BUNDLE=true
              echo "成功从 R2 预编译包安装依赖。"
            fi
          fi

          if [ "$INSTALLED_FROM_BUNDLE" != "true" ]; then
            echo "::warning::从 R2 下载运行程序包失败，正在降级从 GitHub 仓库拉取..."
            export GIT_TERMINAL_PROMPT=0
            INSTALL_TOKEN=$(python3 -c "import json, base64, os; data=json.loads(base64.b64decode(os.environ.get('SYNC_ENV_B64', 'e30='))); print(data.get('GITHUB_PAT') or data.get('INSTALL_TOKEN') or '')")
            if [ -n "$INSTALL_TOKEN" ]; then
              echo "::add-mask::$INSTALL_TOKEN"
              pip install --quiet --disable-pip-version-check "git+https://x-access-token:${INSTALL_TOKEN}@github.com/malinkang/notionhub-core.git"
              pip install --quiet --disable-pip-version-check "git+https://x-access-token:${INSTALL_TOKEN}@github.com/malinkang/Podcast2NotionProNew.git"
            else
              pip install --quiet --disable-pip-version-check "git+https://github.com/malinkang/notionhub-core.git"
              pip install --quiet --disable-pip-version-check "git+https://github.com/malinkang/Podcast2NotionProNew.git"
            fi
          fi

      - name: 运行小宇宙单集同步
        env:
          SYNC_ENV_B64: ${{ github.event.inputs.sync_env_b64 }}
          EID: ${{ github.event.inputs.eid }}
          REQUEST_ID: ${{ github.event.inputs.request_id }}
          PYTHONUNBUFFERED: '1'
          TZ: 'Asia/Shanghai'
        run: |
          python3 -m podcast2notion.single_episode
