# NotionHub generated free workflow v2
name: 微信读书免费版

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 触发原因
        required: false
        default: manual
  schedule:
    - cron: "0 16 * * *"

permissions:
  contents: read

concurrency:
  group: notionhub-weread-sync-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  sync:
    name: 同步微信读书
    runs-on: ubuntu-latest
    env:
      FREE_CONFIG_JSON: ${{ secrets.WEREAD_FREE_CONFIG }}
      SOURCE_REPOSITORY: malinkang/weread2notion
      SOURCE_REF: 3c91227039c3770e8d3fc1ed7b9a29a276c1af33
      SOURCE_SHA: 3c91227039c3770e8d3fc1ed7b9a29a276c1af33
      REPOSITORY: ${{ github.repository }}
      ARTIFACT_BRANCH: ${{ github.event.repository.default_branch }}
      NOTIONHUB_ARTIFACT_ROOT: ${{ github.workspace }}/.notionhub-artifacts/weread
      NOTIONHUB_ARTIFACT_PATH: .notionhub-artifacts/weread
    steps:
      - name: Checkout Runner 仓库
        uses: actions/checkout@v4

      - name: 检查免费版配置
        id: config
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$FREE_CONFIG_JSON" ]; then
            echo "::error title=微信读书免费版未配置::请先在 NotionHub 插件里保存免费版配置。"
            exit 1
          fi
          CONFIG_FILE="$RUNNER_TEMP/notionhub-free-weread.json"
          printf '%s' "$FREE_CONFIG_JSON" > "$CONFIG_FILE"
          chmod 600 "$CONFIG_FILE"
          if jq -e '((.WEREAD_FREE_API_KEY // "") != "") or ((.WEREAD_FREE_NOTION_TOKEN // "") != "") or ((.WEREAD_FREE_NOTION_PAGE // "") != "") or ((.WEREAD_FREE_NOTION_DATABASE_ID // "") != "") or ((.WEREAD_FREE_NOTION_DATA_SOURCE_ID // "") != "")' "$CONFIG_FILE" >/dev/null 2>&1; then
            NORMALIZED_CONFIG_FILE="${CONFIG_FILE}.normalized"
            if ! jq 'if ((.WEREAD_FREE_API_KEY // "") != "")
                or ((.WEREAD_FREE_NOTION_TOKEN // "") != "")
                or ((.WEREAD_FREE_NOTION_PAGE // "") != "")
                or ((.WEREAD_FREE_NOTION_DATABASE_ID // "") != "")
                or ((.WEREAD_FREE_NOTION_DATA_SOURCE_ID // "") != "")
              then
                {
                  schemaVersion: 1,
                  notion: {
                    token: (.WEREAD_FREE_NOTION_TOKEN // ""),
                    pages: (
                      {}
                      + (if ((.WEREAD_FREE_NOTION_PAGE // "") != "") then {root: .WEREAD_FREE_NOTION_PAGE} else {} end)
                      + (if ((.WEREAD_FREE_NOTION_DATABASE_ID // "") != "") then {databaseId: .WEREAD_FREE_NOTION_DATABASE_ID} else {} end)
                      + (if ((.WEREAD_FREE_NOTION_DATA_SOURCE_ID // "") != "") then {dataSourceId: .WEREAD_FREE_NOTION_DATA_SOURCE_ID} else {} end)
                    )
                  },
                  account: {apiKey: (.WEREAD_FREE_API_KEY // "")},
                  options: {}
                }
              else
                .
              end' "$CONFIG_FILE" > "$NORMALIZED_CONFIG_FILE"; then
              echo "::error title=微信读书免费版配置无效::无法读取旧版配置，请回到 NotionHub 插件重新保存。"
              exit 1
            fi
            chmod 600 "$NORMALIZED_CONFIG_FILE"
            mv "$NORMALIZED_CONFIG_FILE" "$CONFIG_FILE"
          fi
          if ! jq -e '.schemaVersion == 1 and (.notion | type == "object") and (.account | type == "object") and (.options | type == "object")' "$CONFIG_FILE" >/dev/null; then
            echo "::error title=微信读书免费版配置无效::请回到 NotionHub 插件重新保存配置。"
            exit 1
          fi
          python3 - "$CONFIG_FILE" <<'PY'
          import json
          import sys

          def walk(value):
              if isinstance(value, dict):
                  for child in value.values():
                      yield from walk(child)
              elif isinstance(value, list):
                  for child in value:
                      yield from walk(child)
              elif isinstance(value, str) and len(value) >= 4:
                  yield value

          config = json.load(open(sys.argv[1], encoding='utf-8'))
          for value in walk(config):
              escaped = value.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::add-mask::{escaped}')
          PY
          require_value() {
            if [ -z "$(jq -r "$1 // empty" "$CONFIG_FILE")" ]; then
              echo "::error title=微信读书免费版配置缺失::缺少 $2，请回到插件重新保存。"
              exit 1
            fi
          }
          require_value '.notion.token' 'Notion token'
          require_value '.account.apiKey' 'WeRead API Key'
          if ! jq -e '((.notion.pages.root // "") != "") or ((.notion.pages.databaseId // "") != "") or ((.notion.pages.dataSourceId // "") != "")' "$CONFIG_FILE" >/dev/null; then
            echo "::error title=微信读书免费版模板缺失::缺少 Notion 页面、数据库或 data source。"
            exit 1
          fi
          echo "FREE_CONFIG_FILE=$CONFIG_FILE" >> "$GITHUB_ENV"
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Checkout 固定开源版本
        uses: actions/checkout@v4
        with:
          repository: malinkang/weread2notion
          ref: 3c91227039c3770e8d3fc1ed7b9a29a276c1af33
          path: .notionhub-source/weread
          persist-credentials: false

      - name: 校验开源版本
        working-directory: .notionhub-source/weread
        run: |
          ACTUAL_SHA=$(git rev-parse HEAD)
          if [ "$ACTUAL_SHA" != "$SOURCE_SHA" ]; then
            echo "::error title=开源版本校验失败::malinkang/weread2notion@3c91227039c3770e8d3fc1ed7b9a29a276c1af33 的提交与预期 SHA 不一致。"
            exit 1
          fi

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装开源同步程序
        working-directory: .notionhub-source/weread
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: 同步微信读书
        working-directory: .notionhub-source/weread
        run: |
          export WEREAD_API_KEY="$(jq -r '.account.apiKey' "$FREE_CONFIG_FILE")"
          export NOTION_TOKEN="$(jq -r '.notion.token' "$FREE_CONFIG_FILE")"
          export NOTION_PAGE="$(jq -r '.notion.pages.root // ""' "$FREE_CONFIG_FILE")"
          export NOTION_DATABASE_ID="$(jq -r '.notion.pages.databaseId // ""' "$FREE_CONFIG_FILE")"
          export NOTION_DATA_SOURCE_ID="$(jq -r '.notion.pages.dataSourceId // ""' "$FREE_CONFIG_FILE")"
          weread2notion sync

